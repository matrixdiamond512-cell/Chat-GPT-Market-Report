<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>株式市場分析｜WEBマーケットレポート</title>
<style>
:root{--navy:#071f56;--navy2:#092d78;--blue:#0b5fe8;--line:#cbd8ec;--soft:#f5f8fd;--text:#071b4a;--muted:#68758a;--green:#008453;--red:#e00022;--orange:#e48400;--purple:#6d45c4;--shadow:0 1px 4px rgba(7,27,74,.05)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.48}
.top{max-width:1640px;margin:0 auto;padding:14px 20px 8px;border-bottom:1px solid var(--line)}
.top h1{margin:0;color:var(--navy);font-size:clamp(28px,2.5vw,38px);line-height:1.1}
.status{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--navy);font-size:13px;font-weight:900}
.status:before{content:"";width:16px;height:16px;border:2px solid var(--navy);border-radius:3px;box-shadow:inset 0 4px 0 #fff;background:linear-gradient(#fff 0 34%,var(--navy) 34% 48%,#fff 48%)}
.nav{display:grid;grid-template-columns:repeat(10,minmax(118px,1fr));gap:10px;max-width:1640px;margin:0 auto;padding:14px 20px;overflow-x:auto}
.nav a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 12px;border:1px solid #1743a0;border-radius:5px;background:#fff;color:var(--navy);font-size:14px;font-weight:1000;text-decoration:none;white-space:nowrap}
.nav a[aria-current=page]{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff}
.page{max-width:1640px;margin:0 auto;padding:0 20px 28px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.panel{min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.panel-title{display:flex;align-items:center;gap:10px;margin:0;padding:7px 14px;background:linear-gradient(90deg,#063baf,#075fe8);color:#fff;font-size:16px;line-height:1.25;font-weight:1000}
.flag{display:inline-grid;place-items:center;width:24px;height:18px;border-radius:2px;background:#fff;font-size:16px}
.panel-body{padding:10px 12px}.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{border:1px solid var(--line);padding:6px 9px;font-size:13px;vertical-align:middle}
th{background:#eef3fb;color:var(--navy);font-weight:1000;text-align:center}
td:first-child{font-weight:900}.num{text-align:right;font-variant-numeric:tabular-nums}.comment{font-size:12.5px;font-weight:800}
.up{color:var(--green);font-weight:1000}.down{color:var(--red);font-weight:1000}.muted{color:var(--muted)}
.market-table{min-width:780px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-title{margin:0 0 6px;font-size:15px;font-weight:1000}.mini-title.up{color:var(--green)}.mini-title.down{color:var(--red)}
.rank-table{min-width:0}.rank-table th,.rank-table td{padding:6px 8px;white-space:nowrap}.rank-table td:nth-child(2){white-space:normal}
.reason{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:800;white-space:normal}
.sector-row{display:grid;grid-template-columns:38px 160px minmax(160px,1fr) 70px minmax(210px,1.2fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f8;font-size:13px}
.sector-row:last-child{border-bottom:0}.rank{color:#4c6380;font-weight:1000;text-align:center}.bar-track{height:13px;border-radius:999px;background:#eef3fa;overflow:hidden}.bar{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#078a53,#09a76c)}.bar.jp{background:linear-gradient(90deg,#0c7a54,#0db87b)}.bar.down-bar{background:linear-gradient(90deg,#d60021,#f15b70)}.sector-note{color:var(--muted);font-size:11.5px;font-weight:800}.sector-mover-group+.sector-mover-group{margin-top:12px;padding-top:12px;border-top:2px solid #dce5f2}.sector-source{float:right;color:var(--muted);font-size:10px;font-weight:800}
.bottom-cards{display:grid;grid-template-columns:1.05fr 1.15fr 1fr 1.15fr;gap:12px;margin-top:12px}.info-card{min-height:140px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:16px 18px;box-shadow:var(--shadow)}.info-card h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--navy);font-size:17px}.info-card ul{margin:0;padding-left:18px}.info-card li{margin:5px 0;font-weight:850;font-size:13px}.icon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#eef5ff;color:var(--blue);font-weight:1000}.conclusion{border-color:#8ecbb4;background:#fbfffd}.conclusion .icon{background:#078a53;color:#fff}.risk{border-color:#f3c57f;background:#fffdf8}.risk .icon{background:#fff0d8;color:var(--orange)}.watch{border-color:#cbbcf1}.watch .icon{background:#f1ebff;color:var(--purple)}.conclusion-main{margin:8px 0 6px;color:var(--green);font-size:22px;font-weight:1000}.conclusion-sub{font-size:15px;font-weight:900}
.analysis-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}.analysis-card{border:1px solid var(--line);border-radius:6px;background:#fff;padding:12px 14px;min-height:118px}.analysis-card h2{margin:0 0 8px;color:var(--blue);font-size:15px}.analysis-card p,.analysis-card li{margin:4px 0;font-size:12.5px;font-weight:800}.analysis-card ul{margin:0;padding-left:17px}.empty{border:1px dashed #b8c8df;border-radius:7px;padding:18px;background:#f8fbff;color:#173968;font-weight:900}.note{margin:14px 0 0;color:var(--muted);font-size:12px;font-weight:700}
@media(max-width:1200px){.pair-grid,.bottom-cards{grid-template-columns:1fr}.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:760px){.top{padding:12px}.nav{padding:10px 12px;grid-template-columns:repeat(10,minmax(128px,1fr))}.page{padding:0 12px 24px}.analysis-grid{grid-template-columns:1fr}.panel-title{font-size:14px}.sector-row{grid-template-columns:30px 112px minmax(90px,1fr) 58px;gap:6px}.sector-note{grid-column:2/-1}th,td{font-size:12px}}
</style>

<body>
<header class="top"><h1>WEBマーケットレポート</h1><div class="status" data-updated>更新日時：読込中</div></header>
<nav class="nav" aria-label="ページナビゲーション">
<a href="index.html">ダッシュボード</a><a href="report.html">マーケットレポート本文</a><a href="usdjpy-volume.html">東京市場ドル円出来高</a><a href="events.html">重要イベント</a><a href="rates-bonds.html">金利・債券市場</a><a href="stocks.html" aria-current="page">株式市場分析</a><a href="usdjpy-supply-demand.html">USD/JPY需給</a><a href="gold-supply-demand.html">ゴールド需給</a><a href="nikkei225-supply-demand.html">日経225需給</a>
</nav>
<main class="page" data-stocks-root><div class="empty">株式市場分析データを読み込んでいます。</div></main>
<script>
(() => {
  const root=document.querySelector('[data-stocks-root]'),updated=document.querySelector('[data-updated]');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const arr=v=>Array.isArray(v)?v:[];
  const cls=v=>{const t=String(v??'').trim();return t.startsWith('+')||/上昇|買い|改善|強/.test(t)?'up':t.startsWith('-')||t.startsWith('−')||/下落|売り|悪化|弱/.test(t)?'down':'muted'};
  const flag=c=>c==='US'?'🇺🇸':c==='JP'?'🇯🇵':'';
  const panel=(s,b)=>`<article class="panel"><h2 class="panel-title"><span class="flag">${flag(s?.flag)}</span>${esc((s?.title||'取得不能').replace('（上昇率TOP5）',''))}</h2>${b}</article>`;
  const table=(cols,rows,cn='')=>`<div class="table-wrap"><table class="${cn}"><thead><tr>${arr(cols).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${arr(rows).map(r=>`<tr>${arr(r).map((x,i)=>`<td class="${i===1||i===2?`num ${cls(x)}`:i===3?'comment':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const market=s=>panel(s,table(s?.columns,s?.rows,'market-table'));
  const rankRows=(items,type)=>arr(items).map(x=>`<tr>${type==='mover'?`<td class="num">${esc(x.rank)}</td>`:''}<td>${esc(x.name)}${x.reason?`<span class="reason">${esc(x.reason)}</span>`:''}</td>${type==='mover'?`<td class="num">${esc(x.close)}</td><td class="num ${cls(x.change)}">${esc(x.change)}</td>`:`<td class="num ${cls(x.contribution)}">${esc(x.contribution)}</td>`}</tr>`).join('');
  const moverTable=(title,items,kind)=>`<div class="table-wrap"><h3 class="mini-title ${kind}">${title}</h3><table class="rank-table"><thead><tr><th>順位</th><th>銘柄名</th><th>終値</th><th>騰落率</th></tr></thead><tbody>${rankRows(items,'mover')}</tbody></table></div>`;
  const movers=s=>panel(s,`<div class="panel-body split">${moverTable('大幅上昇（上位5）',s?.gainers,'up')}${moverTable('大幅下落（下位5）',s?.losers,'down')}</div>`);
  const sectorGroup=(items,title,kind,s)=>{const rows=arr(items).slice(0,5),max=Math.max(...rows.map(x=>Math.abs(parseFloat(String(x.change??x.changePct).replace(/[+％%]/g,'')))||0),0);return `<div class="sector-mover-group"><h3 class="mini-title ${kind}">${title}<span class="sector-source">${esc(s?.sourceLabel||'')}</span></h3>${rows.length?rows.map((x,i)=>{const n=Math.abs(parseFloat(String(x.change??x.changePct).replace(/[+％%]/g,'')))||0,w=max?Math.max(8,Math.round(n/max*100)):0;return `<div class="sector-row"><span class="rank">${i+1}</span><b>${esc(x.name)}</b><span class="bar-track"><span class="bar ${kind==='down'?'down-bar':s?.flag==='JP'?'jp':''}" style="width:${w}%"></span></span><b class="num ${kind}">${esc(x.change??x.changePct)}</b><span class="sector-note">${esc(x.note||'前営業日終値比')}</span></div>`}).join(''):`<div class="empty">${title}のデータを取得できません。</div>`}</div>`};
  const sector=s=>panel(s,`<div class="panel-body">${sectorGroup(s?.gainers||s?.rows,'上昇率TOP5','up',s)}${sectorGroup(s?.losers,'下落率TOP5','down',s)}</div>`);
  const contributionTable=(title,items,kind)=>`<div class="table-wrap"><h3 class="mini-title ${kind}">${title}</h3><table class="rank-table"><thead><tr><th>銘柄名</th><th>寄与度</th></tr></thead><tbody>${rankRows(items,'contribution')}</tbody></table></div>`;
  const contributions=s=>panel(s,`<div class="panel-body split">${contributionTable('寄与度上位 5 銘柄',s?.top,'up')}${contributionTable('寄与度下位 5 銘柄',s?.bottom,'down')}</div>`);
  const list=items=>`<ul>${arr(items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const card=(x,cn,icon,body)=>`<article class="info-card ${cn}"><h2><span class="icon">${icon}</span>${esc(x?.title)}</h2>${body}</article>`;
  const judgement=j=>{const c=j?.conclusion||{};return `<section class="bottom-cards">${card(c,'conclusion','✓',`<p class="conclusion-main">${esc(c.main)}</p><p class="conclusion-sub">${esc(c.sub)}</p>`)}${card(j?.reason,'reason-card','▮',list(j?.reason?.items))}${card(j?.risk,'risk','!',list(j?.risk?.items))}${card(j?.watch,'watch','◎',list(j?.watch?.items))}</section>`};
  const analyses=items=>`<section class="analysis-grid">${arr(items).map(x=>`<article class="analysis-card"><h2>${esc(x.title)}</h2>${x.items?list(x.items):`<p>${esc(x.body)}</p>`}</article>`).join('')}</section>`;
  function render(d){document.title=`${d.pageTitle||'株式市場分析'}｜WEBマーケットレポート`;updated.textContent=`更新日時：${d.updatedAt||'取得不能'} / データ状態：${d.sourceStatus||d.status||'取得不能'}`;root.innerHTML=`<section class="pair-grid" aria-label="主要指数と市場内部">${market(d.marketInternals?.us)}${market(d.marketInternals?.japan)}</section><section class="pair-grid" aria-label="大幅上昇・下落銘柄">${movers(d.movers?.us)}${movers(d.movers?.japan)}</section><section class="pair-grid" aria-label="セクター・業種">${sector(d.sectors?.us)}${sector(d.sectors?.japan)}</section><section class="pair-grid" aria-label="指数寄与度">${contributions(d.contributions?.us)}${contributions(d.contributions?.japan)}</section>${judgement(d.judgement)}${analyses(d.analysisCards)}<p class="note">${esc(d.note)}</p>`}
  Promise.all([fetch('data/stocks.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data/stocks.json HTTP '+r.status);return r.json()}),fetch('data/sector-performance.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,sectors])=>{if(sectors?.markets){d.sectors=d.sectors||{};for(const key of ['us','japan']){if(sectors.markets[key])d.sectors[key]={...(d.sectors[key]||{}),...sectors.markets[key],rows:sectors.markets[key].gainers||[]}}}render(d)}).catch(e=>{updated.textContent='更新日時：取得不能 / データ状態：読み込み失敗';root.innerHTML=`<div class="empty">株式市場分析データを表示できません。理由：${esc(e.message)}</div>`});
})();
</script>
<script src="assets/js/stock-sector-decliners.js?v=20260807-0713"></script>
<script src="assets/js/site-common.js?v=20260804-ui1"></script>
</body>
