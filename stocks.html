<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>株式市場分析｜WEBマーケットレポート</title>
<style>
:root{--navy:#071f56;--navy2:#092d78;--blue:#0b5fe8;--line:#cbd8ec;--soft:#f5f8fd;--text:#071b4a;--muted:#68758a;--green:#008453;--red:#e00022;--orange:#e48400;--purple:#6d45c4;--shadow:0 1px 4px rgba(7,27,74,.05)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.48}
.top{max-width:1640px;margin:0 auto;padding:14px 20px 8px;border-bottom:1px solid var(--line)}
.top h1{margin:0;color:var(--navy);font-size:clamp(28px,2.5vw,38px);line-height:1.1}
.status{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--navy);font-size:13px;font-weight:900}
.status:before{content:"";width:16px;height:16px;border:2px solid var(--navy);border-radius:3px;box-shadow:inset 0 4px 0 #fff;background:linear-gradient(#fff 0 34%,var(--navy) 34% 48%,#fff 48%)}
.nav{display:grid;grid-template-columns:repeat(10,minmax(118px,1fr));gap:10px;max-width:1640px;margin:0 auto;padding:14px 20px;overflow-x:auto}
.nav a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 12px;border:1px solid #1743a0;border-radius:5px;background:#fff;color:var(--navy);font-size:14px;font-weight:1000;text-decoration:none;white-space:nowrap}
.nav a[aria-current=page]{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff}
.page{max-width:1640px;margin:0 auto;padding:0 20px 28px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.panel{min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.panel-title{display:flex;align-items:center;gap:10px;margin:0;padding:7px 14px;background:linear-gradient(90deg,#063baf,#075fe8);color:#fff;font-size:16px;line-height:1.25;font-weight:1000}
.flag{display:inline-grid;place-items:center;width:24px;height:18px;border-radius:2px;background:#fff;font-size:16px}
.panel-body{padding:10px 12px}.table-wrap{overflow:auto}.component-freshness{display:flex;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid #e3ebf7;background:#f7faff;color:#52647f;font-size:11px;font-weight:900}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{border:1px solid var(--line);padding:6px 9px;font-size:13px;vertical-align:middle}
th{background:#eef3fb;color:var(--navy);font-weight:1000;text-align:center}
td:first-child{font-weight:900}.num{text-align:right;font-variant-numeric:tabular-nums}.comment{font-size:12.5px;font-weight:800}
.up{color:var(--green);font-weight:1000}.down{color:var(--red);font-weight:1000}.muted{color:var(--muted)}
.market-table{min-width:780px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-title{margin:0 0 6px;font-size:15px;font-weight:1000}.mini-title.up{color:var(--green)}.mini-title.down{color:var(--red)}
.rank-table{min-width:0}.rank-table th,.rank-table td{padding:6px 8px;white-space:nowrap}.rank-table td:nth-child(2){white-space:normal}
.reason{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:800;white-space:normal}
.sector-row{display:grid;grid-template-columns:38px 160px minmax(160px,1fr) 70px minmax(210px,1.2fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f8;font-size:13px}
.sector-row:last-child{border-bottom:0}.rank{color:#4c6380;font-weight:1000;text-align:center}.bar-track{height:13px;border-radius:999px;background:#eef3fa;overflow:hidden}.bar,.bar.jp,.sector-row .bar:not(.down-bar){display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#d34a6a,#ad2046)!important}.bar.down-bar{background:linear-gradient(90deg,#4d87c4,#1f5795)!important}.sector-note{color:var(--muted);font-size:11.5px;font-weight:800}.sector-mover-group+.sector-mover-group{margin-top:12px;padding-top:12px;border-top:2px solid #dce5f2}.sector-source{float:right;color:var(--muted);font-size:10px;font-weight:800}
.bottom-cards{display:grid;grid-template-columns:1.05fr 1.15fr 1fr 1.15fr;gap:12px;margin-top:12px}.info-card{min-height:140px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:16px 18px;box-shadow:var(--shadow)}.info-card h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--navy);font-size:17px}.info-card ul{margin:0;padding-left:18px}.info-card li{margin:5px 0;font-weight:850;font-size:13px}.icon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#eef5ff;color:var(--blue);font-weight:1000}.conclusion{border-color:#8ecbb4;background:#fbfffd}.conclusion .icon{background:#078a53;color:#fff}.risk{border-color:#f3c57f;background:#fffdf8}.risk .icon{background:#fff0d8;color:var(--orange)}.watch{border-color:#cbbcf1}.watch .icon{background:#f1ebff;color:var(--purple)}.conclusion-main{margin:8px 0 6px;color:var(--green);font-size:22px;font-weight:1000}.conclusion-sub{font-size:15px;font-weight:900}
.analysis-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}.analysis-card{border:1px solid var(--line);border-radius:6px;background:#fff;padding:12px 14px;min-height:118px}.analysis-card h2{margin:0 0 8px;color:var(--blue);font-size:15px}.analysis-card p,.analysis-card li{margin:4px 0;font-size:12.5px;font-weight:800}.analysis-card ul{margin:0;padding-left:17px}.empty{border:1px dashed #b8c8df;border-radius:7px;padding:18px;background:#f8fbff;color:#173968;font-weight:900}.note{margin:14px 0 0;color:var(--muted);font-size:12px;font-weight:700}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 0 10px;padding:10px 2px 8px;border-bottom:2px solid #dbe5f3}.section-head h2{margin:0;color:var(--navy);font-size:20px}.section-head p{margin:0;color:var(--muted);font-size:12px;font-weight:800;text-align:right}.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.session-panel{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow);overflow:hidden}.session-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(90deg,#062d7b,#075fe8);color:#fff}.session-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:1000}.session-badge{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.16);font-size:11px;font-weight:1000;white-space:nowrap}.session-meta{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#f7faff;border-bottom:1px solid #e3ebf7;color:#52647f;font-size:11px;font-weight:900}.session-meta span{padding:3px 7px;border-radius:999px;background:#fff;border:1px solid #d7e2f1}.session-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px}.kpi{min-width:0;border:1px solid #e0e8f3;border-radius:6px;background:#fbfdff;padding:9px 10px}.kpi-label{display:block;color:#61728b;font-size:11px;font-weight:900}.kpi-value{display:block;margin-top:2px;color:var(--navy);font-size:16px;font-weight:1000;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.kpi-change{display:block;margin-top:1px;font-size:11px;font-weight:1000}.session-insights{margin:0 12px 10px;padding:10px 12px;border-radius:6px;background:#f7f9fd}.session-insights h3{margin:0 0 5px;color:var(--navy);font-size:13px}.session-insights ul{margin:0;padding-left:18px}.session-insights li{margin:3px 0;font-size:12px;font-weight:800}.session-judgement{margin:0 12px 12px;padding:10px 12px;border-left:4px solid var(--blue);background:#eef5ff;color:#123566;font-size:12.5px;font-weight:900}.bridge{margin:0 0 14px;border:1px solid #a9bddb;border-radius:8px;background:linear-gradient(180deg,#fbfdff,#f4f8fe);padding:14px}.bridge h2{margin:0 0 10px;color:var(--navy);font-size:18px}.bridge-flow{display:grid;grid-template-columns:1fr 38px 1fr 38px 1fr;align-items:stretch;gap:6px}.flow-step{border:1px solid #cfdaea;border-radius:7px;background:#fff;padding:10px 12px}.flow-step b{display:block;color:var(--blue);font-size:13px;margin-bottom:4px}.flow-step p{margin:0;font-size:12px;font-weight:850;color:#253f66}.flow-arrow{display:grid;place-items:center;color:var(--blue);font-size:20px;font-weight:1000}.bridge-conclusion{margin:10px 0 0;padding:10px 12px;border-radius:6px;background:#071f56;color:#fff;font-size:13px;font-weight:900}.subsection-label{margin:16px 0 8px;color:var(--navy);font-size:18px;font-weight:1000}
@media(max-width:980px){.pair-grid,.bottom-cards,.session-grid{grid-template-columns:1fr}.analysis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.session-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.bridge-flow{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg);min-height:22px}}
@media(max-width:760px){.top{padding:12px}.nav{padding:10px 12px;grid-template-columns:repeat(10,minmax(128px,1fr))}.page{padding:0 12px 24px}.analysis-grid{grid-template-columns:1fr}.panel-title{font-size:14px}.sector-row{grid-template-columns:30px 112px minmax(90px,1fr) 58px;gap:6px}.sector-note{grid-column:2/-1}th,td{font-size:12px}.section-head{display:block}.section-head p{margin-top:4px;text-align:left}.session-header{align-items:flex-start;flex-direction:column}.session-kpis{grid-template-columns:1fr 1fr}.kpi-value{font-size:14px}}
</style>
<style>.context-label{margin:0 0 8px;color:var(--navy);font-size:13px;font-weight:1000}</style>

<body>
<header class="top"><div><h1>マーケット分析ポータル</h1><span class="unified-page-name">株式市場分析</span></div><div class="status" data-updated>更新日時：読込中</div></header>

<main class="page" data-stocks-root><div class="empty">株式市場分析データを読み込んでいます。</div></main>
<script>
/* Legacy latest-data renderer retired; Version 7.01 is the sole renderer.
(() => {
  const root=document.querySelector('[data-stocks-root]'),updated=document.querySelector('[data-updated]');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const arr=v=>Array.isArray(v)?v:[];
  const cls=v=>{const t=String(v??'').trim();return t.startsWith('+')||/上昇|買い|改善|強/.test(t)?'up':t.startsWith('-')||t.startsWith('−')||/下落|売り|悪化|弱/.test(t)?'down':'muted'};
  const flag=c=>c==='US'?'🇺🇸':c==='JP'?'🇯🇵':'';
  const panel=(s,b)=>`<article class="panel"><h2 class="panel-title"><span class="flag">${flag(s?.flag)}</span>${esc((s?.title||'取得不能').replace('（上昇率TOP5）',''))}</h2><div class="component-freshness"><span>基準日 ${esc(s?.dataDate||s?.asOfDate||s?.sourceDate||'取得不能')}</span><span>最終取得 ${esc(s?.updatedAt||s?.fetchedAt||'取得日時なし')}</span><span>${esc(s?.frequency||'更新頻度未設定')}</span><span>${esc(s?.status||'状態未設定')}</span></div>${b}</article>`;
  const table=(cols,rows,cn='')=>`<div class="table-wrap"><table class="${cn}"><thead><tr>${arr(cols).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${arr(rows).map(r=>`<tr>${arr(r).map((x,i)=>`<td class="${i===1||i===2?`num ${cls(x)}`:i===3?'comment':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const market=s=>panel(s,table(s?.columns,s?.rows,'market-table'));
  const rankRows=(items,type)=>arr(items).map(x=>`<tr>${type==='mover'?`<td class="num">${esc(x.rank)}</td>`:''}<td>${esc(x.name)}${x.reason?`<span class="reason">${esc(x.reason)}</span>`:''}</td>${type==='mover'?`<td class="num">${esc(x.close)}</td><td class="num ${cls(x.change)}">${esc(x.change)}</td>`:`<td class="num ${cls(x.contribution)}">${esc(x.contribution)}</td>`}</tr>`).join('');
  const moverTable=(title,items,kind)=>`<div class="table-wrap"><h3 class="mini-title ${kind}">${title}</h3><table class="rank-table"><thead><tr><th>順位</th><th>銘柄名</th><th>終値</th><th>騰落率</th></tr></thead><tbody>${rankRows(items,'mover')}</tbody></table></div>`;
  const movers=s=>panel(s,`<div class="panel-body split">${moverTable('大幅上昇（上位5）',s?.gainers,'up')}${moverTable('大幅下落（下位5）',s?.losers,'down')}</div>`);
  const sectorGroup=(items,title,kind,s)=>{const rows=arr(items).slice(0,5),max=Math.max(...rows.map(x=>Math.abs(parseFloat(String(x.change??x.changePct).replace(/[+％%]/g,'')))||0),0);return `<div class="sector-mover-group"><h3 class="mini-title ${kind}">${title}<span class="sector-source">${esc(s?.sourceLabel||'')}</span></h3>${rows.length?rows.map((x,i)=>{const n=Math.abs(parseFloat(String(x.change??x.changePct).replace(/[+％%]/g,'')))||0,w=max?Math.max(8,Math.round(n/max*100)):0;return `<div class="sector-row"><span class="rank">${i+1}</span><b>${esc(x.name)}</b><span class="bar-track"><span class="bar ${kind==='down'?'down-bar':s?.flag==='JP'?'jp':''}" style="width:${w}%"></span></span><b class="num ${kind}">${esc(x.change??x.changePct)}</b><span class="sector-note">${esc(x.note||'前営業日終値比')}</span></div>`}).join(''):`<div class="empty">${title}のデータを取得できません。</div>`}</div>`};
  const sector=s=>panel(s,`<div class="panel-body">${sectorGroup(s?.gainers||s?.rows,'上昇率TOP5','up',s)}${sectorGroup(s?.losers,'下落率TOP5','down',s)}</div>`);
  const contributionTable=(title,items,kind)=>`<div class="table-wrap"><h3 class="mini-title ${kind}">${title}</h3><table class="rank-table"><thead><tr><th>銘柄名</th><th>寄与度</th></tr></thead><tbody>${rankRows(items,'contribution')}</tbody></table></div>`;
  const contributions=s=>panel(s,`<div class="panel-body split">${contributionTable('寄与度上位 5 銘柄',s?.top,'up')}${contributionTable('寄与度下位 5 銘柄',s?.bottom,'down')}</div>`);
  const list=items=>`<ul>${arr(items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const card=(x,cn,icon,body)=>`<article class="info-card ${cn}"><h2><span class="icon">${icon}</span>${esc(x?.title)}</h2>${body}</article>`;
  const judgement=j=>{const c=j?.conclusion||{};return `<section class="bottom-cards">${card(c,'conclusion','✓',`<p class="conclusion-main">${esc(c.main)}</p><p class="conclusion-sub">${esc(c.sub)}</p>`)}${card(j?.reason,'reason-card','▮',list(j?.reason?.items))}${card(j?.risk,'risk','!',list(j?.risk?.items))}${card(j?.watch,'watch','◎',list(j?.watch?.items))}</section>`};
  const analyses=items=>`<section class="analysis-grid">${arr(items).map(x=>`<article class="analysis-card"><h2>${esc(x.title)}</h2>${x.items?list(x.items):`<p>${esc(x.body)}</p>`}</article>`).join('')}</section>`;
  const findRow=(s,re)=>arr(s?.rows).find(r=>re.test(String(r?.[0]||'')));
  const toMetric=(row,label)=>row?{label,value:row[1]||'取得不能',change:row[2]||'',note:row[3]||''}:{label,value:'取得不能',change:'',note:''};
  const sessionFallback=(kind,d)=>{
    const s=kind==='tokyo'?d.marketInternals?.japan:d.marketInternals?.us;
    if(kind==='tokyo'){
      return {title:'東京市場 朝の寄り付き分析',flag:'JP',status:'寄り付き専用データ未取得',dataDate:s?.dataDate,updatedAt:s?.updatedAt,metrics:[toMetric(findRow(s,/^日経225$/),'日経225'),toMetric(findRow(s,/^TOPIX$/),'TOPIX'),toMetric(findRow(s,/値上がり銘柄/),'値上がり / 値下がり'),toMetric(findRow(s,/売買代金/),'東証プライム売買代金'),toMetric(findRow(s,/日経VI/),'日経VI')],insights:['寄り付き専用の「寄り値」「9:00→9:15の方向」「ギャップ維持率」は専用データ連携後に表示します。','現時点では直近の東京市場内部データを補助表示し、指数だけでなく市場の広がりを確認します。'],judgement:'高寄り・安寄りだけで判断せず、寄り後15分の方向、値上がり/値下がりの広がり、先物とUSD/JPYの整合性を重視します。'};
    }
    return {title:'米国市場 プレマーケット分析',flag:'US',status:'プレマーケット専用データ未取得',dataDate:s?.dataDate,updatedAt:s?.updatedAt,metrics:[toMetric(findRow(s,/S&P500/),'S&P500'),toMetric(findRow(s,/Nasdaq/),'Nasdaq'),toMetric(findRow(s,/Russell2000/),'Russell2000'),toMetric(findRow(s,/VIX/),'VIX'),toMetric(findRow(s,/NYSE 値上がり/),'NYSE 値上がり / 値下がり')],insights:['プレマーケット専用の株価・出来高・指数先物・米2年/10年金利は専用データ連携後に表示します。','通常取引前は先物だけでなく、大型テックのプレマーケット変化率と出来高を合わせて確認します。'],judgement:'プレマーケットは出来高が薄いため、変化率だけで強弱を決めず、指数先物・金利・ドル・大型株の出来高を組み合わせて判断します。'};
  };
  const normalizeSession=(s,f)=>s&&typeof s==='object'?{...f,...s,metrics:arr(s.metrics).length?s.metrics:f.metrics,insights:arr(s.insights).length?s.insights:f.insights}:f;
  const sessionCard=s=>`<article class="session-panel"><div class="session-header"><div class="session-title"><span class="flag">${flag(s.flag)}</span>${esc(s.title)}</div><span class="session-badge">${esc(s.status||'状態取得不能')}</span></div><div class="session-meta"><span>基準日 ${esc(s.dataDate||'取得不能')}</span><span>更新 ${esc(s.updatedAt||'取得不能')}</span></div><div class="session-kpis">${arr(s.metrics).filter(x=>x&&x.value!==''&&x.value!=null).map(x=>`<div class="kpi"><span class="kpi-label">${esc(x.label)}</span><span class="kpi-value ${cls(x.change)}">${esc(x.value)}</span>${x.change?`<span class="kpi-change ${cls(x.change)}">${esc(x.change)}</span>`:''}</div>`).join('')}</div>${arr(s.insights).length?`<div class="session-insights"><h3>見るポイント</h3>${list(s.insights)}</div>`:''}${s.judgement?`<div class="session-judgement">${esc(s.judgement)}</div>`:''}</article>`;
  const bridgeFallback=d=>{
    const jp=d.marketInternals?.japan,us=d.marketInternals?.us;
    const nk=findRow(jp,/^日経225$/),breadth=findRow(jp,/値上がり銘柄/),sp=findRow(us,/S&P500/),nas=findRow(us,/Nasdaq/);
    return {title:'日米市場の引き継ぎ分析',steps:[{label:'東京市場',text:[nk?`日経225 ${nk[2]}`:'日経225 取得不能',breadth?`市場内部 ${breadth[1]}`:'市場内部 取得不能'].join(' / ')},{label:'米国プレマーケット',text:'指数先物・米金利・大型株プレマーケットの専用データを連携後にここで判定'},{label:'米国通常市場',text:[sp?`S&P500 ${sp[2]}`:'S&P500 取得不能',nas?`Nasdaq ${nas[2]}`:'Nasdaq 取得不能'].join(' / ')}],conclusion:[d.judgement?.conclusion?.main,d.judgement?.conclusion?.sub].filter(Boolean).join(' — ')||'日米の市場内部と時間帯ごとの反応を比較して引き継ぎを判定します。'};
  };
  const bridgeSection=b=>`<section class="bridge"><h2>${esc(b.title||'日米市場の引き継ぎ分析')}</h2><div class="bridge-flow">${arr(b.steps).slice(0,3).map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="flow-step"><b>${esc(x.label)}</b><p>${esc(x.text)}</p></div>`).join('')}</div><p class="bridge-conclusion">${esc(b.conclusion||'判定データ取得不能')}</p></section>`;
  const sessionAnalysis=d=>{
