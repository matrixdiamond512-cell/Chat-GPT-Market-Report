<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>マーケットレポート本文｜WEBマーケットレポート</title>
<style>
:root{
  --navy:#061d4c;
  --blue:#0b63e5;
  --line:#d5deec;
  --soft:#f7faff;
  --text:#071b4a;
  --muted:#65748c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  line-height:1.82;
}
.topbar{border-bottom:1px solid var(--line);background:#fff}
.top-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  max-width:1500px;
  margin:0 auto;
  padding:12px 22px 8px;
}
.brand{margin:0;color:var(--navy);font-size:26px;line-height:1.15;font-weight:1000;letter-spacing:0}
.top-meta{display:flex;align-items:center;gap:12px;color:#173968;font-size:13px;font-weight:850;white-space:nowrap}
.update-btn{
  border:1px solid #b8c8df;
  border-radius:6px;
  background:#fff;
  color:#0b3572;
  padding:7px 12px;
  font-weight:900;
  cursor:pointer;
}
.nav{
  display:grid;
  grid-template-columns:repeat(8,minmax(132px,1fr));
  max-width:1500px;
  margin:0 auto;
  padding:0 22px 10px;
  gap:6px;
}
.nav a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 10px;
  border:1px solid #c4d2e5;
  border-radius:5px;
  background:#fff;
  color:#082a5b;
  text-decoration:none;
  font-size:13px;
  font-weight:950;
  white-space:nowrap;
}
.nav a[aria-current=page]{background:var(--blue);border-color:var(--blue);color:#fff}
.page{max-width:1060px;margin:0 auto;padding:18px 22px 42px}
.status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  color:#173968;
  font-size:13px;
  font-weight:850;
  margin-bottom:10px;
}
.status small{color:var(--muted);font-weight:800}
.controls{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:center;
  margin:0 0 22px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.time-tabs{display:flex;gap:9px;flex-wrap:wrap}
.time-tab{
  min-width:80px;
  height:36px;
  border:1px solid #b8c8df;
  border-radius:6px;
  background:#fff;
  color:#071b4a;
  font-size:14px;
  font-weight:1000;
  cursor:pointer;
}
.time-tab.is-active{background:#0b63e5;border-color:#0b63e5;color:#fff}
.time-tab:disabled{color:#a0adbf;background:#f6f8fb;cursor:not-allowed}
.date-controls{display:flex;align-items:center;gap:8px}
.date-picker{
  min-width:180px;
  height:36px;
  border:1px solid #b8c8df;
  border-radius:6px;
  color:#071b4a;
  font-size:14px;
  font-weight:1000;
  text-align:center;
  padding:0 10px;
  background:#fff;
  color-scheme:light;
  cursor:pointer;
}
.date-picker::-webkit-calendar-picker-indicator{cursor:pointer}
.date-label{
  min-width:142px;
  color:#173968;
  font-size:13px;
  font-weight:950;
  white-space:nowrap;
}
.icon-btn{
  width:36px;
  height:36px;
  border:1px solid #b8c8df;
  border-radius:6px;
  background:#fff;
  color:#0b3572;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
}
.report{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  box-shadow:0 1px 8px rgba(7,27,74,.05);
  overflow:hidden;
}
.report-head{
  padding:28px 30px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#fafcff);
}
.report-title{
  margin:0;
  color:var(--navy);
  font-size:28px;
  line-height:1.3;
  font-weight:1000;
  letter-spacing:0;
}
.report-meta{
  margin:16px 0 0;
  color:#31476a;
  font-size:14px;
  font-weight:800;
  line-height:1.8;
}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:2px 9px;
  border:1px solid #bcd1ee;
  border-radius:999px;
  background:#f0f6ff;
  color:#0a4eaa;
  font-size:12px;
  font-weight:900;
}
.report-body{padding:6px 30px 30px}
.section{
  padding:26px 0 24px;
  border-bottom:1px solid var(--line);
}
.section:last-child{border-bottom:0}
.section h2{
  position:relative;
  margin:0 0 18px;
  padding-left:15px;
  color:#0a56bd;
  font-size:18px;
  line-height:1.35;
  font-weight:1000;
}
.section h2:before{
  content:"";
  position:absolute;
  left:0;
  top:.08em;
  width:4px;
  height:1.35em;
  border-radius:4px;
  background:#0b63e5;
}
.section p{
  margin:0;
  color:#0b1f45;
  font-size:15px;
  font-weight:750;
  line-height:1.9;
  overflow-wrap:anywhere;
}
.section ul{
  display:grid;
  gap:7px;
  margin:0;
  padding-left:1.2em;
}
.section li{
  color:#0b1f45;
  font-size:15px;
  font-weight:750;
  line-height:1.85;
  overflow-wrap:anywhere;
}
.market-list{display:grid;gap:18px}
.market-item{
  padding:0 0 0 14px;
  border-left:3px solid #d8e6fb;
}
.market-item h3{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin:0 0 6px;
  color:#082a5b;
  font-size:16px;
  font-weight:1000;
}
.market-item h3 small{color:#0b63e5;font-size:13px;font-weight:950}
.market-item dl{
  display:grid;
  grid-template-columns:82px minmax(0,1fr);
  gap:3px 12px;
  margin:0;
}
.market-item dt{
  color:#0b63e5;
  font-size:13px;
  font-weight:1000;
}
.market-item dd{
  margin:0;
  color:#0b1f45;
  font-size:14px;
  font-weight:750;
  line-height:1.75;
  overflow-wrap:anywhere;
}
.empty{
  border:1px dashed #b8c8df;
  border-radius:7px;
  padding:18px;
  background:#f8fbff;
  color:#173968;
  font-weight:900;
}
.footnote{
  margin:14px 0 0;
  color:#51647f;
  font-size:12px;
  font-weight:800;
}
@media(max-width:1020px){
  .nav{display:flex;overflow:auto}
  .nav a{min-width:132px}
  .controls{grid-template-columns:1fr}
}
@media(max-width:720px){
  .top-inner{align-items:flex-start;flex-direction:column;padding:12px 12px 8px}
  .brand{font-size:23px}
  .top-meta{width:100%;justify-content:space-between;white-space:normal}
  .nav{padding:0 12px 10px}
  .page{padding:14px 10px 30px}
  .status{display:grid}
  .date-controls{width:100%}
  .date-picker{min-width:0;width:100%}
  .date-label{display:none}
  .time-tab{min-width:72px;flex:1 1 72px}
  .report-head{padding:22px 18px 18px}
  .report-title{font-size:22px}
  .report-body{padding:2px 18px 22px}
  .section{padding:22px 0 20px}
  .section h2{font-size:17px}
  .section p,.section li{font-size:14px}
  .market-item dl{grid-template-columns:64px minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <h1 class="brand">WEBマーケットレポート</h1>
    <div class="top-meta">
      <span id="lastUpdated">読込中</span>
      <button class="update-btn" type="button" onclick="location.reload()">更新</button>
    </div>
  </div>
  <nav class="nav" aria-label="ページ移動">
    <a href="index.html">ダッシュボード</a>
    <a href="report.html" aria-current="page">マーケットレポート本文</a>
    <a href="usdjpy-volume.html">東京市場ドル円出来高</a>
    <a href="events.html">重要イベント一覧</a>
    <a href="stocks.html">株式市場分析</a>
    <a href="usdjpy-supply-demand.html">USD/JPY需給</a>
    <a href="gold-supply-demand.html">ゴールド需給</a>
    <a href="nikkei225-supply-demand.html">日経225需給</a>
  </nav>
</header>

<main class="page">
  <div class="status">
    <div id="reportStatus">reports.json から本文を読み込みます。</div>
    <small>ダッシュボードではなく、本文を読むためのページです</small>
  </div>

  <div class="controls">
    <div id="timeTabs" class="time-tabs" aria-label="時間帯"></div>
    <div class="date-controls" aria-label="日付選択">
      <button id="prevDate" class="icon-btn" type="button" aria-label="前の日">‹</button>
      <input id="datePicker" class="date-picker" type="date" aria-label="日付をカレンダーで選択">
      <span id="dateLabel" class="date-label"></span>
      <button id="nextDate" class="icon-btn" type="button" aria-label="次の日">›</button>
    </div>
  </div>

  <div id="app" class="empty">本文データを読み込んでいます。</div>
  <p class="footnote">本レポートは投資判断の参考情報であり、特定の投資を推奨するものではありません。</p>
</main>

<script>
const REPORT_TIMES = ["07:00","12:00","16:00","21:00"];
let reports = [];
let selectedReport = null;

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function asArray(value){
  if (Array.isArray(value)) return value.filter(Boolean);
  if (value === null || value === undefined || value === "") return [];
  return [value];
}

function text(value){
  return String(value ?? "").replace(/\s+/g," ").trim();
}

function dateToJp(dateText){
  if (!dateText) return "日付未設定";
  const date = new Date(`${dateText}T00:00:00+09:00`);
  if (Number.isNaN(date.getTime())) return dateText;
  const days = ["日","月","火","水","木","金","土"];
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}/${m}/${d}（${days[date.getDay()]}）`;
}

function reportKey(report){
  return `${report.date || ""} ${report.time || ""}`;
}

function sortReports(list){
  return list
    .filter((report) => report && report.date)
    .sort((a,b) => reportKey(b).localeCompare(reportKey(a)));
}

function uniqueDates(){
  return [...new Set(reports.map((report) => report.date))].sort().reverse();
}

function reportsForDate(dateText){
  return reports
    .filter((report) => report.date === dateText)
    .sort((a,b) => REPORT_TIMES.indexOf(a.time) - REPORT_TIMES.indexOf(b.time));
}

function resolveAvailableDate(dateText){
  const dates = uniqueDates();
  if (!dates.length) return dateText;
  if (dates.includes(dateText)) return dateText;
  const ascending = dates.slice().sort();
  const nearestPast = ascending.filter((date) => date <= dateText).at(-1);
  return nearestPast || ascending[0];
}

function selectReport(dateText, timeText){
  const resolvedDate = resolveAvailableDate(dateText);
  const sameDate = reportsForDate(resolvedDate);
  selectedReport = sameDate.find((report) => report.time === timeText) || sameDate.at(-1) || reports[0];
  render();
  const url = new URL(location.href);
  url.searchParams.set("date", selectedReport.date || "");
  url.searchParams.set("time", selectedReport.time || "");
  history.replaceState(null,"",url);
}

function renderControls(report){
  const dates = uniqueDates();
  const datePicker = $("datePicker");
  datePicker.value = report.date || "";
  datePicker.min = dates.at(-1) || "";
  datePicker.max = dates[0] || "";
  datePicker.onchange = () => selectReport(datePicker.value, report.time);
  $("dateLabel").textContent = dateToJp(report.date);

  const availableTimes = new Set(reportsForDate(report.date).map((item) => item.time));
  $("timeTabs").innerHTML = REPORT_TIMES.map((time) => {
    const active = time === report.time ? " is-active" : "";
    const disabled = availableTimes.has(time) ? "" : " disabled";
    return `<button type="button" class="time-tab${active}" data-time="${esc(time)}"${disabled}>${esc(time)}</button>`;
  }).join("");
  $("timeTabs").querySelectorAll("button:not(:disabled)").forEach((button) => {
    button.addEventListener("click", () => selectReport(report.date, button.dataset.time));
  });

  const index = dates.indexOf(report.date);
  $("prevDate").disabled = index < 0 || index >= dates.length - 1;
  $("nextDate").disabled = index <= 0;
  $("prevDate").onclick = () => index >= 0 && index < dates.length - 1 && selectReport(dates[index + 1], report.time);
  $("nextDate").onclick = () => index > 0 && selectReport(dates[index - 1], report.time);
}

function renderParagraph(value, fallback){
  const body = text(value) || fallback;
  return `<p>${esc(body)}</p>`;
}

function renderList(values, fallback){
  const items = asArray(values).map(text).filter(Boolean);
  if (!items.length) return `<p>${esc(fallback)}</p>`;
  return `<ul>${items.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
}

function renderSection(number, title, html){
  return `
    <section class="section">
      <h2>${number}. ${esc(title)}</h2>
      ${html}
    </section>
  `;
}

function renderMarketList(markets){
  const list = asArray(markets).filter((item) => item && typeof item === "object");
  if (!list.length) return `<p>本文JSONに個別市場の見通しがありません。</p>`;

  return `
    <div class="market-list">
      ${list.map((market) => {
        const rows = [
          ["方向", market.direction],
          ["価格", market.price],
          ["前日比", market.change],
          ["材料", market.material],
          ["ポジション", market.positioning],
          ["水準", market.levels],
          ["メイン", market.mainScenario],
          ["代替", market.alternativeScenario],
          ["崩れる条件", market.breakCondition],
          ["リスク", market.risk]
        ].filter(([,value]) => text(value));
        return `
          <article class="market-item">
            <h3>${esc(market.name || "市場")}<small>${esc(text(market.direction))}</small></h3>
            <dl>
              ${rows.map(([key,value]) => `<dt>${esc(key)}</dt><dd>${esc(text(value))}</dd>`).join("")}
            </dl>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

function renderReport(report){
  const updated = report.updatedAt || report.generatedAt || report.publishedAt || "";
  $("lastUpdated").textContent = `表示中: ${dateToJp(report.date)} ${report.time || ""}`;
  $("reportStatus").textContent = updated
    ? `本文JSON読込済み / データ更新: ${updated}`
    : "本文JSON読込済み";

  const title = report.title || `マーケットレポート｜${dateToJp(report.date)} ${report.time || ""}`;

  $("app").className = "report";
  $("app").innerHTML = `
    <header class="report-head">
      <h1 class="report-title">${esc(title)}</h1>
      <p class="report-meta">
        作成日時：${esc(dateToJp(report.date))} ${esc(report.time || "")}<br>
        対象：${esc(asArray(report.tags).join("、") || "主要市場")}
      </p>
      <div class="tags">${asArray(report.tags).slice(0,10).map((tag) => `<span class="tag">${esc(tag)}</span>`).join("")}</div>
    </header>
    <article class="report-body">
      ${renderSection(1, "今日の相場テーマ", renderParagraph(report.theme, "本文JSONに相場テーマがありません。"))}
      ${renderSection(2, "前回からの主な変化", renderList(report.changes, "本文JSONに変化情報がありません。"))}
      ${renderSection(3, "材料と値動きの整合性", renderList(report.consistency, "本文JSONに整合性コメントがありません。"))}
      ${renderSection(4, "今日の主導市場", renderParagraph(report.leadingMarket, "本文JSONに主導市場コメントがありません。"))}
      ${renderSection(5, "重要ニュース", renderList(report.news, "本文JSONに重要ニュースがありません。"))}
      ${renderSection(6, "クロスアセット資金フロー", renderList(report.crossAssetFlow, "本文JSONに資金フロー情報がありません。"))}
      ${renderSection(7, "需給・ポジション", renderList(report.positioning, "本文JSONに需給・ポジション情報がありません。"))}
      ${renderSection(8, "個別市場の見通し", renderMarketList(report.markets))}
      ${renderSection(9, "メインシナリオ", renderParagraph(report.mainScenario, "本文JSONにメインシナリオがありません。"))}
      ${renderSection(10, "代替シナリオ", renderParagraph(report.alternativeScenario, "本文JSONに代替シナリオがありません。"))}
      ${renderSection(11, "崩れる条件", renderParagraph(report.breakConditions, "本文JSONに崩れる条件がありません。"))}
      ${renderSection(12, "重要イベント", renderList(report.events, "本文JSONに重要イベントがありません。"))}
      ${renderSection(13, "次の時間帯への引き継ぎ", renderList(report.handover, "本文JSONに引き継ぎ情報がありません。"))}
      ${renderSection(14, "リスク管理", renderList(report.riskManagement, "本文JSONにリスク管理情報がありません。"))}
    </article>
  `;
}

function render(){
  if (!selectedReport) return;
  renderControls(selectedReport);
  renderReport(selectedReport);
}

async function init(){
  try {
    const response = await fetch(`reports.json?ts=${Date.now()}`, { cache:"no-store" });
    if (!response.ok) throw new Error(`reports.json HTTP ${response.status}`);
    const data = await response.json();
    const list = Array.isArray(data) ? data : Array.isArray(data.reports) ? data.reports : [];
    reports = sortReports(list);
    if (!reports.length) throw new Error("reports.jsonに表示できる本文データがありません");

    const params = new URLSearchParams(location.search);
    const date = params.get("date");
    const time = params.get("time");
    selectedReport = reports.find((report) => report.date === date && report.time === time) || reports[0];
    render();
  } catch (error) {
    $("lastUpdated").textContent = "読込エラー";
    $("reportStatus").textContent = "本文JSONを読み込めませんでした";
    $("app").className = "empty";
    $("app").innerHTML = `マーケットレポート本文を表示できません。理由: ${esc(error.message)}。reports.jsonの公開状態を確認してください。`;
  }
}

init();
</script>
</body>
</html>
