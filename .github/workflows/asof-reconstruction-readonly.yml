name: As-of reconstruction read-only tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/market_snapshot_asof.py"
      - "scripts/build_personal_market_report.py"
      - "scripts/sync_market_close_sheet.py"
      - "tests/test_market_snapshot_asof.py"
      - "tests/test_personal_market_report.py"
      - "tests/test_personal_market_snapshot.py"
      - "tests/test_sync_market_close_sheet.py"
      - ".github/workflows/asof-reconstruction-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asof-reconstruction-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p0-read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt
      - name: Compile as-of, report and close-list paths
        run: python -m py_compile scripts/market_snapshot_asof.py scripts/build_personal_market_report.py scripts/sync_market_close_sheet.py
      - name: Run as-of, personal report and read-only dry-run regressions
        run: python -m unittest tests.test_market_snapshot_asof tests.test_personal_market_report tests.test_personal_market_snapshot tests.test_sync_market_close_sheet -v

