name: Update US pre-market monitoring universe

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * 1-5" # 20:40 JST during U.S. daylight time
    - cron: "55 11 * * 1-5" # 20:55 JST only when the first snapshot is incomplete

permissions:
  contents: write

concurrency:
  group: update-us-premarket
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Skip second fetch when the first snapshot is complete
        id: freshness
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" != "55 11 * * 1-5" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path('data/market/us-premarket.json')
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          current = payload.get('current') or payload
          expected = datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          skip = current.get('status') == 'ok' and current.get('freshness') == 'fresh' and current.get('dataDate') == expected and float(current.get('coverageRatio') or payload.get('coverageRatio') or 0) >= 90
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'skip={str(skip).lower()}\n')
          print('skip second fetch:', skip)
          PY
      - name: Fetch 50-symbol US pre-market snapshot
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/fetch_us_premarket.py
      - name: Validate coverage and labels
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          payload = json.loads(Path('data/market/us-premarket.json').read_text(encoding='utf-8'))
          current = payload.get('current') or payload
          if current.get('universeSize', 0) < 45:
              raise SystemExit('US pre-market universe unexpectedly small')
          if 'S&P500 Breadth' in json.dumps(payload, ensure_ascii=False):
              raise SystemExit('US pre-market breadth must be monitoring-universe based')
          coverage = float(current.get('coverageRatio') or 0)
          expected = 'ok' if coverage >= 90 else 'partial' if coverage >= 70 else 'unavailable'
          if current.get('status') != expected:
              raise SystemExit(f'coverage/status mismatch: {coverage} -> {current.get("status")}')
          if current.get('status') != 'unavailable':
              expected_date = datetime.now(ZoneInfo('America/New_York')).date().isoformat()
              if current.get('freshness') != 'fresh' or current.get('dataDate') != expected_date:
                  raise SystemExit(f'US pre-market is not current: {current.get("dataDate")} / {current.get("freshness")}')
          print('US pre-market coverage validated:', coverage)
          PY
      - name: Commit snapshot
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update US pre-market monitoring universe" data/market/us-premarket.json data/stocks.json

