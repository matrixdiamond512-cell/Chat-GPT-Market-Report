name: Update US pre-market monitoring universe

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5" # 20:30 JST during U.S. daylight time
    - cron: "45 11 * * 1-5" # 20:45 JST
    - cron: "55 11 * * 1-5" # 20:55 JST

permissions:
  contents: write

concurrency:
  group: update-us-premarket
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch 50-symbol US pre-market snapshot
        run: python scripts/fetch_us_premarket.py
      - name: Validate coverage and labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/market/us-premarket.json').read_text(encoding='utf-8'))
          if payload.get('universeSize', 0) < 45:
              raise SystemExit('US pre-market universe unexpectedly small')
          if 'S&P500 Breadth' in json.dumps(payload, ensure_ascii=False):
              raise SystemExit('US pre-market breadth must be monitoring-universe based')
          coverage = float(payload.get('coverageRatio') or 0)
          expected = 'ok' if coverage >= 90 else 'partial' if coverage >= 70 else 'unavailable'
          if payload.get('status') != expected:
              raise SystemExit(f'coverage/status mismatch: {coverage} -> {payload.get("status")}')
          print('US pre-market coverage validated:', coverage)
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          git add data/market/us-premarket.json data/stocks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update US pre-market monitoring universe"
          git pull --rebase
          git push


