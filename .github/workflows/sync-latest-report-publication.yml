name: Sync latest market report publication

on:
  push:
    branches: [main]
    paths:
      - "data/latest-report.json"
      - "scripts/enrich_latest_morning_from_sheet.py"
      - "scripts/repair_morning_daily_references.py"
      - "scripts/apply_japan_close_reference.py"
      - "scripts/build_chatgpt_report_input.py"
      - "scripts/build_market_sheet_exports.py"
      - "scripts/sync_latest_report_publication.py"
      - "scripts/verify_morning_report_qa.py"
      - ".github/workflows/sync-latest-report-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest-market-report-publication
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check gspread google-auth

      - name: Enrich 08:00 table from canonical close sheet when configured
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/enrich_latest_morning_from_sheet.py

      - name: Repair date-matched daily closes
        run: python scripts/repair_morning_daily_references.py

      - name: Apply exact-date Japan close capture
        run: python scripts/apply_japan_close_reference.py

      - name: Build report-time ChatGPT input and CSV contract
        run: |
          python scripts/build_chatgpt_report_input.py
          python scripts/build_market_sheet_exports.py
          python -m json.tool data/market/chatgpt-input.json > /dev/null
          test -s data/market/chatgpt_input.csv

      - name: Sync latest report into history and dashboard
        run: |
          python scripts/sync_latest_report_publication.py
          python scripts/build_reports.py

      - name: Validate 08:00 publication QA when applicable
        shell: bash
        run: |
          SLOT=$(python - <<'PY'
          import json
          d=json.load(open('data/latest-report.json',encoding='utf-8'))
          r=d.get('latestReport') or d.get('report') or d
          print(r.get('time',''))
          PY
          )
          DATE=$(python - <<'PY'
          import json
          d=json.load(open('data/latest-report.json',encoding='utf-8'))
          r=d.get('latestReport') or d.get('report') or d
          print(r.get('date',''))
          PY
          )
          if [ "$SLOT" = "08:00" ]; then
            python scripts/verify_morning_report_qa.py --date "$DATE" --slot 08:00
            python - <<'PY'
          import csv, json
          from pathlib import Path
          qa=json.loads(Path('data/market/morning_report_qa.json').read_text(encoding='utf-8'))
          payload=json.loads(Path('data/market/chatgpt-input.json').read_text(encoding='utf-8'))
          rows=list(csv.reader(Path('data/market/chatgpt_input.csv').open(encoding='utf-8')))
          if len(payload.get('markets') or {}) != 28:
              raise SystemExit('ChatGPT 08:00 input must contain exactly 28 markets')
          if len(rows) != 29:
              raise SystemExit(f'ChatGPT CSV must contain header + 28 rows; got {len(rows)} lines')
          qa['structureReady']=bool(qa.get('ready'))
          qa['dataComplete']=bool(payload.get('dataComplete'))
          qa['availableCount']=payload.get('availableCount')
          qa['expectedDataCount']=payload.get('expectedCount')
          qa['unavailableLabels']=payload.get('unavailableLabels') or []
          qa['chatgptInputMarketCount']=len(payload.get('markets') or {})
          Path('data/market/morning_report_qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:qa.get(k) for k in ('structureReady','dataComplete','availableCount','expectedDataCount','unavailableLabels')},ensure_ascii=False))
          PY
          fi

      - name: Commit synchronized publication files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-report.json reports data/dashboard.json reports.json \
            data/market/latest.json data/market/chatgpt-input.json \
            data/market/chatgpt_input.csv data/market/verified_history.csv \
            data/market/morning-daily-reference.json data/market/morning_report_qa.json
          if git diff --cached --quiet; then
            echo "Publication files already synchronized."
            exit 0
          fi
          git commit -m "Sync latest market report publication"
          git pull --rebase origin main
          git push origin main
