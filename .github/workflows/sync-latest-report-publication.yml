name: Sync latest market report publication

on:
  push:
    branches: [main]
    paths:
      - "data/latest-report.json"
      - "data/market/latest.json"
      - "data/market/japan-close-reference.json"
      - "data/rates-bonds.json"
      - "scripts/enrich_latest_morning_from_sheet.py"
      - "scripts/repair_morning_daily_references.py"
      - "scripts/apply_japan_close_reference.py"
      - "scripts/force_exact_japan_close_reference.py"
      - "scripts/restore_morning_published_values.py"
      - "scripts/restore_monday_from_saturday_report.py"
      - "scripts/build_chatgpt_report_input.py"
      - "scripts/build_market_sheet_exports.py"
      - "scripts/sync_latest_report_publication.py"
      - "scripts/sync_stock_judgement_from_latest_report.py"
      - "scripts/reconcile_latest_report_market_data.py"
      - "scripts/test_reconcile_latest_report_market_data.py"
      - "scripts/verify_morning_report_qa.py"
      - ".github/workflows/sync-latest-report-publication.yml"
  workflow_dispatch:
  schedule:
    # Morning recovery runs guarantee that an 08:00 report is synchronized even
    # when an upstream GITHUB_TOKEN commit does not emit a downstream push event.
    - cron: "10 23 * * 0-4"  # 08:10 JST Monday-Friday
    - cron: "25 23 * * 0-4"  # 08:25 JST Monday-Friday
    # Run shortly after each Japan-close capture retry.
    - cron: "20 7 * * 1-5"   # 16:20 JST
    - cron: "50 7 * * 1-5"   # 16:50 JST
    - cron: "20 8 * * 1-5"   # 17:20 JST
    - cron: "20 9 * * 1-5"   # 18:20 JST
    - cron: "20 11 * * 1-5"  # 20:20 JST
    - cron: "20 14 * * 1-5"  # 23:20 JST
    - cron: "20 0 * * 6"     # 09:20 JST Saturday
    - cron: "20 1 * * 6"     # 10:20 JST Saturday
    - cron: "20 3 * * 6"     # 12:20 JST Saturday

permissions:
  contents: write

concurrency:
  group: sync-latest-market-report-publication
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check gspread google-auth

      - name: Optional enrichment from canonical previous-close sheet
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/enrich_latest_morning_from_sheet.py

      - name: Normalize 08:00 table to 28-row publication contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/latest-report.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          report = payload.get('latestReport') or payload.get('report') or payload
          if not isinstance(report, dict) or report.get('time') != '08:00':
              print('Latest report is not 08:00; table normalization skipped')
              raise SystemExit(0)

          expected = [
              'NYダウ', 'NASDAQ総合', 'S&P500', 'Russell 2000', '日経225現物',
              'CME日経225先物・円建て', 'CME日経225先物・ドル建て', '日経225先物（大阪取引所）',
              'USD/JPY', 'EUR/USD', 'COMEX金先物', 'WTI原油', 'BTCUSD', 'VIX', '日経VI',
              'Fear & Greed Index', '米10年債利回り', '日本10年国債利回り', '日経225予想PER',
              '日経225 PBR', '日経225予想EPS', '日経225 25日移動平均乖離率',
              '日経225 200日移動平均乖離率', '東証プライム売買代金', '東証プライム売買高',
              '東証プライム値上がり銘柄数', '東証プライム値下がり銘柄数', '東証プライム25日騰落レシオ',
          ]
          aliases = {
              'Dow Jones': 'NYダウ', 'Dow': 'NYダウ',
              'NASDAQ Composite': 'NASDAQ総合', 'Nasdaq Composite': 'NASDAQ総合', 'Nasdaq': 'NASDAQ総合',
              'S&P 500': 'S&P500', 'Nikkei 225': '日経225現物', '日経225': '日経225現物', '日経平均': '日経225現物',
              '金': 'COMEX金先物', 'COMEX金': 'COMEX金先物', '原油': 'WTI原油',
              '日経225先物・大阪取引所': '日経225先物（大阪取引所）',
              '日経225先物(大阪取引所)': '日経225先物（大阪取引所）',
              '日経225 25日乖離率': '日経225 25日移動平均乖離率',
              '25日移動平均乖離率': '日経225 25日移動平均乖離率',
              '日経225 200日乖離率': '日経225 200日移動平均乖離率',
              '200日移動平均乖離率': '日経225 200日移動平均乖離率',
          }

          table = report.setdefault('marketDataTable', {})
          raw_rows = table.get('rows') if isinstance(table, dict) else []
          if not isinstance(raw_rows, list):
              raw_rows = []
          by_label = {}
          for raw in raw_rows:
              if not isinstance(raw, dict):
                  continue
              label = str(raw.get('label') or raw.get('item') or raw.get('name') or '').strip()
              label = aliases.get(label, label)
              if label not in expected or label in by_label:
                  continue
              row = {
                  'label': label,
                  'value': str(raw.get('value') or '').strip(),
                  'change': str(raw.get('change') or '').strip(),
                  'rate': str(raw.get('rate') or raw.get('changePercent') or '').strip(),
                  'direction': str(raw.get('direction') or '').strip(),
              }
              if not row['value']:
                  row['value'] = '取得不能（08:00構造化表の元データが空欄）'
              if not row['change']:
                  row['change'] = '—'
              if not row['rate']:
                  row['rate'] = '—'
              if not row['direction']:
                  row['direction'] = '取得不能' if row['value'].startswith('取得不能') else '横ばい・方向確認'
              by_label[label] = row

          missing_reason = '08:00構造化表に元データなし。後続の前営業日終値修復・日本終値参照で補完'
          normalized = [by_label.get(label) or {
              'label': label,
              'value': f'取得不能（{missing_reason}）',
              'change': '—',
              'rate': '—',
              'direction': '取得不能',
          } for label in expected]

          table['columns'] = ['項目', '終値・値', '前日比', '騰落率', '方向感']
          table['rows'] = normalized
          report.setdefault('dataProvenance', {})['tableNormalization'] = {
              'rule': '08:00 publication always carries the canonical 28-row contract before repair',
              'inputRowCount': len(raw_rows),
              'outputRowCount': len(normalized),
              'missingFilled': [label for label in expected if label not in by_label],
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'inputRowCount': len(raw_rows),
              'outputRowCount': len(normalized),
              'missingFilled': [label for label in expected if label not in by_label],
          }, ensure_ascii=False))
          PY

      - name: Repair date-matched previous closes
        run: python scripts/repair_morning_daily_references.py

      - name: Apply exact-date Japan close and specialist-page references
        run: python scripts/apply_japan_close_reference.py

      - name: Force exact-date Japanese reference over generic feeds
        run: python scripts/force_exact_japan_close_reference.py

      - name: Restore originally published usable values
        run: python scripts/restore_morning_published_values.py

      - name: Recover Monday previous-close rows from Saturday report
        run: python scripts/restore_monday_from_saturday_report.py

      - name: Build previous-close ChatGPT input and CSV contract
        run: |
          python scripts/build_chatgpt_report_input.py
          python scripts/build_market_sheet_exports.py
          python -m json.tool data/market/chatgpt-input.json > /dev/null
          test -s data/market/chatgpt_input.csv

      - name: Test verified market-data reconciliation
        run: python scripts/test_reconcile_latest_report_market_data.py

      - name: Reconcile verified intraday market data into latest report
        run: python scripts/reconcile_latest_report_market_data.py

      - name: Sync latest report into history and dashboard
        run: |
          python scripts/sync_latest_report_publication.py
          python scripts/build_reports.py
          python scripts/sync_stock_judgement_from_latest_report.py

      - name: Validate 08:00 publication QA when applicable
        shell: bash
        run: |
          SLOT=$(python - <<'PY'
          import json
          d=json.load(open('data/latest-report.json',encoding='utf-8'))
          r=d.get('latestReport') or d.get('report') or d
          print(r.get('time',''))
          PY
          )
          DATE=$(python - <<'PY'
          import json
          d=json.load(open('data/latest-report.json',encoding='utf-8'))
          r=d.get('latestReport') or d.get('report') or d
          print(r.get('date',''))
          PY
          )
          if [ "$SLOT" = "08:00" ]; then
            python scripts/verify_morning_report_qa.py --date "$DATE" --slot 08:00
            python - <<'PY'
          import csv, json
          from pathlib import Path
          qa=json.loads(Path('data/market/morning_report_qa.json').read_text(encoding='utf-8'))
          payload=json.loads(Path('data/market/chatgpt-input.json').read_text(encoding='utf-8'))
          rows=list(csv.reader(Path('data/market/chatgpt_input.csv').open(encoding='utf-8')))
          if len(payload.get('markets') or {}) != 28:
              raise SystemExit('ChatGPT 08:00 input must contain exactly 28 markets')
          if len(rows) != 29:
              raise SystemExit(f'ChatGPT CSV must contain header + 28 rows; got {len(rows)} lines')
          qa['structureReady']=bool(qa.get('ready'))
          qa['dataComplete']=bool(payload.get('dataComplete'))
          qa['availableCount']=payload.get('availableCount')
          qa['expectedDataCount']=payload.get('expectedCount')
          qa['unavailableLabels']=payload.get('unavailableLabels') or []
          qa['chatgptInputMarketCount']=len(payload.get('markets') or {})
          qa['dataSemantics']=payload.get('dataSemantics')
          qa['previousCloseDate']=payload.get('previousCloseDate')
          Path('data/market/morning_report_qa.json').write_text(
              json.dumps(qa,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          print(json.dumps({
              k: qa.get(k)
              for k in ('structureReady','dataComplete','availableCount','expectedDataCount','unavailableLabels','dataSemantics','previousCloseDate')
          }, ensure_ascii=False))
          PY
          fi

      - name: Commit synchronized publication files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-report.json reports data/dashboard.json reports.json \
            data/stocks.json \
            data/market/latest.json data/market/chatgpt-input.json \
            data/market/chatgpt_input.csv data/market/verified_history.csv \
            data/market/morning-daily-reference.json data/market/morning_report_qa.json
          if git diff --cached --quiet; then
            echo "Publication files already synchronized."
            exit 0
          fi
          git commit -m "Sync latest market report publication"
          git pull --rebase origin main
          git push origin main