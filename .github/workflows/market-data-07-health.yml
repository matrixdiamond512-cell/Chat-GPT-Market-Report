name: 07:00 market data health check

on:
  workflow_dispatch:
  schedule:
    # 07:05 JST, Monday-Saturday. This independently checks the committed
    # daily audit and runs only attempts that the primary/fallback paths missed.
    - cron: "5 22 * * 0-5"

permissions:
  contents: write

concurrency:
  group: market-data-07-window
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Verify audit and recover missing attempts
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: health_check
        run: |
          python scripts/run_market_data_window.py \
            --slot "07:00" \
            --times "06:00,06:30,06:35,06:40,06:45,06:50,06:55" \
            --trigger-source "health_check" \
            --max-catchup-minutes 120
