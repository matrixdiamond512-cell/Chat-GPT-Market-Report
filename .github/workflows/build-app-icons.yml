name: Build app icons

on:
  workflow_dispatch:
  push:
    paths:
      - market-report-icon.svg
      - .github/workflows/build-app-icons.yml

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer
        run: python -m pip install --upgrade cairosvg pillow

      - name: Render icon files
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import cairosvg

          root = Path('.')
          svg = root / 'market-report-icon.svg'
          png_1024 = cairosvg.svg2png(url=str(svg), output_width=1024, output_height=1024)
          image = Image.open(BytesIO(png_1024)).convert('RGBA')

          outputs = {
              'favicon-16x16.png': 16,
              'favicon-32x32.png': 32,
              'apple-touch-icon.png': 180,
              'android-chrome-192x192.png': 192,
              'android-chrome-512x512.png': 512,
              'Market_Report_Icon_2026-07-30_14-35.png': 1024,
          }
          for filename, size in outputs.items():
              image.resize((size, size), Image.Resampling.LANCZOS).save(root / filename, optimize=True)

          image.save(root / 'favicon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48)])
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png Market_Report_Icon_2026-07-30_14-35.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Generate Market Report app icons"
            git push
          fi
