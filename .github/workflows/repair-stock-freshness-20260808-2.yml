name: Repair remaining stock freshness 2026-08-08

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-stock-freshness-20260808-2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TOPIX Growth250 and Tokyo sectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          NOW = '2026-08-08T20:15:00+09:00'
          DATE = '2026-08-07'
          stocks_path = Path('data/stocks.json')
          d = json.loads(stocks_path.read_text(encoding='utf-8'))
          jp = d['marketInternals']['japan']
          rows = jp.get('rows') or []
          for row in rows:
              if not isinstance(row, list) or not row:
                  continue
              if row[0] == 'TOPIX':
                  row[:] = ['TOPIX', '4,074.93', '+19.08（+0.47%）', 'トレーダーズ・ウェブ15:45確定値。基準日 2026-08-07。']
              elif row[0] == 'グロース250':
                  row[:] = ['グロース250', '724.09', '+3.17（+0.44%）', 'トレーダーズ・ウェブ15:45確定値。基準日 2026-08-07。']
          jp['updatedAt'] = NOW
          d['updatedAt'] = NOW
          d.setdefault('marketUpdatedAt', {})['japan'] = NOW
          stocks_path.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sector_path = Path('data/sector-performance.json')
          sector = json.loads(sector_path.read_text(encoding='utf-8'))
          sector['generatedAt'] = NOW
          sector['status'] = 'verified'
          market = sector.setdefault('markets', {}).setdefault('japan', {})
          market.update({
              'title': '東京市場のセクター・業種',
              'flag': 'JP',
              'status': 'verified',
              'asOf': DATE,
              'updatedAt': NOW,
              'sourceLabel': 'トレーダーズ・ウェブ 業種別ランキング（前日比）',
              'gainers': [
                  {'rank': 1, 'name': '石油・石炭製品', 'changePct': 4.24, 'change': '+4.24%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 2, 'name': 'その他製品', 'changePct': 3.63, 'change': '+3.63%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 3, 'name': 'ゴム製品', 'changePct': 3.03, 'change': '+3.03%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 4, 'name': '非鉄金属', 'changePct': 2.80, 'change': '+2.80%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 5, 'name': '海運業', 'changePct': 2.61, 'change': '+2.61%', 'asOf': DATE, 'note': '東証33業種・前日比'}
              ],
              'losers': [
                  {'rank': 1, 'name': '建設業', 'changePct': -1.48, 'change': '-1.48%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 2, 'name': 'その他金融業', 'changePct': -1.39, 'change': '-1.39%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 3, 'name': '証券・商品先物取引', 'changePct': -1.13, 'change': '-1.13%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 4, 'name': 'ガラス・土石製品', 'changePct': -1.01, 'change': '-1.01%', 'asOf': DATE, 'note': '東証33業種・前日比'},
                  {'rank': 5, 'name': '機械', 'changePct': -0.66, 'change': '-0.66%', 'asOf': DATE, 'note': '東証33業種・前日比'}
              ],
              'lastErrors': []
          })
          market['rows'] = market['gainers']
          sector_path.write_text(json.dumps(sector, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          snap = Path('data/history/stocks/2026-08-08.json')
          if snap.exists():
              s = json.loads(stocks_path.read_text(encoding='utf-8'))
              s['snapshotDate'] = '2026-08-08'
              s['savedAt'] = NOW
              s.setdefault('sectors', {})['japan'] = market
              snap.write_text(json.dumps(s, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          rows={r[0]:r for r in d['marketInternals']['japan']['rows']}
          assert rows['TOPIX'][1]=='4,074.93'
          assert rows['グロース250'][1]=='724.09'
          s=json.loads(Path('data/sector-performance.json').read_text(encoding='utf-8'))
          assert s['markets']['japan']['asOf']=='2026-08-07'
          assert s['markets']['japan']['gainers'][0]['name']=='石油・石炭製品'
          print('remaining freshness validation passed')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/sector-performance.json data/history/stocks/2026-08-08.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh TOPIX Growth250 and Tokyo sectors to Aug 7"
          git pull --rebase
          git push
