name: Freeze pre-draft report-slot evidence

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select regular Evidence generation or the TEST ONLY read-only WIF probe."
        required: true
        type: choice
        default: "freeze_evidence"
        options: ["freeze_evidence", "test_wif_readonly"]
      report_slot:
        description: "Current JST report slot only. Past slots are rejected."
        required: true
        default: "08:00"
        type: choice
        options: ["08:00", "12:00", "16:00", "21:00"]
  schedule:
    # Redundant pre-slot attempts tolerate skipped/delayed Actions schedules.
    # No attempt may synthesize evidence after the slot cutoff.
    - cron: "47,53,57 22 * * 0-4"
    - cron: "47,53,57 2 * * 1-5"
    - cron: "47,53,57 6 * * 1-5"
    - cron: "47,53,57 11 * * 1-5"

permissions:
  contents: write

jobs:
  freeze:
    if: github.event_name == 'schedule' || inputs.operation == 'freeze_evidence'
    runs-on: ubuntu-latest
    concurrency:
      group: freeze-pre-draft-report-slot-evidence
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve explicit JST report slot
        id: slot
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.report_slot }}
        run: |
          case "$SCHEDULE" in
            "47,53,57 22 * * 0-4") SLOT="08:00" ;;
            "47,53,57 2 * * 1-5") SLOT="12:00" ;;
            "47,53,57 6 * * 1-5") SLOT="16:00" ;;
            "47,53,57 11 * * 1-5") SLOT="21:00" ;;
            "") SLOT="$MANUAL_SLOT" ;;
            *) echo "Unexpected schedule: $SCHEDULE" >&2; exit 1 ;;
          esac
          case "$SLOT" in
            "08:00"|"12:00"|"16:00"|"21:00") ;;
            *) echo "Unsupported report slot: $SLOT" >&2; exit 1 ;;
          esac
          echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Apply the matching slot guard
        env:
          REPORT_DATE: ${{ steps.slot.outputs.date }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          python - <<'PY'
          import os
          from scripts.persist_report_slot_evidence import require_evidence_slot_guard
          require_evidence_slot_guard(os.environ["REPORT_DATE"], os.environ["REPORT_SLOT"])
          print("LIVE_PRE_SLOT_WINDOW=PASS")
          PY
      - name: Install pinned Google Storage client for the 08:00 path only
        if: steps.slot.outputs.slot == '08:00'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-issuance.txt
      - name: Require 08:00 GCS WIF configuration
        if: steps.slot.outputs.slot == '08:00'
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          EVIDENCE_SERVICE_ACCOUNT: ${{ vars.REPORT_EVIDENCE_SERVICE_ACCOUNT }}
          EVIDENCE_PROJECT_ID: ${{ vars.REPORT_EVIDENCE_PROJECT_ID }}
          EVIDENCE_BUCKET: ${{ vars.REPORT_EVIDENCE_BUCKET }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "EVIDENCE_AUTH_NOT_CONFIGURED: GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$EVIDENCE_SERVICE_ACCOUNT" || { echo "EVIDENCE_AUTH_NOT_CONFIGURED: REPORT_EVIDENCE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$EVIDENCE_PROJECT_ID" || { echo "EVIDENCE_AUTH_NOT_CONFIGURED: REPORT_EVIDENCE_PROJECT_ID"; exit 1; }
          test -n "$EVIDENCE_BUCKET" || { echo "EVIDENCE_AUTH_NOT_CONFIGURED: REPORT_EVIDENCE_BUCKET"; exit 1; }
      - name: Authenticate to GCS using GitHub OIDC and Workload Identity Federation
        if: steps.slot.outputs.slot == '08:00'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.REPORT_EVIDENCE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Validate writer and offline regression tests
        run: |
          python -m py_compile scripts/persist_report_slot_evidence.py
          python -m unittest tests.test_report_slot_evidence -v
      - name: Reconcile or validate existing slot evidence before acquisition
        id: existing
        env:
          REPORT_DATE: ${{ steps.slot.outputs.date }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
          REPORT_EVIDENCE_BUCKET: ${{ vars.REPORT_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          if [ "$REPORT_SLOT" = "08:00" ]; then
            python scripts/persist_report_slot_evidence.py \
              --date "$REPORT_DATE" \
              --slot "$REPORT_SLOT" \
              --output-dir data/report-evidence \
              --gcs-bucket "$REPORT_EVIDENCE_BUCKET" \
              --gcs-prefix pre-draft-evidence \
              --reconcile-gcs
          else
            python - <<'PY'
          import os
          from pathlib import Path
          from scripts.persist_report_slot_evidence import validate_stored_slot_evidence
          report_date = os.environ["REPORT_DATE"]
          report_slot = os.environ["REPORT_SLOT"]
          path = Path("data/report-evidence") / f"{report_date}_{report_slot.replace(':', '-')}-r1.json"
          if not path.is_file():
              print("EXISTING_SLOT_EVIDENCE=ABSENT")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("ready=false\n")
              raise SystemExit(0)
          validate_stored_slot_evidence(path.read_bytes(), report_date, report_slot)
          print("EXISTING_SLOT_EVIDENCE=VALID_NO_OP")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ready=true\n")
          PY
          fi
      - name: Check whether a fresh verified acquisition already exists
        id: input
        if: steps.existing.outputs.ready != 'true'
        continue-on-error: true
        env:
          REPORT_DATE: ${{ steps.slot.outputs.date }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import date
          from pathlib import Path
          from scripts.persist_report_slot_evidence import build_slot_evidence
          source = Path("data/market/latest.json")
          if not source.exists():
              print("INPUT_MISSING: no acquisition file")
              sys.exit(2)
          raw = source.read_bytes()
          try:
              build_slot_evidence(os.environ["REPORT_DATE"], os.environ["REPORT_SLOT"],
                                  json.loads(raw), raw, max_age_minutes=15)
          except (ValueError, KeyError, TypeError) as exc:
              message = str(exc)
              category = "INPUT_SLOT_MISMATCH" if "INPUT_SLOT_MISMATCH" in message else ("ACQUISITION_FAILED" if "ACQUISITION_FAILED" in message else "INPUT_STALE")
              print(category + ": " + message)
              sys.exit(2)
          print("CURRENT_VERIFIED_INPUT=PASS")
          PY
      - name: Recover missing acquisition once before the slot (never after)
        if: steps.existing.outputs.ready != 'true' && steps.input.outcome != 'success'
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt
          TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          ACTUAL_TIME="$(TZ=Asia/Tokyo date +%H:%M)"
          python - "$TARGET_DATE" "$REPORT_SLOT" <<'PY'
          import sys
          from scripts.persist_report_slot_evidence import require_evidence_slot_guard
          require_evidence_slot_guard(sys.argv[1], sys.argv[2])
          PY
          if ! python scripts/run_market_data_window.py \
            --slot "$REPORT_SLOT" \
            --times "$ACTUAL_TIME" \
            --trigger-source report_evidence_pre_slot_recovery \
            --max-catchup-minutes 5 \
            --mode auto \
            --recover-expired; then
            echo "ACQUISITION_FAILED" >&2
            exit 1
          fi
      - name: Freeze and persist 08:00 Evidence to canonical GCS
        if: steps.slot.outputs.slot == '08:00' && steps.existing.outputs.ready != 'true'
        env:
          REPORT_EVIDENCE_BUCKET: ${{ vars.REPORT_EVIDENCE_BUCKET }}
          REPORT_EVIDENCE_PROJECT_ID: ${{ vars.REPORT_EVIDENCE_PROJECT_ID }}
        run: |
          python scripts/persist_report_slot_evidence.py \
            --date "${{ steps.slot.outputs.date }}" \
            --slot "${{ steps.slot.outputs.slot }}" \
            --output-dir data/report-evidence \
            --gcs-bucket "$REPORT_EVIDENCE_BUCKET" \
            --gcs-prefix pre-draft-evidence \
            --max-age-minutes 15 \
            --persist-gcs \
            --require-live-before-slot
      - name: Freeze non-08:00 Evidence using the legacy local-only path
        if: steps.slot.outputs.slot != '08:00' && steps.existing.outputs.ready != 'true'
        run: |
          python scripts/persist_report_slot_evidence.py \
            --date "${{ steps.slot.outputs.date }}" \
            --slot "${{ steps.slot.outputs.slot }}" \
            --output-dir data/report-evidence \
            --max-age-minutes 15 \
            --require-live-before-slot
      - name: Commit immutable evidence (not a report or publication receipt)
        if: steps.existing.outputs.ready != 'true' || steps.existing.outputs.restored == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/report-evidence/
          if git diff --cached --quiet; then
            echo "NO_OP: identical evidence already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze pre-draft evidence for ${{ steps.slot.outputs.date }} ${{ steps.slot.outputs.slot }}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PRE_DRAFT_EVIDENCE_PERSISTED: publication remains separately gated."

  test-wif-readonly:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'test_wif_readonly' && github.ref == 'refs/heads/codex/0800-main-issuance-e2e-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: test-wif-readonly-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify the selected branch and workflow identity
        env:
          EXPECTED_REF: refs/heads/codex/0800-main-issuance-e2e-20261029
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$WORKFLOW_REF" = "matrixdiamond512-cell/Chat-GPT-Market-Report/.github/workflows/freeze-report-slot-evidence.yml@$EXPECTED_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Google Storage client
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-issuance.txt
      - name: Authenticate with TEST ONLY Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/765600646675/locations/global/workloadIdentityPools/mr-evidence-test-github/providers/github-pr188-evidence
          service_account: mr-pr188-evidence-test@market-report-test-only.iam.gserviceaccount.com
          project_id: market-report-test-only
          create_credentials_file: true
          export_environment_variables: true
      - name: Read one existing TEST ONLY object at its pinned generation
        run: python -m scripts.reporting.gcs_wif_readonly
