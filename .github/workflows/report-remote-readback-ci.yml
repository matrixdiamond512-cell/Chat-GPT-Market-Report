name: Market report remote readback regression
on:
  push:
    branches: [fix/republish-missing-github-report-20261013]
  pull_request:
    paths:
      - apps-script/MarketReportAutoPublish.gs
      - scripts/test_report_remote_readback.js
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test_report_remote_readback.js
