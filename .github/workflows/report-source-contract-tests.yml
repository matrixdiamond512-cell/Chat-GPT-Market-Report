name: Report source contract tests

on:
  pull_request:
    paths:
      - "scripts/report_source_contract.py"
      - "tests/test_report_source_contract_headings.py"
      - ".github/workflows/report-source-contract-tests.yml"

permissions:
  contents: read

jobs:
  numbered-heading-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser regression tests
        run: python -m unittest discover -s tests -p "test_report_source_contract_headings.py" -v
