name: Supplemental morning dashboard six-market QA
on:
  pull_request:
    paths:
      - 'assets/js/top-dashboard.js'
      - 'assets/js/dashboard-market-card-normalizer.js'
      - 'assets/js/dashboard-market-card-reason-fix.js'
      - 'index.html'
      - 'scripts/validate_supplemental_oct16_dashboard.js'
      - '.github/workflows/supplemental-dashboard-six-market-ci.yml'
permissions:
  contents: read
jobs:
  six-market-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript source syntax
        run: |
          node --check assets/js/top-dashboard.js
          node --check assets/js/dashboard-market-card-normalizer.js
          node --check assets/js/dashboard-market-card-reason-fix.js
          node --check scripts/validate_supplemental_oct16_dashboard.js
      - name: Install headless browser
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-validation" --no-save playwright
          "$RUNNER_TEMP/portal-validation/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start portal preview
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/portal-test-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal-test-http.log
          exit 1
      - name: Validate all six restored morning report cards
        env:
          PORTAL_URL: http://127.0.0.1:8765
          NODE_PATH: ${{ runner.temp }}/portal-validation/node_modules
        run: node scripts/validate_supplemental_oct16_dashboard.js
