name: Update Nikkei 225 supply-demand data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/market/latest.json"
      - "data/stocks.json"
      - "scripts/update_nikkei225_supply_demand.py"
      - "scripts/enrich_nikkei225_supply_demand.py"
      - "scripts/fix_nikkei225_verified_data.py"
      - "scripts/enrich_nikkei225_margin.py"
      - "scripts/enrich_nikkei225_foreign.py"
      - "scripts/enrich_nikkei225_sessions.py"
      - "scripts/enrich_nikkei225_participants.py"
      - "scripts/enrich_nikkei225_options.py"
      - "scripts/enrich_nikkei225_spot.py"
      - "scripts/enrich_nikkei225_iv.py"
      - "scripts/enrich_nikkei225_cftc_positioning.py"
      - "scripts/requirements-nikkei225-supply-demand.txt"
      - ".github/workflows/update-nikkei225-supply-demand.yml"
      - ".github/nikkei225-supply-demand-trigger.txt"
  schedule:
    - cron: "55 21 * * 0-4"
    - cron: "50 2 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "50 11 * * 1-5"
    - cron: "55 21 * * 5"

permissions:
  contents: write

concurrency:
  group: update-nikkei225-supply-demand
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-nikkei225-supply-demand.txt
      - name: Validate updater
        run: |
          python -m py_compile scripts/update_nikkei225_supply_demand.py
          python -m py_compile scripts/enrich_nikkei225_supply_demand.py
          python -m py_compile scripts/fix_nikkei225_verified_data.py
          python -m py_compile scripts/enrich_nikkei225_margin.py
          python -m py_compile scripts/enrich_nikkei225_foreign.py
          python -m py_compile scripts/enrich_nikkei225_sessions.py
          python -m py_compile scripts/enrich_nikkei225_participants.py
          python -m py_compile scripts/enrich_nikkei225_options.py
          python -m py_compile scripts/enrich_nikkei225_spot.py
          python -m py_compile scripts/enrich_nikkei225_iv.py
          python -m py_compile scripts/enrich_nikkei225_cftc_positioning.py
      - name: Build base Nikkei 225 supply-demand JSON
        run: python scripts/update_nikkei225_supply_demand.py
      - name: Apply verified JPX-format parsers
        run: python scripts/enrich_nikkei225_supply_demand.py
      - name: Finalize current JPX OI layout and validation
        run: python scripts/fix_nikkei225_verified_data.py
      - name: Add weekly margin balances
        run: python scripts/enrich_nikkei225_margin.py
      - name: Add weekly foreign-investor flows
        run: python scripts/enrich_nikkei225_foreign.py
      - name: Add day/night session volumes
        run: python scripts/enrich_nikkei225_sessions.py
      - name: Add participant turnover and OI leaders
        run: python scripts/enrich_nikkei225_participants.py
      - name: Add independently verified Nikkei 225 spot close
        run: python scripts/enrich_nikkei225_spot.py
      - name: Add Nikkei 225 option Put-Call volume
        run: python scripts/enrich_nikkei225_options.py
      - name: Add JPX Nikkei 225 base volatility
        run: python scripts/enrich_nikkei225_iv.py
      - name: Add CFTC TFF Leveraged Funds 26-week positioning
        run: python scripts/enrich_nikkei225_cftc_positioning.py
      - name: Validate JSON
        run: python -m json.tool data/nikkei225-supply-demand.json > /dev/null
      - name: Show data status
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nikkei225-supply-demand.json',encoding='utf-8'))
          print(d.get('sourceStatus'))
          print(json.dumps(d.get('diagnostics',{}),ensure_ascii=False,indent=2))
          for k in ('spot','futures','sessions','arbitrage','options','participantFlow','foreignInvestors','participantOpenInterest','shortSelling','margin','speculativePositioning'):
              x=d.get(k,{})
              print(f"{k}: status={x.get('status')} asOf={x.get('asOfDate')}")
              if x.get('error'):
                  print(f"{k}: {x['error']}")
              if k=='options' and x.get('ivReason'):
                  print(f"options.iv: {x['ivReason']}")
          PY
      - name: Commit Nikkei 225 supply-demand data
        shell: bash
        run: |
          if git diff --quiet -- data/nikkei225-supply-demand.json; then
            echo "Nikkei 225 supply-demand JSON is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225-supply-demand.json
          git commit -m "Update Nikkei 225 supply-demand data"
          git pull --rebase origin main
          git push origin main
