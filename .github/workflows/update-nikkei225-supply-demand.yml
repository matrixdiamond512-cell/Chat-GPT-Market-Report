name: Update Nikkei 225 supply-demand data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/market/latest.json"
      - "data/stocks.json"
      - "scripts/update_nikkei225_supply_demand.py"
      - "scripts/enrich_nikkei225_supply_demand.py"
      - "scripts/fix_nikkei225_verified_data.py"
      - "scripts/requirements-nikkei225-supply-demand.txt"
      - ".github/workflows/update-nikkei225-supply-demand.yml"
      - ".github/nikkei225-supply-demand-trigger.txt"
  schedule:
    # JST: weekdays 06:55 / 11:50 / 16:10 / 18:05 / 20:15 / 20:50.
    # Extra runs align with JPX publication windows for arbitrage, participant
    # volume and open interest. Saturday 06:55 preserves Friday's verified data.
    - cron: "55 21 * * 0-4"
    - cron: "50 2 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "50 11 * * 1-5"
    - cron: "55 21 * * 5"

permissions:
  contents: write

concurrency:
  group: update-nikkei225-supply-demand
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-nikkei225-supply-demand.txt

      - name: Validate updater
        run: |
          python -m py_compile scripts/update_nikkei225_supply_demand.py
          python -m py_compile scripts/enrich_nikkei225_supply_demand.py
          python -m py_compile scripts/fix_nikkei225_verified_data.py

      - name: Build base Nikkei 225 supply-demand JSON
        run: python scripts/update_nikkei225_supply_demand.py

      - name: Apply verified JPX-format parsers
        run: python scripts/enrich_nikkei225_supply_demand.py

      - name: Finalize current JPX OI layout and validation
        run: python scripts/fix_nikkei225_verified_data.py

      - name: Validate JSON
        run: python -m json.tool data/nikkei225-supply-demand.json > /dev/null

      - name: Show data status
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/nikkei225-supply-demand.json',encoding='utf-8'))
          print(d.get('sourceStatus'))
          print(json.dumps(d.get('diagnostics',{}),ensure_ascii=False,indent=2))
          for k in ('futures','arbitrage','participantFlow','foreignInvestors','participantOpenInterest','shortSelling','margin'):
              x=d.get(k,{})
              if x.get('error'):
                  print(f"{k}: {x['error']}")
          PY

      - name: Commit Nikkei 225 supply-demand data
        shell: bash
        run: |
          if git diff --quiet -- data/nikkei225-supply-demand.json; then
            echo "Nikkei 225 supply-demand JSON is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225-supply-demand.json
          git commit -m "Update Nikkei 225 supply-demand data"
          git pull --rebase origin main
          git push origin main
