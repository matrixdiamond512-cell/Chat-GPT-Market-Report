name: 08:00 market data final readiness check

on:
  workflow_dispatch:
  schedule:
    # Start two minutes before the final 07:55 JST validation point. The job
    # waits until 07:55, forces a fresh acquisition, and writes a machine-readable
    # readiness result before the 08:00 report can be considered data-ready.
    - cron: "53 22 * * 0-5"

permissions:
  contents: write

concurrency:
  group: market-data-08-window
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py
          python -m py_compile scripts/verify_market_report_readiness.py
          python -m py_compile scripts/fetch_morning_reference.py

      - name: Force final 07:55 market-data refresh
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: final_readiness
        run: |
          python scripts/run_market_data_window.py \
            --slot "08:00" \
            --times "07:55" \
            --trigger-source "final_readiness" \
            --max-catchup-minutes 10 \
            --mode full

      - name: Recover CME/OSE morning reference
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          REPORT_DATE="$(TZ=Asia/Tokyo date +%F)"
          python scripts/fetch_morning_reference.py --report-date "$REPORT_DATE" --slot "08:00"
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            git add data/market/morning-reference.json
            if ! git diff --cached --quiet; then
              git commit -m "Recover 08:00 CME/OSE morning reference"
              git pull --rebase
              git push
            fi
          else
            echo "CME/OSE reference recovery failed; keep last verified reference and continue readiness check."
          fi
          set -e

      - name: Verify report data readiness and record result
        shell: bash
        run: |
          set +e
          python scripts/verify_market_report_readiness.py \
            --slot "08:00" \
            --max-age-minutes 15
          CODE=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/report_readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 08:00 market data readiness"
            git pull --rebase
            git push
          fi

          if [ "$CODE" -ne 0 ]; then
            echo "08:00 report data is NOT ready. Report generation must not label current verified GitHub values as unavailable."
            exit "$CODE"
          fi
          echo "08:00 report data readiness verified."
