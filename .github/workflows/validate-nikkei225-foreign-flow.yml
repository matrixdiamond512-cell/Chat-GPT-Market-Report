name: Validate Nikkei foreign investor flow chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pages-inspect-trigger.txt"
      - ".github/workflows/validate-nikkei225-foreign-flow.yml"
      - "nikkei225-supply-demand.html"
      - "assets/js/nikkei225-foreign-flow-display.js"
      - "assets/css/nikkei225-foreign-flow.css"
      - "data/nikkei225-supply-demand.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for public Pages content and validate
        shell: bash
        run: |
          PAGE='https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/nikkei225-supply-demand.html'
          DATA='https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/data/nikkei225-supply-demand.json'
          JS='https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/assets/js/nikkei225-foreign-flow-display.js'
          CSS='https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/assets/css/nikkei225-foreign-flow.css'
          : > /tmp/page.html
          : > /tmp/data.json
          : > /tmp/foreign.js
          : > /tmp/foreign.css
          for i in $(seq 1 60); do
            CB="$(date +%s)-$i"
            curl -fsSL --retry 2 --retry-delay 2 "${PAGE}?v=${CB}" -o /tmp/page.html || true
            curl -fsSL --retry 2 --retry-delay 2 "${DATA}?v=${CB}" -o /tmp/data.json || true
            curl -fsSL --retry 2 --retry-delay 2 "${JS}?v=${CB}" -o /tmp/foreign.js || true
            curl -fsSL --retry 2 --retry-delay 2 "${CSS}?v=${CB}" -o /tmp/foreign.css || true
            if grep -q 'nikkei225-foreign-flow-display.js?v=20260809-03' /tmp/page.html \
              && grep -q 'nikkei225-foreign-flow.css?v=20260809-03' /tmp/page.html \
              && grep -q 'PERIODS=\[12,26,52\]' /tmp/foreign.js \
              && grep -q 'selectedWeeks=52' /tmp/foreign.js \
              && grep -q 'nikkei-foreign-period-switch' /tmp/foreign.css \
              && grep -q 'nikkei-foreign-price-line' /tmp/foreign.js \
              && grep -q 'nikkei-foreign-price-line' /tmp/foreign.css \
              && python - <<'PY'
          import json,sys
          try:
              d=json.load(open('/tmp/data.json'))
              f=d.get('foreignInvestors') or {}
              s=f.get('series') or []
              ok=(
                  f.get('status')=='verified'
                  and f.get('historyStatus')=='verified'
                  and f.get('historyWeeks')==52
                  and f.get('historyTargetWeeks')==52
                  and f.get('priceHistoryStatus')=='verified'
                  and f.get('priceHistoryWeeks')==52
                  and len(s)==52
                  and f.get('cashNet') is not None
                  and f.get('nikkeiFuturesNet') is not None
                  and f.get('nikkeiFuturesPrice') is not None
                  and all(
                      x.get('asOfDate')
                      and x.get('cashNet') is not None
                      and x.get('nikkeiFuturesNet') is not None
                      and x.get('nikkeiFuturesPrice') is not None
                      for x in s
                  )
              )
          except Exception:
              ok=False
          sys.exit(0 if ok else 1)
          PY
            then
              break
            fi
            sleep 5
          done
          python - <<'PY'
          import json,datetime,pathlib
          html=pathlib.Path('/tmp/page.html').read_text(encoding='utf-8',errors='replace')
          js=pathlib.Path('/tmp/foreign.js').read_text(encoding='utf-8',errors='replace')
          css=pathlib.Path('/tmp/foreign.css').read_text(encoding='utf-8',errors='replace')
          try:
              d=json.loads(pathlib.Path('/tmp/data.json').read_text(encoding='utf-8'))
          except Exception:
              d={}
          f=d.get('foreignInvestors') or {}
          s=f.get('series') or []
          series_ok=bool(
              f.get('status')=='verified'
              and f.get('historyStatus')=='verified'
              and f.get('historyWeeks')==52
              and f.get('historyTargetWeeks')==52
              and len(s)==52
              and all(x.get('asOfDate') and x.get('cashNet') is not None and x.get('nikkeiFuturesNet') is not None for x in s)
          )
          price_ok=bool(
              f.get('priceHistoryStatus')=='verified'
              and f.get('priceHistoryWeeks')==52
              and f.get('nikkeiFuturesPrice') is not None
              and all(x.get('nikkeiFuturesPrice') is not None for x in s)
          )
          period_ok=bool(
              'PERIODS=[12,26,52]' in js
              and 'selectedWeeks=52' in js
              and 'data-foreign-period' in js
              and 'nikkei-foreign-period-switch' in css
          )
          display_ok=bool(
              'nikkei225-foreign-flow-display.js?v=20260809-03' in html
              and 'nikkei225-foreign-flow.css?v=20260809-03' in html
              and '週次ネットフロー＋日経225先物価格' in js
              and 'nikkei-foreign-price-line' in js
              and 'nikkei-foreign-price-line' in css
              and '日経225先物価格（右軸）' in js
              and period_ok
          )
          out={
              'checkedAt':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='seconds'),
              'pageUrl':'https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/nikkei225-supply-demand.html',
              'htmlHasForeignFlowScript':'nikkei225-foreign-flow-display.js?v=20260809-03' in html,
              'htmlHasForeignFlowCss':'nikkei225-foreign-flow.css?v=20260809-03' in html,
              'publicForeignFlowScriptHasTitle':'週次ネットフロー＋日経225先物価格' in js,
              'publicForeignFlowCssHasPriceLine':'nikkei-foreign-price-line' in css,
              'publicForeignPeriodSwitch':period_ok,
              'publicForeignDefaultWeeks':52 if 'selectedWeeks=52' in js else None,
              'publicForeignStatus':f.get('status'),
              'publicForeignAsOfDate':f.get('asOfDate'),
              'publicForeignCashNet':f.get('cashNet'),
              'publicForeignNikkeiFuturesNet':f.get('nikkeiFuturesNet'),
              'publicForeignNikkeiFuturesPrice':f.get('nikkeiFuturesPrice'),
              'publicForeignDirection':f.get('direction'),
              'publicForeignHistoryWeeks':f.get('historyWeeks'),
              'publicForeignHistoryTargetWeeks':f.get('historyTargetWeeks'),
              'publicForeignHistoryStatus':f.get('historyStatus'),
              'publicForeignPriceHistoryWeeks':f.get('priceHistoryWeeks'),
              'publicForeignPriceHistoryStatus':f.get('priceHistoryStatus'),
              'publicForeignCurrentFormatWeeks':f.get('derivativesCurrentFormatWeeks'),
              'publicForeignLegacyFormatWeeks':f.get('derivativesLegacyFormatWeeks'),
              'foreignSeriesValidationPassed':series_ok,
              'foreignPriceValidationPassed':price_ok,
              'foreignPeriodSwitchValidationPassed':period_ok,
              'foreignDisplayValidationPassed':display_ok,
              'liveValidationPassed':bool(series_ok and price_ok and display_ok)
          }
          pathlib.Path('data/nikkei225-foreign-flow-public-validation.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['liveValidationPassed']:
              raise SystemExit('Nikkei foreign flow public validation failed')
          PY
      - name: Commit validation result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nikkei225-foreign-flow-public-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Nikkei foreign flow public validation'
          git pull --rebase origin main
          git push origin main
