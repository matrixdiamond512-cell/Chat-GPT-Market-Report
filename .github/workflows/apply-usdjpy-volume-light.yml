name: Apply USDJPY volume lightweight update

on:
  push:
    paths:
      - '.github/tmp/usdjpy_light_patch_*.b64'
      - '.github/workflows/apply-usdjpy-volume-light.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and run patch
        run: |
          cat .github/tmp/usdjpy_light_patch_1.b64 .github/tmp/usdjpy_light_patch_2.b64 .github/tmp/usdjpy_light_patch_3.b64 | base64 --decode > /tmp/patch_usdjpy.py
          python /tmp/patch_usdjpy.py
      - name: Check JavaScript syntax
        run: |
          cp apps-script/UsdJpyVolumePageAutoUpdate.gs /tmp/UsdJpyVolumePageAutoUpdate.js
          node --check /tmp/UsdJpyVolumePageAutoUpdate.js
      - name: Prepare paste-ready copy
        run: |
          mkdir -p downloads
          cp apps-script/UsdJpyVolumePageAutoUpdate.gs downloads/UsdJpyVolumePageAutoUpdate_2026-08-06_light.gs.txt
      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/UsdJpyVolumePageAutoUpdate.gs downloads/UsdJpyVolumePageAutoUpdate_2026-08-06_light.gs.txt
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'Publish USDJPY volume lightweight GAS source'
          git push
