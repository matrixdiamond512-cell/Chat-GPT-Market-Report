name: Repair current 08:00 snapshot once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-current-08-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: repair-current-08-snapshot
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified 2026-08-08 08:00 snapshot as current staging state
        run: |
          test -s data/market/history/2026-08-08_08-00.json
          cp data/market/history/2026-08-08_08-00.json data/market/latest.json
          cp data/market/history/2026-08-08_08-00.json data/market/last_verified.json
          python scripts/build_market_sheet_exports.py
          python scripts/build_market_json.py --market-data data/market/latest.json --dashboard data/dashboard.json
          python -m json.tool data/market/latest.json > /dev/null
          python - <<'PYCODE'
          import json
          payload = json.load(open('data/market/latest.json', encoding='utf-8'))
          assert payload.get('reportSlot') == '08:00', payload.get('reportSlot')
          assert payload.get('overallStatus') == 'verified', payload.get('overallStatus')
          assert not payload.get('missingRequired'), payload.get('missingRequired')
          print('Restored verified 08:00 snapshot:', payload.get('generatedAt'))
          PYCODE

      - name: Commit repaired staging state
        shell: bash
        run: |
          if git diff --quiet -- data/market/latest.json data/market/last_verified.json data/market/chatgpt_input.csv data/market/verified_history.csv data/dashboard.json; then
            echo "Current staging state already matches the verified 08:00 snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/latest.json data/market/last_verified.json data/market/chatgpt_input.csv data/market/verified_history.csv data/dashboard.json
          git commit -m "Restore verified 08:00 market snapshot"
          git pull --rebase
          git push
