name: Apply dashboard timeout fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_dashboard_timeout_fix.py
      - tools/decouple_dashboard_events.py
      - .github/workflows/apply-dashboard-timeout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_dashboard_timeout_fix.py
      - run: python tools/decouple_dashboard_events.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- apps-script/DashboardJsonSync.gs assets/js/top-dashboard.js; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/DashboardJsonSync.gs assets/js/top-dashboard.js
          git commit -m "Finalize dashboard timeout fix"
          git push
