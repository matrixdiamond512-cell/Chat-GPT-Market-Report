name: Deploy WEB Market Report to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync latest market report publication"
      - "Update Tokyo USDJPY spot volume"
      - "Repair Tokyo USDJPY spot volume price gaps"
      - "Update US stock table and daily archive"
      - "Update US stock breadth"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Update US stock breadth'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical history and index without rewriting latest report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          assert isinstance(index, list) and index, 'report index empty'
          seen = set()
          for item in index:
              key = (item['date'], item['time'])
              assert key not in seen, f'duplicate index slot: {key}'
              seen.add(key)
              path = Path('reports') / f'{key[0]}_{key[1].replace(":", "-")}.json'
              canonical = json.loads(path.read_text(encoding='utf-8'))
              if not all(canonical.get(k) for k in ('date', 'time', 'title')):
                  canonical = canonical.get('latestReport', canonical)
              assert item == canonical, f'index/canonical mismatch: {path}'
          for time in ('12:00', '16:00'):
              item = next((r for r in index if (r['date'], r['time']) == ('2026-09-22', time)), None)
              assert item and item.get('fullText'), f'missing full text: {time}'
          print('Canonical index and both requested report texts verified.')
          PY

      - name: Verify report body and infographic slot integrity
        run: python scripts/validate_report_index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize dashboard extensions and cache bust
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          sha = os.environ.get('DEPLOY_SHA', 'latest')[:12]
          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          us_tag = f'<script src="assets/js/us-breadth-split-card-v2.js?v={sha}"></script>'
          crypto_remove_tag = f'<script src="assets/js/remove-crypto-fear-greed.js?v={sha}"></script>'
          text = re.sub(r'\s*<script src="assets/js/us-breadth-split-card(?:-v2)?\.js\?v=[^"]+"></script>', '', text)
          text = re.sub(r'\s*<script src="assets/js/remove-crypto-fear-greed\.js\?v=[^"]+"></script>', '', text)
          marker = '<script src="assets/js/position-fulltext-fix.js'
          pos = text.find(marker)
          injected = '  ' + us_tag + '\n  ' + crypto_remove_tag + '\n  '
          if pos >= 0:
              text = text[:pos] + injected + text[pos:]
          else:
              text = text.replace('</body>', injected + '</body>')
          index_path.write_text(text, encoding='utf-8')
          stocks_path = Path('stocks.html')
          stocks_text = stocks_path.read_text(encoding='utf-8')
          stocks_text = re.sub(r'<script src="assets/js/stock-sector-decliners\.js\?v=[^"]+"></script>', f'<script src="assets/js/stock-sector-decliners.js?v={sha}"></script>', stocks_text)
          stocks_text = re.sub(r'\s*<script src="assets/js/tokyo-stock-table-overlay\.js\?v=[^"]+"></script>', '', stocks_text)
          overlay_tag = f'<script src="assets/js/tokyo-stock-table-overlay.js?v={sha}"></script>'
          site_marker = '<script src="assets/js/site-common.js'
          site_pos = stocks_text.find(site_marker)
          if site_pos >= 0:
              stocks_text = stocks_text[:site_pos] + overlay_tag + '\n' + stocks_text[site_pos:]
          else:
              stocks_text = stocks_text.replace('</body>', overlay_tag + '\n</body>')
          stocks_path.write_text(stocks_text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the public report index and exact infographic bytes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_public_report_deployment.py --base-url "$PUBLIC_URL"

      - name: Set up Node.js for live Portal DOM validation
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium validator
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify live market-report DOM after deployment
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
  
            const base = String(process.env.PUBLIC_URL || '').replace(/\/$/, '') + '/';
            if (!/^https:\/\//.test(base)) throw new Error('PUBLIC_URL is missing or invalid');
  
            const indexResponse = await fetch(base + 'reports.json?domverify=' + Date.now(), {
              headers: { 'cache-control': 'no-cache', pragma: 'no-cache' }
            });
            if (!indexResponse.ok) throw new Error('reports.json HTTP ' + indexResponse.status);
            const payload = await indexResponse.json();
            const reports = Array.isArray(payload)
              ? payload
              : (Array.isArray(payload?.reports) ? payload.reports : []);
            if (!reports.length) throw new Error('No market reports available for DOM validation');
  
            const valid = reports
              .filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(String(r.date || '')) && /^\d{2}:\d{2}$/.test(String(r.time || '')))
              .sort((a, b) => (b.date + ' ' + b.time).localeCompare(a.date + ' ' + a.time));
            if (!valid.length) throw new Error('No valid report slots found');
  
            const latestDate = valid[0].date;
            const slots = valid.filter(r => r.date === latestDate);
            const browser = await chromium.launch({ headless: true });
  
            try {
              for (const report of slots) {
                const page = await browser.newPage();
                const consoleErrors = [];
                const pageErrors = [];
                page.on('console', msg => {
                  if (msg.type() === 'error') consoleErrors.push(msg.text());
                });
                page.on('pageerror', err => pageErrors.push(String(err && err.message || err)));
  
                const url = base + 'report.html?date=' + encodeURIComponent(report.date) +
                  '&time=' + encodeURIComponent(report.time) +
                  '&domverify=' + Date.now();
  
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForFunction(() => {
                  const app = document.getElementById('app');
                  const status = document.getElementById('reportStatus');
                  if (!app || !status) return false;
                  const appText = (app.textContent || '').trim();
                  const statusText = (status.textContent || '').trim();
                  return appText &&
                    !/本文データを読み込んでいます|マーケットレポートを読み込んでいます/.test(appText + ' ' + statusText) &&
                    !/読み込めません|読込エラー/.test(appText + ' ' + statusText);
                }, { timeout: 60000 });
  
                const result = await page.evaluate(({ expectedDate, expectedTime, expectedTitle }) => {
                  const app = document.getElementById('app');
                  const picker = document.getElementById('datePicker');
                  const activeTab = document.querySelector('.time-tab.is-active');
                  const title = document.querySelector('.report-title');
                  const sections = [...document.querySelectorAll('.sop-section')];
                  const marketSection = sections.find(section => {
                    const heading = section.querySelector('h2')?.textContent || section.dataset.sopTitle || '';
                    return /主要市場データ|主要市場まとめ|市場データ|前営業日終値|終値一覧|主要価格/.test(heading);
                  });
                  const table = marketSection?.querySelector('table.market-table');
                  const rows = table ? [...table.querySelectorAll('tbody tr')] : [];
                  return {
                    appClass: app?.className || '',
                    date: picker?.value || '',
                    activeTime: activeTab?.textContent?.trim() || '',
                    title: title?.textContent?.trim() || '',
                    marketSectionFound: Boolean(marketSection),
                    marketTableFound: Boolean(table),
                    marketRowCount: rows.length,
                    loadingTextPresent: /本文データを読み込んでいます|マーケットレポートを読み込んでいます/.test(
                      (app?.textContent || '') + ' ' + (document.getElementById('reportStatus')?.textContent || '')
                    ),
                    expectedDate,
                    expectedTime,
                    expectedTitle
                  };
                }, {
                  expectedDate: report.date,
                  expectedTime: report.time,
                  expectedTitle: report.title || ''
                });
  
                const failures = [];
                if (result.date !== report.date) failures.push('datePicker mismatch: ' + result.date);
                if (result.activeTime !== report.time) failures.push('active time mismatch: ' + result.activeTime);
                if (report.title && result.title !== report.title) failures.push('title mismatch: ' + result.title);
                if (!result.marketSectionFound) failures.push('major market section missing');
                if (!result.marketTableFound) failures.push('major market data is not rendered as a table');
                if (result.marketRowCount < 6) failures.push('market table has fewer than 6 rows: ' + result.marketRowCount);
                if (result.loadingTextPresent) failures.push('loading text remains visible');
                if (pageErrors.length) failures.push('page errors: ' + pageErrors.join(' | '));
                if (consoleErrors.length) failures.push('console errors: ' + consoleErrors.join(' | '));
  
                console.log(JSON.stringify({
                  slot: report.date + ' ' + report.time,
                  marketRowCount: result.marketRowCount,
                  pageErrors,
                  consoleErrors
                }, null, 2));
  
                await page.close();
                if (failures.length) {
                  throw new Error(report.date + ' ' + report.time + ' live DOM validation failed: ' + failures.join('; '));
                }
              }
            } finally {
              await browser.close();
            }
  
            console.log('Live market-report DOM validation passed for ' + slots.length + ' slot(s) on ' + latestDate);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE
