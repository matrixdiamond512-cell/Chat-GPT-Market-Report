name: Deploy WEB Market Report to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync latest market report publication"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, deploy current main after the synchronization workflow
          # has committed reports.json/dashboard.json. For push/manual runs this is
          # also the intended publication source.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve report history before deployment
        run: python scripts/build_reports.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize dashboard extensions and cache bust
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ.get('DEPLOY_SHA', 'latest')[:12]

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          us_tag = f'<script src="assets/js/us-breadth-split-card-v2.js?v={sha}"></script>'
          crypto_remove_tag = f'<script src="assets/js/remove-crypto-fear-greed.js?v={sha}"></script>'

          text = re.sub(
              r'\s*<script src="assets/js/us-breadth-split-card(?:-v2)?\.js\?v=[^"]+"></script>',
              '',
              text,
          )
          text = re.sub(
              r'\s*<script src="assets/js/remove-crypto-fear-greed\.js\?v=[^"]+"></script>',
              '',
              text,
          )

          marker = '<script src="assets/js/position-fulltext-fix.js'
          pos = text.find(marker)
          injected = '  ' + us_tag + '\n  ' + crypto_remove_tag + '\n  '
          if pos >= 0:
              text = text[:pos] + injected + text[pos:]
          else:
              text = text.replace('</body>', injected + '</body>')
          index_path.write_text(text, encoding='utf-8')

          stocks_path = Path('stocks.html')
          stocks_text = stocks_path.read_text(encoding='utf-8')
          stocks_text = re.sub(
              r'<script src="assets/js/stock-sector-decliners\.js\?v=[^"]+"></script>',
              f'<script src="assets/js/stock-sector-decliners.js?v={sha}"></script>',
              stocks_text,
          )
          stocks_text = re.sub(
              r'\s*<script src="assets/js/tokyo-stock-table-overlay\.js\?v=[^"]+"></script>',
              '',
              stocks_text,
          )
          overlay_tag = f'<script src="assets/js/tokyo-stock-table-overlay.js?v={sha}"></script>'
          site_marker = '<script src="assets/js/site-common.js'
          site_pos = stocks_text.find(site_marker)
          if site_pos >= 0:
              stocks_text = stocks_text[:site_pos] + overlay_tag + '\n' + stocks_text[site_pos:]
          else:
              stocks_text = stocks_text.replace('</body>', overlay_tag + '\n</body>')
          stocks_path.write_text(stocks_text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
