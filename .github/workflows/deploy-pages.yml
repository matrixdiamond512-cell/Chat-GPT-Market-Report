name: Deploy WEB Market Report to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize and cache-bust US breadth renderer
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          sha = os.environ.get('DEPLOY_SHA', 'latest')[:12]
          tag = f'<script src="assets/js/us-breadth-split-card-v2.js?v={sha}"></script>'

          text = re.sub(
              r'\s*<script src="assets/js/us-breadth-split-card(?:-v2)?\.js\?v=[^"]+"></script>',
              '',
              text,
          )

          marker = '<script src="assets/js/position-fulltext-fix.js'
          pos = text.find(marker)
          if pos >= 0:
              text = text[:pos] + '  ' + tag + '\n  ' + text[pos:]
          else:
              text = text.replace('</body>', '  ' + tag + '\n</body>')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
