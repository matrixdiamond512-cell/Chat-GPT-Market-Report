name: Rebuild canonical report history index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-report-history-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-report-history-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication-eligible index is reproducible from canonical history
        run: |
          cp reports.json /tmp/report-index-before.json
          python scripts/build_reports.py --canonical-only
          cmp /tmp/report-index-before.json reports.json
          python scripts/validate_report_index.py
          python scripts/verify_publication_consistency.py
      - name: Confirm verification made no publication changes
        run: |
          git diff --exit-code -- reports reports.json data/latest-report.json data/dashboard.json
