name: Rebuild canonical report history index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-report-history-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-report-history-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild index without replacing canonical report texts
        run: |
          python scripts/reconcile_report_history.py
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          for time in ('12:00', '16:00'):
              rows = [r for r in index if r.get('date') == '2026-09-22' and r.get('time') == time]
              assert len(rows) == 1 and rows[0].get('fullText'), f'missing full text: {time}'
              source = json.loads(Path('reports', f'2026-09-22_{time.replace(":", "-")}.json').read_text(encoding='utf-8'))
              assert rows[0] == source, f'canonical/index mismatch: {time}'
          print('Both September 22 report texts are in the rebuilt index.')
          PY
      - name: Commit rebuilt index
        run: |
          if git diff --quiet -- reports reports.json; then
            echo 'Report history index already consistent.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports reports.json
          git commit -m 'Restore full canonical report history index'
          git pull --rebase origin main
          git push
