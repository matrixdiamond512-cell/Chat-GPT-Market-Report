name: Update US stock table and daily archive

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/restore_us_market_internals_table.py"
      - "scripts/archive_stocks_snapshot.py"
      - ".github/workflows/restore-us-market-internals.yml"
  schedule:
    # 06:50 JST Monday-Friday. This captures the completed U.S. session.
    - cron: "50 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/restore_us_market_internals_table.py

      - name: Update completed US session only
        run: python scripts/restore_us_market_internals_table.py

      - name: Validate independent market dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          dates = data.get('marketDates') or {}
          if not dates.get('us') or not dates.get('japan'):
              raise SystemExit('Both U.S. and Tokyo market dates are required')
          history = Path('data/history/stocks') / (data.get('snapshotDate') or '')
          print('US data date:', dates['us'])
          print('Tokyo data date:', dates['japan'])
          PY

      - name: Commit updated US table and archive
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update completed US session and stock archive" data/stocks.json data/market/us-stock-breadth.json data/history/stocks
