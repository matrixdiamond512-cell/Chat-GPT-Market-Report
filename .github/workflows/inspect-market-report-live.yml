name: Inspect live market report page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-market-report-live.yml"
      - ".github/market-report-inspect-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live v3 assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report'
          for i in $(seq 1 30); do
            CB="$(date +%s)-$i"
            curl -fsSL --retry 2 --retry-delay 1 "${BASE}/report.html?date=2026-08-17&time=16%3A00&cb=${CB}" -o /tmp/report.html || true
            curl -fsSL --retry 2 --retry-delay 1 "${BASE}/assets/js/report-core-v3.js?cb=${CB}" -o /tmp/report-core-v3.js || true
            curl -fsSL --retry 2 --retry-delay 1 "${BASE}/reports.json?cb=${CB}" -o /tmp/reports.json || true
            if grep -q 'report-core-v3.js?v=20260817-1845-core-v3' /tmp/report.html 2>/dev/null \
               && grep -q 'MarketReportRendererVersion = "20260817-1845-core-v3"' /tmp/report-core-v3.js 2>/dev/null; then
              break
            fi
            sleep 3
          done
          grep -oE '<script[^>]+src="[^"]+"' /tmp/report.html || true
          grep -o 'MarketReportRendererVersion[^;]*' /tmp/report-core-v3.js || true
          grep -q 'report-core-v3.js?v=20260817-1845-core-v3' /tmp/report.html
          ! grep -q 'latest-report-bootstrap.js' /tmp/report.html
          ! grep -q 'report-core-v2.js' /tmp/report.html

      - name: Check v3 JavaScript syntax
        run: node --check /tmp/report-core-v3.js

      - name: Validate final live DOM in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [ -n "$CHROME" ] || { echo 'Chrome not found'; exit 1; }
          URL="https://matrixdiamond512-cell.github.io/Chat-GPT-Market-Report/report.html?date=2026-08-17&time=16%3A00&cb=$(date +%s)"
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom "$URL" > /tmp/report-dom.html
          python - <<'PY'
          import re, html as h, pathlib
          s=pathlib.Path('/tmp/report-dom.html').read_text(encoding='utf-8',errors='replace')
          print('STATUS=', re.findall(r'id="reportStatus"[^>]*>(.*?)</div>', s, re.S)[:1])
          headings=[re.sub(r'<[^>]+>','',h.unescape(x)).strip() for x in re.findall(r'<h2[^>]*>(.*?)</h2>',s,re.S)]
          print('H2=', headings)
          checks={
            'v3': '統合レンダラー v3' in s,
            'reportsJsonSource': 'reports.json正本' in s,
            'majorHeading': '主要市場データ' in headings,
            'majorAttr': 'data-sop-title="主要市場データ"' in s,
            'table': '<table' in s,
            'fiveHeaders': all(x in s for x in ['市場・指標','現在値・確認値','前日比','騰落率','方向・状態']),
            'gold': '金' in s,
            'oil': '原油' in s,
            'nikkei': '日経225先物' in s,
            'usdjpy': 'USD/JPY' in s,
            'eurusd': 'EUR/USD' in s,
            'btc': 'BTCUSD' in s,
          }
          print('CHECKS=', checks)
          if not all(checks.values()):
              raise SystemExit('live v3 DOM validation failed')
          PY
