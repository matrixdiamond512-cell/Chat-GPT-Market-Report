name: Probe JPX historical OI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_jpx_historical_oi_standalone.py"
      - "scripts/probe_jpx_monthly_json.py"
      - "scripts/probe_jpx_sif_daily.py"
      - ".github/workflows/probe-jpx-historical-oi.yml"
      - ".github/probe-jpx-historical-oi-trigger.txt"
permissions:
  contents: write
concurrency:
  group: probe-jpx-historical-oi
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl
      - run: python scripts/probe_jpx_historical_oi_standalone.py
      - run: python scripts/probe_jpx_monthly_json.py
      - run: python scripts/probe_jpx_sif_daily.py
      - name: Commit probe output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug-jpx-historical-oi.json data/debug-jpx-monthly-json.json data/debug-jpx-sif-daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record JPX historical OI probe"
          git pull --rebase origin main
          git push origin main
