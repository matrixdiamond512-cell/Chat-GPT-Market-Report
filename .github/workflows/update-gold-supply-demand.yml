name: Update gold supply-demand data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/market/latest.json"
      - "scripts/update_gold_supply_demand.py"
      - "scripts/write_gold_supply_demand_to_sheets.py"
      - "scripts/requirements-gold-supply-demand.txt"
      - ".github/workflows/update-gold-supply-demand.yml"
  schedule:
    # 07:10 / 12:10 / 16:10 / 21:10 JST on weekdays, plus Sat 07:10 JST.
    - cron: "10 22 * * 0-4"
    - cron: "10 3 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "10 22 * * 5"

permissions:
  contents: write

concurrency:
  group: update-gold-supply-demand
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-gold-supply-demand.txt

      - name: Validate scripts
        run: |
          python -m py_compile scripts/update_gold_supply_demand.py
          python -m py_compile scripts/write_gold_supply_demand_to_sheets.py

      - name: Build gold supply-demand JSON
        run: python scripts/update_gold_supply_demand.py

      - name: Validate JSON
        run: python -m json.tool data/gold-supply-demand.json > /dev/null

      - name: Commit gold data
        shell: bash
        run: |
          if git diff --quiet -- data/gold-supply-demand.json; then
            echo "Gold supply-demand JSON is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gold-supply-demand.json
            git commit -m "Update gold supply-demand data"
            git pull --rebase
            git push
          fi

      - name: Sync Gold_Demand sheets
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/write_gold_supply_demand_to_sheets.py
