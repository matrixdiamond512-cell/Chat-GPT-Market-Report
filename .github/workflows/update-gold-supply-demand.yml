name: Update gold supply-demand data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/market/latest.json"
      - "data/gold-supply-demand-trigger/**"
      - "scripts/update_gold_supply_demand.py"
      - "scripts/enrich_gold_cftc_history.py"
      - "scripts/postprocess_gold_supply_demand.py"
      - "scripts/build_gold_supply_demand_sheet_csv.py"
      - "scripts/write_gold_supply_demand_to_sheets.py"
      - "scripts/requirements-gold-supply-demand.txt"
      - ".github/workflows/update-gold-supply-demand.yml"
  schedule:
    # 07:10 / 12:10 / 16:10 / 21:10 JST on weekdays, plus Sat 07:10 JST.
    - cron: "10 22 * * 0-4"
    - cron: "10 3 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "10 22 * * 5"

permissions:
  contents: write

concurrency:
  group: update-gold-supply-demand-csv-v5-cftc-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-gold-supply-demand.txt

      - name: Validate scripts
        run: |
          python -m py_compile scripts/update_gold_supply_demand.py
          python -m py_compile scripts/enrich_gold_cftc_history.py
          python -m py_compile scripts/postprocess_gold_supply_demand.py
          python -m py_compile scripts/write_gold_supply_demand_to_sheets.py
          python -m py_compile scripts/build_gold_supply_demand_sheet_csv.py

      - name: Build gold supply-demand JSON
        run: python scripts/update_gold_supply_demand.py

      - name: Add 26-week CFTC positioning history
        run: python scripts/enrich_gold_cftc_history.py

      - name: Normalize display statuses
        run: python scripts/postprocess_gold_supply_demand.py

      - name: Build Gold_Demand CSV
        run: python scripts/build_gold_supply_demand_sheet_csv.py

      - name: Validate outputs
        run: |
          python -m json.tool data/gold-supply-demand.json > /dev/null
          test -s data/gold-supply-demand-sheet.csv
          python - <<'PYCODE'
          import csv
          import json
          from pathlib import Path
          with Path('data/gold-supply-demand-sheet.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.reader(f))
          if not rows or len(rows[0]) != 12:
              raise SystemExit('Gold_Demand CSV must have exactly 12 columns')
          data = json.loads(Path('data/gold-supply-demand.json').read_text(encoding='utf-8'))
          history = ((data.get('cftc') or {}).get('historyWeeks') or [])
          if history and len(history) < 2:
              raise SystemExit('CFTC history must contain at least 2 rows when present')
          print('Gold_Demand CSV rows:', len(rows), 'columns:', len(rows[0]))
          print('CFTC history weeks:', len(history))
          PYCODE

      - name: Commit gold data and sheet CSV
        shell: bash
        run: |
          if git diff --quiet -- data/gold-supply-demand.json data/gold-supply-demand-sheet.csv; then
            echo "Gold supply-demand outputs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-supply-demand.json data/gold-supply-demand-sheet.csv
          git commit -m "Update gold supply-demand data and sheet CSV"
          git pull --rebase
          git push
