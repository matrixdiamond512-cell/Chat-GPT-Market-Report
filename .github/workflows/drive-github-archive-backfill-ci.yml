name: Drive-GitHub archive backfill CI
on:
  push:
    branches: [fix/drive-github-archive-recovery-20261013]
  pull_request:
    paths:
      - apps-script/MarketReportAutoPublish.gs
      - scripts/test_drive_github_archive_backfill.js
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test_drive_github_archive_backfill.js
      - run: node scripts/test_drive_github_history_backfill.js
      - run: node scripts/test_report_remote_readback.js
