name: Zero-cost report delivery shadow contracts
on:
  pull_request:
    paths:
      - scripts/verify_scheduled_report_delivery.py
      - tests/test_scheduled_report_delivery.py
      - scripts/run_report_delivery.py
      - scripts/build_market_json.py
      - tests/test_market_projection_immutability.py
      - scripts/verify_zero_cost_delivery.py
      - tests/test_zero_cost_delivery.py
      - config/report_delivery_policy.json
      - .github/workflows/report-delivery-shadow-ci.yml
      - .github/workflows/one-time-openai-funded-test-20261015.yml
      - .github/workflows/one-time-openai-generation-20261015.yml
      - .github/workflows/probe-openai-input-tokens-once.yml
      - .github/workflows/verify-openai-api-readiness.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce local-only zero-cost policy before tests
        run: python scripts/verify_zero_cost_delivery.py
      - name: Verify offline intake, immutable sources, locking and restart
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.test_zero_cost_delivery tests.test_market_projection_immutability tests.test_publication_evidence tests.test_report_slot_evidence tests.test_scheduled_report_delivery -v
