name: 08:00 market data fallback windows

on:
  workflow_dispatch:
  schedule:
    # Independent backups for the 08:00 report window.
    # 06:55 JST recovers a missed primary start; 07:42 JST is the emergency final fallback.
    - cron: "55 21 * * 0-5"
    - cron: "42 22 * * 0-5"

permissions:
  contents: write

concurrency:
  group: market-data-08-window
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py

      - name: Recover missing 08:00 acquisition attempts
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: fallback_window
        run: |
          python scripts/run_market_data_window.py \
            --slot "08:00" \
            --times "06:30,07:00,07:20,07:30,07:40,07:45,07:50" \
            --trigger-source "fallback_window" \
            --max-catchup-minutes 120
