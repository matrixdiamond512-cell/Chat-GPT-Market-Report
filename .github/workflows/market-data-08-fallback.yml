name: 08:00 market data fallback checks

on:
  workflow_dispatch:
    inputs:
      recovery_time:
        description: "Fallback acquisition label"
        required: false
        default: "07:42"
        type: choice
        options:
          - "06:55"
          - "07:42"
  schedule:
    # Independent backups. They refresh stale live quotes and retry any missing
    # symbols without replaying the seven primary timestamps.
    - cron: "55 21 * * 0-5" # 06:55 JST
    - cron: "42 22 * * 0-5" # 07:42 JST

permissions:
  contents: write

concurrency:
  group: market-data-08-window
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py
          python -m py_compile scripts/verify_market_report_readiness.py

      - name: Resolve recovery time
        id: recovery
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "55 21 * * 0-5") TIME="06:55" ;;
            "42 22 * * 0-5") TIME="07:42" ;;
            *) TIME="${{ inputs.recovery_time }}" ;;
          esac
          if [ -z "$TIME" ]; then TIME="07:42"; fi
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

      - name: Run one fallback acquisition
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: fallback_check
        run: |
          python scripts/run_market_data_window.py \
            --slot "08:00" \
            --times "${{ steps.recovery.outputs.time }}" \
            --trigger-source "fallback_check" \
            --max-catchup-minutes 15 \
            --mode auto
