name: Update Tokyo stock table and daily archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/nikkei-metrics.json"
      - "scripts/merge_nikkei_metrics_into_stocks.py"
      - "scripts/archive_stocks_snapshot.py"
      - ".github/workflows/merge-nikkei-metrics-into-stocks.yml"

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/merge_nikkei_metrics_into_stocks.py

      - name: Advance completed Tokyo session only
        run: python scripts/merge_nikkei_metrics_into_stocks.py

      - name: Validate Japan market table and independent dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = {
              "日経VI",
              "日経225予想PER",
              "日経225予想EPS",
              "日経225 25日乖離率",
              "日経225 200日乖離率",
          }
          data = json.loads(Path("data/stocks.json").read_text(encoding="utf-8"))
          rows = (((data.get("marketInternals") or {}).get("japan") or {}).get("rows") or [])
          names = {str(row[0]) for row in rows if isinstance(row, list) and row}
          missing = required - names
          if missing:
              raise SystemExit("Japan market table is missing: " + ", ".join(sorted(missing)))
          dates = data.get("marketDates") or {}
          if not dates.get("us") or not dates.get("japan"):
              raise SystemExit("Both U.S. and Tokyo market dates are required")
          print("US data date retained:", dates["us"])
          print("Tokyo data date advanced:", dates["japan"])
          PY

      - name: Commit Tokyo table and archive
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update completed Tokyo session and stock archive" data/stocks.json data/history/stocks
