name: Update Nikkei 225 options data

on:
  workflow_dispatch:
  schedule:
    # JPX Daily Report is normally published around 09:00 JST on the next business day.
    # 00:20 UTC = 09:20 JST.
    - cron: '20 0 * * 1-5'
  push:
    paths:
      - 'scripts/update_nikkei225_options.py'
      - '.github/workflows/update-nikkei225-options.yml'

permissions:
  contents: write

concurrency:
  group: update-nikkei225-options
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Update JPX Nikkei 225 options OI
        run: python scripts/update_nikkei225_options.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nikkei225-supply-demand.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          o=d.get('options',{})
          rows=o.get('strikeOpenInterest') or []
          assert rows, 'strikeOpenInterest is empty'
          assert o.get('strikeOiStatus') == 'verified', o.get('strikeOiStatus')
          assert any((r.get('putOi') or 0) > 0 for r in rows), 'no Put OI'
          assert any((r.get('callOi') or 0) > 0 for r in rows), 'no Call OI'
          print('validated:', o.get('optionContractMonth'), o.get('strikeOiAsOfDate'), len(rows))
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/nikkei225-supply-demand.json; then
            echo 'No data change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nikkei225-supply-demand.json
          git commit -m 'Update Nikkei 225 options OI data'
          git pull --rebase origin main
          git push origin HEAD:main
