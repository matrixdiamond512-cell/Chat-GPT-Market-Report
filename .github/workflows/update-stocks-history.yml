name: Update stock analysis history

on:
  workflow_dispatch:
  schedule:
    - cron: "50 21 * * 0-4" # 06:50 JST, U.S. close fallback
    - cron: "50 7 * * 1-5"  # 16:50 JST, Tokyo close fallback
  push:
    branches: [main]
    paths:
      - "data/stocks.json"
      - "data/sector-performance.json"
      - "data/market/sector-performance.json"
      - "data/nikkei-metrics.json"
      - "scripts/archive_stocks_snapshot.py"
      - "scripts/snapshot_stocks_history.py"
      - "assets/js/stock-sector-decliners.js"
      - ".github/workflows/update-stocks-history.yml"

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate snapshot scripts
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/snapshot_stocks_history.py

      - name: Create stock history snapshot
        run: python scripts/snapshot_stocks_history.py

      - name: Validate stock freshness boundary
        run: python scripts/validate_stock_data_freshness.py

      - name: Validate independent market dates
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          date_re = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          index_path = Path("data/history/stocks/index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          latest = index.get("latestDate")
          if not latest:
              raise SystemExit("stock history index has no latestDate")
          snapshot_path = Path("data/history/stocks") / f"{latest}.json"
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          if snapshot.get("snapshotDate") != latest:
              raise SystemExit("stock history snapshot date mismatch")
          dates = snapshot.get("marketDates") or {}
          if not date_re.fullmatch(str(dates.get("us") or "")):
              raise SystemExit("U.S. market data date is missing")
          if not date_re.fullmatch(str(dates.get("japan") or "")):
              raise SystemExit("Tokyo market data date is missing")
          for key in ("us", "japan"):
              table = (((snapshot.get("marketInternals") or {}).get(key) or {}).get("rows") or [])
              if not table:
                  raise SystemExit(f"{key} market table is empty")
          print("Snapshot date:", latest)
          print("U.S. market date:", dates["us"])
          print("Tokyo market date:", dates["japan"])
          PY

      - name: Commit stock history
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update stock analysis history with independent dates" data/history/stocks

