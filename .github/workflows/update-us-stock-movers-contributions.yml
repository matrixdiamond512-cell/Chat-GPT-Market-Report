name: Update US stock movers and S&P contributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_us_stock_movers_sp500_contributions.py"
      - "scripts/validate_sp500_movers_contributions.py"
      - ".github/workflows/update-us-stock-movers-contributions.yml"
  schedule:
    # U.S. cash close is 05:00 JST during DST. Run after breadth and retry for publication lag.
    - cron: "45 21 * * 1-5" # 06:45 JST Tue-Sat
    - cron: "5 22 * * 1-5"  # 07:05 JST Tue-Sat
    - cron: "25 22 * * 1-5" # 07:25 JST Tue-Sat
  workflow_run:
    workflows: ["Update US stock table and daily archive"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: update-us-stock-movers-contributions
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth

      - name: Fetch verified S&P movers and contribution estimates
        id: fetch
        continue-on-error: true
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          python scripts/fetch_us_stock_movers_sp500_contributions.py 2>&1 | tee /tmp/us-stock-fetch.log

      - name: Cross-check against verified S&P 500 return
        id: crosscheck
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/validate_sp500_movers_contributions.py 2>&1 | tee /tmp/us-stock-crosscheck.log

      - name: Write pipeline status
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          CROSSCHECK_OUTCOME: ${{ steps.crosscheck.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          JST = timezone(timedelta(hours=9))
          lines = []
          for file_name in ('/tmp/us-stock-fetch.log', '/tmp/us-stock-crosscheck.log'):
              path = Path(file_name)
              if not path.exists():
                  continue
              for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  lower = line.lower()
                  if any(token in lower for token in ('private_key', 'client_email', 'credential', 'authorization:', 'bearer ')):
                      continue
                  lines.append(line[:500])
          fetch_ok = os.environ.get('FETCH_OUTCOME') == 'success'
          cross_ok = os.environ.get('CROSSCHECK_OUTCOME') == 'success'
          payload = {
              'schemaVersion': '1.1.0',
              'updatedAt': datetime.now(JST).replace(microsecond=0).isoformat(),
              'status': 'ok' if fetch_ok and cross_ok else 'failed',
              'fetchOutcome': os.environ.get('FETCH_OUTCOME'),
              'crosscheckOutcome': os.environ.get('CROSSCHECK_OUTCOME'),
              'logTail': lines[-30:],
          }
          path = Path('data/market/us-stock-pipeline-status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate generated data
        if: steps.fetch.outcome == 'success' && steps.crosscheck.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          movers = json.loads(Path('data/market/us-stock-movers.json').read_text(encoding='utf-8'))
          contrib = json.loads(Path('data/market/sp500-contributions.json').read_text(encoding='utf-8'))
          stocks = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          date = str((stocks.get('marketDates') or {}).get('us') or '')[:10]
          if movers.get('status') != 'verified' or movers.get('dataDate') != date:
              raise SystemExit('US movers are not synced to the verified US market date')
          if contrib.get('status') != 'verified-estimate' or contrib.get('dataDate') != date:
              raise SystemExit('S&P contribution estimates are not synced to the verified US market date')
          if contrib.get('official') is not False or contrib.get('unit') != 'bp':
              raise SystemExit('S&P contribution estimate labeling is invalid')
          validation = contrib.get('validation') or {}
          if validation.get('status') != 'passed':
              raise SystemExit('S&P return cross-check did not pass')
          if abs(float(validation.get('differencePt'))) > float(validation.get('tolerancePt')):
              raise SystemExit('S&P return cross-check exceeded tolerance')
          for key in ('gainers','losers'):
              if len(movers.get(key) or []) != 5:
                  raise SystemExit(f'US movers {key} must contain 5 rows')
          for key in ('top','bottom'):
              if len(contrib.get(key) or []) != 5:
                  raise SystemExit(f'S&P contributions {key} must contain 5 rows')
          stock_movers = ((stocks.get('movers') or {}).get('us') or {})
          stock_contrib = ((stocks.get('contributions') or {}).get('us') or {})
          if stock_movers.get('dataDate') != date or stock_contrib.get('dataDate') != date:
              raise SystemExit('stocks.json US mover/contribution blocks are not synced')
          print('Verified U.S. mover/contribution data for', date, validation)
          PY
          python scripts/validate_stock_data_freshness.py

      - name: Save stock-analysis history snapshot
        if: steps.fetch.outcome == 'success' && steps.crosscheck.outcome == 'success'
        run: |
          if [ -f scripts/snapshot_stocks_history.py ]; then
            python scripts/snapshot_stocks_history.py
          fi

      - name: Commit result or diagnostic
        if: always()
        shell: bash
        run: |
          message="Record US stock mover pipeline failure"
          if [ "${{ steps.fetch.outcome }}" = "success" ] && [ "${{ steps.crosscheck.outcome }}" = "success" ]; then
            message="Update verified US stock movers and S&P contributions"
          fi
          bash scripts/publish_stock_update.sh "$message" data/market/us-stock-pipeline-status.json data/market/us-stock-movers.json data/market/sp500-contributions.json data/stocks.json data/history/stocks

      - name: Fail workflow after diagnostic is saved
        if: steps.fetch.outcome != 'success' || steps.crosscheck.outcome != 'success'
        run: exit 1

