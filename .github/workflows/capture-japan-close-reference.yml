name: Capture Japan close reference

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Japan trading date YYYY-MM-DD; blank=latest completed Tokyo session"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/capture_japan_close_reference.py"
      - ".github/workflows/capture-japan-close-reference.yml"
  schedule:
    - cron: "10 7 * * 1-5"   # 16:10 JST
    - cron: "40 7 * * 1-5"   # 16:40 JST
    - cron: "10 8 * * 1-5"   # 17:10 JST
    - cron: "10 9 * * 1-5"   # 18:10 JST
    - cron: "10 11 * * 1-5"  # 20:10 JST
    - cron: "10 14 * * 1-5"  # 23:10 JST

permissions:
  contents: write

concurrency:
  group: capture-japan-close-reference
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve latest completed Tokyo session
        id: target
        shell: bash
        run: |
          TARGET="${{ inputs.target_date }}"
          if [ -z "$TARGET" ]; then
            TARGET="$(python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo('Asia/Tokyo'))
          day = now.date()

          def previous_weekday(value: dt.date) -> dt.date:
              value -= dt.timedelta(days=1)
              while value.weekday() >= 5:
                  value -= dt.timedelta(days=1)
              return value

          if day.weekday() < 5 and now.time() >= dt.time(16, 0):
              target = day
          else:
              target = previous_weekday(day)
          print(target.isoformat())
          PY
          )"
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved Tokyo session: $TARGET"

      - name: Capture exact-date Japanese close data
        run: python scripts/capture_japan_close_reference.py --date "${{ steps.target.outputs.date }}"

      - name: Validate reference shape and exact target date
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/market/japan-close-reference.json').read_text(encoding='utf-8'))
          target='${{ steps.target.outputs.date }}'
          assert p.get('dataDate') == target, f"dataDate mismatch: {p.get('dataDate')} != {target}"
          assert isinstance(p.get('items'),dict), 'items missing'
          assert isinstance(p.get('unavailable'),dict), 'unavailable missing'
          assert isinstance(p.get('breadthHistory'),list), 'breadthHistory missing'
          print({
              'dataDate':p['dataDate'],
              'itemCount':len(p['items']),
              'complete':p.get('complete'),
              'breadthHistoryCount':len(p.get('breadthHistory') or []),
              'primeRatio25':((p.get('items') or {}).get('東証プライム25日騰落レシオ') or {}).get('value'),
          })
          PY

      - name: Commit capture result without stale-rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other market workflows may push while this job is running. Always
          # recompute the exact target date on the newest main before committing,
          # then retry a rejected push instead of leaving a rebase conflict.
          for ATTEMPT in 1 2 3; do
            echo "Commit attempt $ATTEMPT"
            git fetch origin main
            git reset --hard origin/main
            python scripts/capture_japan_close_reference.py --date "$TARGET"

            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/market/japan-close-reference.json').read_text(encoding='utf-8'))
          target='${{ steps.target.outputs.date }}'
          assert p.get('dataDate') == target
          assert ((p.get('items') or {}).get('東証プライム値上がり銘柄数') or {}).get('value')
          assert ((p.get('items') or {}).get('東証プライム値下がり銘柄数') or {}).get('value')
          PY

            git add data/market/japan-close-reference.json
            if git diff --cached --quiet; then
              echo "Reference unchanged on latest main"
              exit 0
            fi
            git commit -m "Capture Japan close reference $TARGET"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying from latest main."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed to commit Japan close reference after 3 attempts" >&2
          exit 1
