name: WGC global ETF flow scope regression

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/enrich_gold_etf_flow.py"
      - "scripts/test_wgc_global_etf_flow.py"
      - ".github/workflows/wgc-global-flow-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/enrich_gold_etf_flow.py"
      - "scripts/test_wgc_global_etf_flow.py"
      - ".github/workflows/wgc-global-flow-ci.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parsing dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Test global versus European ETF flow extraction
        run: python -m unittest discover -s scripts -p 'test_wgc_global_etf_flow.py' -v
