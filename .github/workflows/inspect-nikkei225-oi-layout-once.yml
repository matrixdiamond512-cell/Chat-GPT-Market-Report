name: Inspect Nikkei 225 OI layout once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-nikkei225-oi-layout-once.yml"
      - "scripts/inspect_nikkei225_oi_layout.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-nikkei225-supply-demand.txt
      - run: python scripts/inspect_nikkei225_oi_layout.py
      - run: python -m json.tool data/nikkei225-oi-layout.json > /dev/null
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225-oi-layout.json
          git commit -m "Inspect Nikkei 225 OI cell layout" || exit 0
          git pull --rebase origin main
          git push origin main
