name: Tokyo stock holiday date regression
on:
  push:
    branches: [fix/tokyo-session-holiday-date-20261013]
  pull_request:
    paths:
      - scripts/update_tokyo_stock_table_from_sheet.py
      - scripts/resolve_tokyo_close_target.py
      - tests/test_tokyo_stock_holiday_date.py
      - .github/workflows/update-tokyo-stock-table.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests jpholiday
      - run: python -m unittest discover -s tests -p 'test_tokyo_stock_holiday_date.py' -v
