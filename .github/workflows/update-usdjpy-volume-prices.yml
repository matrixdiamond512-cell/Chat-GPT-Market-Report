name: Repair Tokyo USDJPY spot volume price gaps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-usdjpy-volume-prices.yml
      - scripts/run_usdjpy_volume_price_backfill.py
      - scripts/yahoo_jp_usdjpy_ohlc.py
      - scripts/stooq_usdjpy_ohlc.py
      - scripts/apply_dukascopy_usdjpy_csv.py
      - scripts/fix_usdjpy_volume_price_labels.py
      # Apps Script publishes BOJ turnover under the user's token.
      # Re-attach verified OHLC immediately after that volume-only write.
      - data/usdjpy-volume.json
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: tokyo-usdjpy-volume-prices
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill and cross-check USDJPY historical daily OHLC
        run: |
          python -m py_compile scripts/update_usdjpy_volume_prices.py scripts/yahoo_jp_usdjpy_ohlc.py scripts/run_usdjpy_volume_price_backfill.py scripts/stooq_usdjpy_ohlc.py scripts/fix_usdjpy_volume_price_labels.py
          python scripts/run_usdjpy_volume_price_backfill.py
          python scripts/fix_usdjpy_volume_price_labels.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore older USDJPY sessions from Dukascopy daily bid history
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/dukascopy-usdjpy"
          npx --yes dukascopy-node@1.51.1 -i usdjpy -from 2025-09-20 -to 2025-12-01 -t d1 -p bid -f csv -dir "$RUNNER_TEMP/dukascopy-usdjpy" -fn "usdjpy-2025-historical"
          python scripts/apply_dukascopy_usdjpy_csv.py --csv-dir "$RUNNER_TEMP/dukascopy-usdjpy"
      - name: Audit full history and verified price-source metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/usdjpy-volume.json').read_text(encoding='utf-8'))
          rows=payload['data']['records']
          assert len(rows)>=20, 'Fewer than 20 spot-volume rows'
          missing={r['targetDate']: [key for key in ('open','high','low','close','priceChangePct') if r.get(key) is None] for r in rows}
          missing={date: fields for date, fields in missing.items() if fields}
          print('Historical price gaps:',len(missing),list(missing)[:25])
          print('Coverage:',len(rows)-len(missing),'/',len(rows))
          print('Missing dates recorded:',len(payload['data'].get('priceAcquisition',{}).get('missingAllDates',[])))
          assert set(payload['data'].get('priceAcquisition',{}).get('missingAllDates',[])) == {date for date,fields in missing.items() if any(k in fields for k in ('open','high','low','close'))}, 'Historical missing OHLC metadata out of sync'
          print('OHLC audit checked',len(rows),'BOJ volume dates')
          print('Newest volume date:',rows[0]['targetDate'],'USDJPY close:',rows[0]['close'])
          print('Price source:',payload['data'].get('priceSourceName'))
          PY
      - name: Save backfilled data and updated dashboard attribution
        run: |
          if git diff --quiet -- data/usdjpy-volume.json usdjpy-volume.html; then
            echo 'No USDJPY missing price data or dashboard label changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/usdjpy-volume.json usdjpy-volume.html
          git commit -m 'Complete BOJ USDJPY spot-volume chart and disclose daily OHLC sources'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail health check when historical dates still missing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/usdjpy-volume.json").read_text(encoding="utf-8"))
          missing=[r["targetDate"] for r in p["data"]["records"]
                   if any(r.get(k) is None for k in ("open","high","low","close"))]
          if missing:
              raise SystemExit(f"USDJPY HISTORICAL PRICE GAPS REMAIN ({len(missing)}): "+", ".join(missing[:15]))
          remaining_pct=[r["targetDate"] for r in p["data"]["records"] if r.get("priceChangePct") is None]
          if remaining_pct:
              print("::warning::daily price percent change not comparable across vendor-day boundary:",remaining_pct)
          print("PASS: all BOJ volume dates have complete attributed USDJPY daily OHLC")
          PY
