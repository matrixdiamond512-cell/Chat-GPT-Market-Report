name: Rebuild market report portal index
on:
  push:
    branches: [main]
    paths:
      - 'reports/*.json'
      - 'scripts/build_report_index.py'
      - 'scripts/build_reports.py'
      - 'scripts/report_identity.py'
      - 'scripts/report_source_contract.py'
      - 'scripts/sync_latest_report_publication.py'
      - 'scripts/verify_publication_consistency.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-report-index
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild report index and dashboard
        run: python scripts/build_report_index.py
      - name: Commit regenerated portal files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json data/latest-report.json data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild portal report index from canonical report JSON"
            git push
          fi
