name: Update Japan stock movers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_japan_stock_movers.py"
      - ".github/workflows/update-japan-stock-movers.yml"
  schedule:
    # Run after the Tokyo close table and keep retrying because the public
    # ranking page can publish later than the close. Exact-date validation in
    # the collector prevents a stale ranking from being relabelled as current.
    - cron: "30 7 * * 1-5"  # 16:30 JST
    - cron: "50 7 * * 1-5"  # 16:50 JST
    - cron: "10 8 * * 1-5"  # 17:10 JST
    - cron: "30 9 * * 1-5"  # 18:30 JST
    - cron: "30 11 * * 1-5" # 20:30 JST
    - cron: "30 14 * * 1-5" # 23:30 JST

permissions:
  contents: write

concurrency:
  group: update-japan-stock-movers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth

      - name: Fetch verified Tokyo Prime movers
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_japan_stock_movers.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          movers = json.loads(Path('data/market/japan-stock-movers.json').read_text(encoding='utf-8'))
          current = movers.get('current') or movers
          stocks = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          date = str((stocks.get('marketDates') or {}).get('japan') or '')[:10]
          if current.get('status') == 'unavailable':
              if any(current.get(key) for key in ('gainers', 'losers')):
                  raise SystemExit('Unavailable Japan movers current must not contain rows')
              last_good = movers.get('lastGood') or {}
              if last_good and last_good.get('freshness') != 'stale':
                  raise SystemExit('Japan movers lastGood must be marked stale')
              print('Japan movers unavailable; current is empty and lastGood is isolated')
              raise SystemExit(0)
          if current.get('status') != 'verified' or current.get('freshness') != 'fresh' or current.get('dataDate') != date:
              raise SystemExit('Japan movers are not synced to the verified Tokyo market date')
          for key in ('gainers','losers'):
              rows = movers.get(key) or []
              if len(rows) != 5:
                  raise SystemExit(f'Japan movers {key} must contain 5 rows')
              if any('東証プライム' not in str(row.get('reason') or '') for row in rows):
                  raise SystemExit('Japan mover row is not labeled as Tokyo Prime')
          block = ((stocks.get('movers') or {}).get('japan') or {})
          if block.get('status') != 'verified' or block.get('freshness') != 'fresh' or block.get('dataDate') != date:
              raise SystemExit('stocks.json Japan mover block is not synced')
          print('Verified Tokyo Prime movers for', date)
          PY

      - name: Report cross-component freshness without blocking mover persistence
        run: python scripts/validate_stock_data_freshness.py --report-only

      - name: Save stock-analysis history snapshot
        run: |
          if [ -f scripts/snapshot_stocks_history.py ]; then
            python scripts/snapshot_stocks_history.py
          fi

      - name: Commit verified or explicitly unavailable data
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update Tokyo Prime stock mover state" data/market/japan-stock-movers.json data/stocks.json data/history/stocks
