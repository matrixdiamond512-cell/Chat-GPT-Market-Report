name: Update USDJPY supply demand page

on:
  workflow_dispatch:
  schedule:
    # Morning, after Tokyo, before Europe and before New York.
    - cron: "35 21 * * 0-4"
    - cron: "15 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 12 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-usdjpy-supply-demand.yml"
      - "scripts/build_usdjpy_supply_demand.py"
      - "scripts/enrich_usdjpy_cftc_52.py"
      - "scripts/enrich_usdjpy_price_history.py"
      - "scripts/enrich_usdjpy_tradersweb_levels.py"
      - "scripts/archive_usdjpy_supply_demand.py"
      - "data/usdjpy-supply-demand-trigger/**"

permissions:
  contents: write

concurrency:
  group: update-usdjpy-supply-demand-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate builders
        run: |
          python -m py_compile scripts/build_usdjpy_supply_demand.py
          python -m py_compile scripts/enrich_usdjpy_cftc_52.py
          python -m py_compile scripts/enrich_usdjpy_price_history.py
          python -m py_compile scripts/enrich_usdjpy_tradersweb_levels.py
          python -m py_compile scripts/archive_usdjpy_supply_demand.py

      - name: Build USDJPY supply-demand JSON
        run: python scripts/build_usdjpy_supply_demand.py

      - name: Expand CFTC positioning and USDJPY price line to 52 weeks
        run: python scripts/enrich_usdjpy_cftc_52.py

      - name: Ensure USDJPY historical price line
        run: python scripts/enrich_usdjpy_price_history.py

      - name: Extract Traders Web FX key levels
        run: python scripts/enrich_usdjpy_tradersweb_levels.py

      - name: Archive USDJPY supply-demand report
        run: python scripts/archive_usdjpy_supply_demand.py

      - name: Validate generated JSON and history archive
        run: |
          python -m json.tool data/usdjpy-supply-demand.json > /dev/null
          python -m json.tool data/usdjpy-supply-demand-archive/index.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/usdjpy-supply-demand.json').read_text(encoding='utf-8'))
          tw = data.get('tradersWebFx', {})
          levels = tw.get('keyLevels', {})
          cftc = data.get('cftc', {})
          series = cftc.get('series', [])
          price_points = sum(isinstance(x.get('price'), (int, float)) for x in series)
          assert data.get('pageId') == 'usdjpy-supply-demand'
          assert data.get('generatedAt')
          assert tw.get('url')
          assert tw.get('status') in {'confirmed','preserved_after_fetch_error'}, tw.get('error')
          assert levels.get('extractedRowCount', 0) > 0, 'No current or preserved Traders Web FX rows'
          assert data.get('coreSnapshot') is not None
          assert len(series) >= 26, f'CFTC series must retain at least 26 weeks, got {len(series)}'
          assert cftc.get('status') in {'verified','degraded','preserved_after_fetch_error'}
          assert price_points >= 26, f'USDJPY price series must retain at least 26 points, got {price_points}'

          index = json.loads(Path('data/usdjpy-supply-demand-archive/index.json').read_text(encoding='utf-8'))
          reports = index.get('reports') or []
          assert index.get('pageId') == 'usdjpy-supply-demand'
          assert reports, 'USDJPY history archive must contain at least one report'
          latest = reports[-1]
          archive_path = Path('data/usdjpy-supply-demand-archive') / latest['file']
          archive = json.loads(archive_path.read_text(encoding='utf-8'))
          assert archive.get('pageId') == 'usdjpy-supply-demand-archive'
          assert archive.get('config', {}).get('pageId') == 'usdjpy-supply-demand'
          assert archive.get('market') is not None
          assert archive.get('rates') is not None
          assert archive.get('volume') is not None

          print('generatedAt:', data.get('generatedAt'))
          print('Traders Web FX status:', tw.get('status'))
          print('Traders Web FX source time:', tw.get('sourceUpdatedAt'))
          print('Traders Web FX checked at:', tw.get('checkedAt'))
          print('Traders Web FX rows:', levels.get('extractedRowCount'))
          print('CFTC:', cftc.get('asOf'), cftc.get('status'), 'weeks:', len(series))
          print('USDJPY price points:', price_points, cftc.get('priceSourceName'))
          print('archive reports:', len(reports), 'latest:', latest.get('date'))
          PY

      - name: Commit refreshed integration metadata and archive
        shell: bash
        run: |
          if git diff --quiet -- data/usdjpy-supply-demand.json data/usdjpy-supply-demand-archive; then
            echo "USDJPY supply-demand data and archive are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy-supply-demand.json data/usdjpy-supply-demand-archive
          git commit -m "Update USDJPY supply-demand data and archive"
          git pull --rebase
          git push
