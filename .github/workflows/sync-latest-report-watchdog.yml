name: Market report publication watchdog

on:
  workflow_dispatch:
  schedule:
    # Recovery checks shortly after each regular report slot.
    - cron: "5,15,30 23 * * 0-4"  # 08:05/08:15/08:30 JST Mon-Fri
    - cron: "5,15,30 3 * * 1-5"   # 12:05/12:15/12:30 JST Mon-Fri
    - cron: "5,15,30,50 7 * * 1-5" # 16:05/16:15/16:30/16:50 JST Mon-Fri
    - cron: "10 8 * * 1-5"         # 17:10 JST correction recovery
    - cron: "5,15,30 12 * * 1-5"  # 21:05/21:15/21:30 JST Mon-Fri
    - cron: "5,20 0 * * 6"         # 09:05/09:20 JST Saturday

permissions:
  contents: write

concurrency:
  group: market-report-publication-watchdog
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the scheduled report slot to exist
        if: github.event_name == 'schedule'
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          schedule = os.environ.get('TRIGGER_SCHEDULE', '')
          expected_by_schedule = {
              '5,15,30 23 * * 0-4': '08:00',
              '5,15,30 3 * * 1-5': '12:00',
              '5,15,30,50 7 * * 1-5': '16:00',
              '10 8 * * 1-5': '16:00',
              '5,15,30 12 * * 1-5': '21:00',
              '5,20 0 * * 6': '09:00',
          }
          expected_time = expected_by_schedule.get(schedule)
          if not expected_time:
              raise SystemExit(f'unknown watchdog schedule: {schedule}')

          jst = timezone(timedelta(hours=9))
          expected_date = datetime.now(jst).date().isoformat()
          expected_key = (expected_date, expected_time)

          latest_payload = json.loads(Path('data/latest-report.json').read_text(encoding='utf-8'))
          latest = latest_payload.get('latestReport') or latest_payload.get('report') or latest_payload
          latest_key = (str(latest.get('date') or ''), str(latest.get('time') or ''))

          if latest_key != expected_key:
              market_path = Path('data/market/latest.json')
              market_note = ''
              if market_path.exists():
                  market = json.loads(market_path.read_text(encoding='utf-8'))
                  market_key = (str(market.get('generatedAt') or '')[:10], str(market.get('reportSlot') or ''))
                  market_note = f'; market snapshot={market_key[0]} {market_key[1]} status={market.get("overallStatus")}'
              raise SystemExit(
                  'scheduled report publication gap: '
                  f'expected {expected_key[0]} {expected_key[1]}, '
                  f'latest-report is {latest_key[0]} {latest_key[1]}' + market_note
              )

          canonical = Path('reports') / f"{expected_date}_{expected_time.replace(':', '-')}.json"
          if not canonical.exists():
              raise SystemExit(f'scheduled canonical report missing: {canonical}')

          index = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          items = index if isinstance(index, list) else index.get('reports') or index.get('items') or []
          if not any(
              isinstance(item, dict)
              and item.get('date') == expected_date
              and item.get('time') == expected_time
              for item in items
          ):
              raise SystemExit(
                  f'scheduled report missing from reports.json: {expected_date} {expected_time}'
              )

          print(f'Scheduled slot verified: {expected_date} {expected_time}')
          PY

      - name: Test verified market-data reconciliation
        run: python scripts/test_reconcile_latest_report_market_data.py

      - name: Reconcile verified intraday market data into latest report
        run: python scripts/reconcile_latest_report_market_data.py

      - name: Rebuild publication from latest report
        run: |
          python scripts/sync_latest_report_publication.py
          python scripts/build_reports.py

      - name: Verify dashboard matches latest report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest_payload = json.loads(Path('data/latest-report.json').read_text(encoding='utf-8'))
          latest = latest_payload.get('latestReport') or latest_payload.get('report') or latest_payload
          dashboard = json.loads(Path('data/dashboard.json').read_text(encoding='utf-8'))
          published = dashboard.get('latestReport') or {}

          expected_key = f"{latest.get('date','')} {latest.get('time','')}"
          actual_key = str(dashboard.get('currentReportKey') or '')
          if actual_key != expected_key:
              raise SystemExit(f'dashboard currentReportKey mismatch: {actual_key} != {expected_key}')

          if published != latest:
              raise SystemExit('dashboard.latestReport does not match data/latest-report.json')

          generated = str(dashboard.get('generatedAt') or '')
          if not generated:
              raise SystemExit('dashboard.generatedAt is missing')

          report_file = Path('reports') / f"{latest['date']}_{latest['time'].replace(':','-')}.json"
          if not report_file.exists():
              raise SystemExit(f'missing report history file: {report_file}')
          history = json.loads(report_file.read_text(encoding='utf-8'))
          if history != latest:
              raise SystemExit(f'history report does not match latest report: {report_file}')

          reports = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          items = reports if isinstance(reports, list) else reports.get('reports') or reports.get('items') or []
          if not any(isinstance(x, dict) and x.get('date') == latest.get('date') and x.get('time') == latest.get('time') for x in items):
              raise SystemExit('reports.json does not contain latest report key')

          print(json.dumps({
              'status': 'ok',
              'currentReportKey': actual_key,
              'dashboardGeneratedAt': generated,
              'historyFile': str(report_file),
          }, ensure_ascii=False))
          PY

      - name: Commit repaired publication files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-report.json data/dashboard.json reports reports.json
          if git diff --cached --quiet; then
            echo "Publication already synchronized."
            exit 0
          fi
          git commit -m "Reconcile market report publication"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
