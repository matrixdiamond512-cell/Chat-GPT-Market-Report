name: Structure Market Reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - reports.json
      - scripts/structure_reports.py
      - scripts/validate_market_reports.py
      - .github/workflows/structure-market-reports.yml
  pull_request:
    paths:
      - reports.json
      - scripts/structure_reports.py
      - scripts/validate_market_reports.py
      - .github/workflows/structure-market-reports.yml

permissions:
  contents: write

concurrency:
  group: structure-market-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON before processing
        run: python -m json.tool reports.json > /dev/null

      - name: Fill dashboard fields from full report text
        run: python scripts/structure_reports.py reports.json

      - name: Validate structured JSON
        run: python -m json.tool reports.json > /dev/null

      - name: Check report quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          with_text = [r for r in reports if r.get('fullText')]
          structured = [r for r in with_text if r.get('structuredFromFullText')]
          market_complete = [
              r for r in structured
              if len(r.get('markets') or []) == 6
          ]

          print(f'Total reports: {len(reports)}')
          print(f'Reports with full text: {len(with_text)}')
          print(f'Structured reports: {len(structured)}')
          print(f'Reports with six markets: {len(market_complete)}')

          if with_text and len(structured) != len(with_text):
              raise SystemExit('Some full-text reports were not structured.')
          if structured and len(market_complete) != len(structured):
              raise SystemExit('Some structured reports do not contain all six markets.')
          PY

      - name: Strictly validate latest report before commit
        run: python scripts/validate_market_reports.py --file reports.json

      - name: Commit structured reports
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- reports.json; then
            echo 'reports.json is already fully structured and validated.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports.json
          git commit -m 'Structure and validate imported market report content'
          git push
