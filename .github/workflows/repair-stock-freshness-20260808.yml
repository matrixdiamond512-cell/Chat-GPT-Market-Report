name: Repair stock freshness 2026-08-08

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-stock-freshness-20260808.yml"

permissions:
  contents: write

concurrency:
  group: stock-freshness-repair-20260808
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch verified 2026-08-07 stock data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          NOW = "2026-08-08T20:04:00+09:00"
          DATE = "2026-08-07"
          root = Path('.')
          stocks_path = root / 'data/stocks.json'
          data = json.loads(stocks_path.read_text(encoding='utf-8'))

          def row_map(rows):
              return {str(r[0]): r for r in rows if isinstance(r, list) and r}

          def replace_rows(section, updates, unavailable=()):
              rows = section.get('rows') or []
              mapped = row_map(rows)
              for label, value in updates.items():
                  mapped[label] = value
              for label in unavailable:
                  mapped[label] = [label, '取得不能（2026-08-07の確定値を照合できず）', '—', f'取得不能（最新確定値未取得）。基準日 {DATE}。']
              order = [r[0] for r in rows if isinstance(r, list) and r]
              for label in list(updates) + list(unavailable):
                  if label not in order:
                      order.append(label)
              section['rows'] = [mapped[label] for label in order if label in mapped]
              section['dataDate'] = DATE
              section['updatedAt'] = NOW

          us = data.setdefault('marketInternals', {}).setdefault('us', {})
          replace_rows(us, {
              'Dow（NYダウ）': ['Dow（NYダウ）', '54,036.93', '+151.83（+0.28%）', f'終値一覧の確定値。基準日 {DATE}。'],
              'S&P500': ['S&P500', '7,757.64', '+47.68（+0.62%）', f'終値一覧の確定値。基準日 {DATE}。'],
              'Nasdaq（総合）': ['Nasdaq（総合）', '26,690.62', '+342.26（+1.30%）', f'終値一覧の確定値。基準日 {DATE}。'],
              'Russell2000（小型株）': ['Russell2000（小型株）', '3,034.49', '+32.95（+1.10%）', f'終値一覧の確定値。基準日 {DATE}。'],
              'VIX（恐怖指数）': ['VIX（恐怖指数）', '14.90', '-0.25（-1.65%）', f'終値一覧の確定値。基準日 {DATE}。'],
              'NYSE 値上がり / 値下がり': ['NYSE 値上がり / 値下がり', '1,295 / 786', '—', f'TradingView America Stock Screener検証値。基準日 {DATE}。'],
              'NASDAQ 値上がり / 値下がり': ['NASDAQ 値上がり / 値下がり', '1,961 / 1,217', '—', f'TradingView America Stock Screener検証値。基準日 {DATE}。'],
              '52週高値 / 安値': ['52週高値 / 安値', '0 / 0', '—', f'NYSE・NASDAQ保存値。基準日 {DATE}。'],
              'NYSE 52週高値 / 安値': ['NYSE 52週高値 / 安値', '0 / 0', '—', f'保存済み検証値。基準日 {DATE}。'],
              'NASDAQ 52週高値 / 安値': ['NASDAQ 52週高値 / 安値', '0 / 0', '—', f'保存済み検証値。基準日 {DATE}。'],
          }, unavailable=(
              'SOX（半導体指数）',
              'NYSE 200日線上 / 下',
              'NASDAQ 200日線上 / 下',
              'Equal-Weight比較',
          ))

          jp = data.setdefault('marketInternals', {}).setdefault('japan', {})
          replace_rows(jp, {
              '日経225': ['日経225', '65,606.71', '-76.55（-0.12%）', f'終値一覧の確定値。基準日 {DATE}。'],
              '日経VI': ['日経VI', '29.88', '+0.10（+0.34%）', f'終値一覧の確定値。基準日 {DATE}。'],
              '値上がり銘柄 / 値下がり銘柄': ['値上がり銘柄 / 値下がり銘柄', '939 / 582', '—', f'東証プライム確定値。基準日 {DATE}。'],
              '東証プライム売買代金': ['東証プライム売買代金', '10.89 兆円', '—', f'終値一覧の確定値。基準日 {DATE}。'],
              '騰落レシオ（25日）': ['騰落レシオ（25日）', '117.10%', '—', f'終値一覧の確定値。基準日 {DATE}。'],
              '日経225予想PER': ['日経225予想PER', '17.32倍', '—', f'終値一覧の検証済み値。基準日 {DATE}。'],
              '日経225予想EPS': ['日経225予想EPS', '3,787.92円', '—', f'終値一覧の検証済み値。基準日 {DATE}。'],
              '日経225 25日乖離率': ['日経225 25日乖離率', '-0.55%', '—', f'終値一覧の検証済み値。基準日 {DATE}。'],
              '日経225 200日乖離率': ['日経225 200日乖離率', '+14.30%', '—', f'終値一覧の検証済み値。基準日 {DATE}。'],
          }, unavailable=(
              'TOPIX',
              'グロース250',
              '海外投資家動向（現物）',
          ))

          data['updatedAt'] = NOW
          data['dataAsOf'] = '2026-08-07T16:00:00-04:00'
          data['sourceStatus'] = '2026-08-07検証済み終値へ同期。未取得項目は旧値を流用せず取得不能表示。'
          data.setdefault('marketDates', {})['us'] = DATE
          data.setdefault('marketDates', {})['japan'] = DATE
          data.setdefault('marketUpdatedAt', {})['us'] = NOW
          data.setdefault('marketUpdatedAt', {})['japan'] = NOW
          data['nikkeiMetricsAsOf'] = DATE

          # Cards with no verified current basis must not inherit the page date as if current.
          for key in ('us', 'japan'):
              movers = data.setdefault('movers', {}).setdefault(key, {})
              movers['dataDate'] = 'unknown'
              movers['updatedAt'] = 'unknown'
          us_contrib = data.setdefault('contributions', {}).setdefault('us', {})
          us_contrib['dataDate'] = 'unknown'
          us_contrib['updatedAt'] = 'unknown'
          jp_contrib = data.setdefault('contributions', {}).setdefault('japan', {})
          jp_contrib['asOf'] = DATE
          jp_contrib['updatedAt'] = '2026-08-08T05:48:57+09:00'

          stocks_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Keep the current saved snapshot consistent with the live payload.
          snap = root / 'data/history/stocks/2026-08-08.json'
          if snap.exists():
              snapshot = json.loads(json.dumps(data))
              snapshot['snapshotDate'] = '2026-08-08'
              snapshot['savedAt'] = NOW
              snap.write_text(json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = root / 'data/history/stocks/index.json'
          if index_path.exists():
              idx = json.loads(index_path.read_text(encoding='utf-8'))
              idx['latestDate'] = '2026-08-08'
              idx['updatedAt'] = NOW
              for item in idx.get('dates') or []:
                  if isinstance(item, dict) and item.get('date') == '2026-08-08':
                      item['savedAt'] = NOW
                      item['usDataDate'] = DATE
                      item['japanDataDate'] = DATE
                      item['label'] = f'米国 {DATE} / 東京 {DATE}'
              index_path.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          assert d['marketInternals']['us']['dataDate'] == '2026-08-07'
          assert d['marketInternals']['japan']['dataDate'] == '2026-08-07'
          assert d['marketInternals']['us']['rows'][0][1] == '54,036.93'
          assert d['marketInternals']['japan']['rows'][0][1] == '65,606.71'
          print('freshness validation passed')
          PY

      - name: Commit repaired stock payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/history/stocks/2026-08-08.json data/history/stocks/index.json
          if git diff --cached --quiet; then
            echo "No repair diff."
            exit 0
          fi
          git commit -m "Refresh stock analysis to verified Aug 7 data"
          git pull --rebase
          git push
