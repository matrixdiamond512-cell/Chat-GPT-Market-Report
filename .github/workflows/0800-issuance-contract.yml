name: 08:00 issuance integration contract

on:
  pull_request:
    paths:
      - ".github/workflows/0800-issuance-contract.yml"
      - "scripts/reporting/issuance_pipeline.py"
      - "scripts/reporting/issuance_portal.py"
      - "scripts/reporting/issuance_preflight.py"
      - "scripts/run_0800_issuance.py"
      - "scripts/validate_issuance_report_dom.js"
      - "scripts/reporting/importer_handoff.py"
      - "scripts/sync_reports_from_drive.py"
      - "scripts/sync_latest_report_publication.py"
      - "tests/test_issuance_pipeline.py"
      - "tests/test_issuance_portal.py"
      - "tests/test_issuance_preflight.py"
      - "tests/test_importer_handoff.py"
      - "scripts/persist_report_slot_evidence.py"
      - "scripts/reporting/context.py"
      - "scripts/reporting/snapshot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration modules
        run: python -m py_compile scripts/reporting/issuance_pipeline.py scripts/reporting/issuance_portal.py scripts/reporting/issuance_preflight.py scripts/run_0800_issuance.py scripts/reporting/importer_handoff.py scripts/sync_reports_from_drive.py scripts/sync_latest_report_publication.py tests/test_issuance_pipeline.py tests/test_issuance_portal.py tests/test_importer_handoff.py tests/test_issuance_preflight.py
      - name: Run isolated Docs and portal readback contract tests
        run: |
          python -m unittest discover -s tests -p test_issuance_pipeline.py -v
          python -m unittest discover -s tests -p test_issuance_portal.py -v
          python -m unittest discover -s tests -p test_importer_handoff.py -v
          python -m unittest discover -s tests -p test_issuance_preflight.py -v
