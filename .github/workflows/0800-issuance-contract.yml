name: 08:00 issuance integration contract

on:
  pull_request:
    paths:
      - ".github/workflows/0800-issuance-contract.yml"
      - "scripts/reporting/issuance_pipeline.py"
      - "tests/test_issuance_pipeline.py"
      - "scripts/persist_report_slot_evidence.py"
      - "scripts/reporting/context.py"
      - "scripts/reporting/snapshot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration modules
        run: python -m py_compile scripts/reporting/issuance_pipeline.py tests/test_issuance_pipeline.py
      - name: Run isolated Docs and portal readback contract tests
        run: python -m unittest discover -s tests -p test_issuance_pipeline.py -v
