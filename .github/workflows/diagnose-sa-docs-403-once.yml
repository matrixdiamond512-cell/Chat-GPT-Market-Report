name: Diagnose Google SA 403 and verified Drive export fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-sa-docs-403-once.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q google-auth requests
      - name: Read-only scoped Google API diagnostics (no credentials or document text logged)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os,json,re
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info=json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          c=service_account.Credentials.from_service_account_info(info,scopes=[
             "https://www.googleapis.com/auth/drive.readonly",
             "https://www.googleapis.com/auth/documents.readonly"])
          session=AuthorizedSession(c)
          doc="1lWs4U-tg4T-8ZEN86JU6OxcUqx9uAJkJRZv_b952ojs"
          sheet="1n2ACInX4pmK0TdijC8xaur2RIiNZyVa6GFTZAyofcuE"
          tests=[
             ("known_shared_sheet_drive_get",f"https://www.googleapis.com/drive/v3/files/{sheet}",{"fields":"id,mimeType"}),
             ("newly_shared_doc_drive_get",f"https://www.googleapis.com/drive/v3/files/{doc}",{"fields":"id,mimeType"}),
             ("newly_shared_doc_drive_export",f"https://www.googleapis.com/drive/v3/files/{doc}/export",{"mimeType":"text/plain"}),
             ("newly_shared_doc_docs_get",f"https://docs.googleapis.com/v1/documents/{doc}",{"fields":"documentId,title,body(content)"})
          ]
          for label,url,params in tests:
             try:
                resp=session.get(url,params=params,timeout=25)
                result={"test":label,"http":resp.status_code,"content_bytes":len(resp.content) if resp.ok else 0}
                if not resp.ok:
                   try:
                       err=resp.json().get("error",{})
                       result["code"]=err.get("code")
                       result["status"]=err.get("status")
                       result["reasons"]=[x.get("reason","") for x in err.get("errors",[])]
                       msg=err.get("message","")
                       result["message_redacted"]=re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "[redacted-email]",re.sub(r"gen-lang-client-\\d+","[redacted-project]",msg))[:360]
                       result["detail_reasons"]=[x.get("reason") for z in err.get("details",[]) for x in z.get("metadata",{}).get("reason",[]) if isinstance(x,dict)]
                   except Exception as exc:
                       result["parse_error_type"]=type(exc).__name__
                elif label=="newly_shared_doc_drive_export":
                   text=resp.text
                   result["has_report_title"]=("マーケットレポート" in text)
                   result["length_at_least_1000"]=len(text)>=1000
                print("GOOGLE_SA_DIAGNOSTIC "+json.dumps(result,ensure_ascii=False))
             except Exception as exc:
                print("GOOGLE_SA_DIAGNOSTIC "+json.dumps({"test":label,"exception_type":type(exc).__name__}))
          session.close()
          PY
      - name: Attempt authorized enablement of Google Drive and Docs API in service-account project
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json,os,re,time
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info=json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          c=service_account.Credentials.from_service_account_info(info,scopes=["https://www.googleapis.com/auth/cloud-platform"])
          sess=AuthorizedSession(c)
          project="635337987398"
          url=f"https://serviceusage.googleapis.com/v1/projects/{project}/services:batchEnable"
          try:
              res=sess.post(url,json={"serviceIds":["drive.googleapis.com","docs.googleapis.com"]},timeout=25)
              print("GOOGLE_API_ENABLE_HTTP",res.status_code)
              if res.ok:
                  op=res.json()
                  op_name=op.get("name","")
                  print("GOOGLE_API_ENABLE_SUBMITTED",bool(op_name))
                  for i in range(12):
                      r=sess.get("https://serviceusage.googleapis.com/v1/"+op_name,timeout=20)
                      if not r.ok:
                          print("GOOGLE_API_ENABLE_OPERATION_HTTP",r.status_code);break
                      o=r.json()
                      if o.get("done"):
                          print("GOOGLE_API_ENABLE_DONE",json.dumps({"success":"error" not in o,
                                       "error_status":o.get("error",{}).get("status","")}))
                          break
                      time.sleep(3)
              else:
                  err=res.json().get("error",{})
                  message=err.get("message","")
                  reasons=[x.get("reason") for x in err.get("errors",[])]
                  codes=[d.get("@type","").rsplit("/",1)[-1] for d in err.get("details",[])]
                  print("GOOGLE_API_ENABLE_DENIED",json.dumps({"status":err.get("status",""),
                       "reasons":reasons,"types":codes,
                       "serviceusage_disabled":"Service Usage API has not been used" in message,
                       "missing_enable_permission":"serviceusage.services.enable" in message}))
          except Exception as e:
              print("GOOGLE_API_ENABLE_EXCEPTION_TYPE",type(e).__name__)
          finally:
              sess.close()
          PY
