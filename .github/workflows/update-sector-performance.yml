name: Update sector performance

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * 0-4" # 06:20 JST, Monday-Friday
    - cron: "20 7 * * 1-5"  # 16:20 JST, Monday-Friday
  push:
    branches: [main]
    paths:
      - "scripts/fetch_sector_performance.py"
      - "assets/js/stock-sector-decliners.js"
      - "stocks.html"
      - ".github/workflows/update-sector-performance.yml"

permissions:
  contents: write

concurrency:
  group: update-sector-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public-source dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Fetch sectors from public sources
        run: python scripts/fetch_sector_performance.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/sector-performance.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          stocks = json.loads(Path("data/stocks.json").read_text(encoding="utf-8"))
          markets = payload.get("markets") or {}
          if not {"us", "japan"}.issubset(markets):
              raise SystemExit("sector-performance.json is missing a market section")
          incomplete = []
          for key in ("us", "japan"):
              section = markets[key]
              gainers = section.get("gainers") or []
              losers = section.get("losers") or []
              expected = str((stocks.get("marketDates") or {}).get(key) or "")[:10]
              actual = str(section.get("dataDate") or section.get("asOf") or "")[:10]
              if section.get("status") == "unavailable":
                  if gainers or losers:
                      incomplete.append(key + "(unavailable-with-rows)")
                  continue
              # A component may legitimately publish a newer session than the
              # aggregate stocks.json writer. Reject only missing or older data;
              # never block a fresh Japan update because the US source is still
              # on the previous completed session.
              if section.get("status") not in {"verified", "ok"} or section.get("freshness") != "fresh" or not actual or (expected and actual < expected) or len(gainers) < 5 or len(losers) < 5:
                  incomplete.append(key)
          if incomplete:
              raise SystemExit("Incomplete sector data: " + ", ".join(incomplete))
          print("Validated sector data; unavailable markets contain no current rows")
          PY
      - name: Commit updated sector data
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update sector performance data" data/sector-performance.json data/market/sector-performance.json
