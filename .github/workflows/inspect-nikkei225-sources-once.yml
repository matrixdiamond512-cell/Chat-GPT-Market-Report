name: Inspect Nikkei 225 JPX sources once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-nikkei225-sources-once.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-nikkei225-supply-demand.txt
      - name: Inspect current public JPX source layouts
        run: python scripts/inspect_nikkei225_sources.py
      - run: python -m json.tool data/nikkei225-source-inspection.json > /dev/null
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225-source-inspection.json
          git commit -m "Inspect Nikkei 225 JPX source layouts" || exit 0
          git pull --rebase origin main
          git push origin main
