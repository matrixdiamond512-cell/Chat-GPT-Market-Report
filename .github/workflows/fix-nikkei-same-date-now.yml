name: Fix Nikkei same-date analysis now
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-nikkei-same-date-now.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-nikkei225-supply-demand.txt
      - run: python scripts/enrich_nikkei225_same_date.py
      - run: python -m json.tool data/nikkei225-supply-demand.json > /dev/null
      - name: Commit data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nikkei225-supply-demand.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align Nikkei participant analysis to same date"
          git pull --rebase origin main
          git push origin main
