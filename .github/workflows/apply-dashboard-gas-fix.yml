name: Apply dashboard GAS root fix

on:
  push:
    branches: [main]
    paths:
      - tools/patch_dashboard_gas.py
      - .github/workflows/apply-dashboard-gas-fix.yml

permissions:
  contents: write

jobs:
  patch-dashboard-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python tools/patch_dashboard_gas.py

      - name: Commit patched GAS
        shell: bash
        run: |
          if git diff --quiet -- apps-script/DashboardJsonSync.gs; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/DashboardJsonSync.gs
          git commit -m "Fix dashboard GAS latest-row and date validation"
          git push
