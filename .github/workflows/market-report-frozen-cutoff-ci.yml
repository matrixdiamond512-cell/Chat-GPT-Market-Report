name: Market report frozen-cutoff regression
on:
  push:
    paths:
      - config/report_schedule.json
      - Dockerfile
      - .dockerignore
      - requirements-p1-cloudrun.txt
      - tests/test_report_continuity_ingress.py
      - scripts/report_continuity_shadow.py
      - scripts/report_continuity_gcs.py
      - scripts/report_continuity_ingress.py
      - scripts/run_report_continuity_service.py
      - docs/p1-cloud-trial-plan.md
      - docs/p1-cloud-trial-config.json
      - tests/test_report_continuity_gcs.py
      - requirements-p1-gcs-test.txt
      - scripts/resolve_market_report_slot.py
      - scripts/test_resolve_market_report_slot.py
      - tests/test_report_continuity_shadow.py
      - tests/test_market_data_window_evidence.py
      - tests/test_policy_expectations.py
      - tests/test_publication_eligibility.py
      - tests/test_publication_evidence.py
      - tests/test_historical_saturday_slots.py
      - assets/js/report-publication-policy.js
      - tests/test_report_publication_policy.js
      - scripts/run_market_data_window.py
      - scripts/run_market_data_acquisition.py
      - scripts/persist_report_slot_evidence.py
      - scripts/test_run_market_data_window.py
      - scripts/test_market_acquisition_cutoff.py
      - tests/test_report_slot_evidence.py
      - docs/project-control/OBJECTIVE_CARD.md
      - docs/project-control/EVIDENCE_LEDGER.md
      - .github/workflows/market-report-frozen-cutoff-ci.yml
      - .github/workflows/freeze-report-slot-evidence.yml
  pull_request:
    paths:
      - config/report_schedule.json
      - Dockerfile
      - .dockerignore
      - requirements-p1-cloudrun.txt
      - tests/test_report_continuity_ingress.py
      - scripts/report_continuity_shadow.py
      - scripts/report_continuity_gcs.py
      - scripts/report_continuity_ingress.py
      - scripts/run_report_continuity_service.py
      - docs/p1-cloud-trial-plan.md
      - docs/p1-cloud-trial-config.json
      - tests/test_report_continuity_gcs.py
      - requirements-p1-gcs-test.txt
      - scripts/resolve_market_report_slot.py
      - scripts/test_resolve_market_report_slot.py
      - tests/test_report_continuity_shadow.py
      - tests/test_market_data_window_evidence.py
      - tests/test_policy_expectations.py
      - tests/test_publication_eligibility.py
      - tests/test_publication_evidence.py
      - tests/test_historical_saturday_slots.py
      - assets/js/report-publication-policy.js
      - tests/test_report_publication_policy.js
      - scripts/run_market_data_window.py
      - scripts/run_market_data_acquisition.py
      - scripts/persist_report_slot_evidence.py
      - scripts/test_run_market_data_window.py
      - scripts/test_market_acquisition_cutoff.py
      - tests/test_report_slot_evidence.py
      - docs/project-control/OBJECTIVE_CARD.md
      - docs/project-control/EVIDENCE_LEDGER.md
      - .github/workflows/market-report-frozen-cutoff-ci.yml
      - .github/workflows/freeze-report-slot-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forbid-late-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GCS SDK compatibility dependency
        run: python -m pip install --disable-pip-version-check -r requirements-p1-gcs-test.txt
      - name: Compile acquisition and snapshot evidence scripts
        run: python -m compileall -q scripts/run_market_data_window.py scripts/run_market_data_acquisition.py scripts/persist_report_slot_evidence.py scripts/report_continuity_gcs.py scripts/report_continuity_ingress.py scripts/run_report_continuity_service.py scripts/p1_trial_fixture_provider.py
      - name: Validate preparation-only Cloud config JSON
        run: python -m json.tool docs/p1-cloud-trial-config.json > /dev/null
      - name: Build Cloud Run container image
        run: docker build --tag p1-cloudrun-smoke:ci .
      - name: Smoke test Cloud Run container startup and PORT binding
        run: |
          docker run --detach --name p1-cloudrun-smoke --publish 8080:8080 --env PORT=8080 --env P1_OIDC_AUDIENCE=https://p1-shadow-test.run.app --env 'P1_SCHEDULER_BINDINGS_JSON=[{"job_name":"projects/test-project/locations/asia-northeast1/jobs/slot-0800-t13","service_account_email":"p1-scheduler-0800-t13@test-project.iam.gserviceaccount.com","attempt_minutes":13,"target_slot":"08:00"}]' p1-cloudrun-smoke:ci
          trap 'docker rm --force p1-cloudrun-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  urlopen(Request("http://127.0.0.1:8080/", method="GET"), timeout=2)
              except HTTPError as error:
                  if error.code == 405:
                      print("container started; WSGI app returned expected 405 for GET")
                      break
                  raise
              except (URLError, ConnectionResetError, TimeoutError):
                  time.sleep(1)
              else:
                  raise AssertionError("GET unexpectedly accepted")
          else:
              raise AssertionError("container did not become ready")
          PY
      - name: Run strictly offline cutoff and immutable-evidence regression suites
        run: python -m unittest scripts.test_run_market_data_window scripts.test_market_acquisition_cutoff tests.test_report_slot_evidence -v
      - name: Run offline report continuity and publication policy tests
        run: python -m unittest tests.test_report_continuity_shadow tests.test_report_continuity_gcs tests.test_report_continuity_ingress tests.test_market_data_window_evidence tests.test_report_slot_evidence tests.test_policy_expectations tests.test_publication_eligibility tests.test_publication_evidence scripts.test_resolve_market_report_slot scripts.test_market_acquisition_cutoff tests.test_historical_saturday_slots -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged publication eligibility policy
        run: node tests/test_report_publication_policy.js
