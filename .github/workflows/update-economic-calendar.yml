name: Update economic calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-economic-calendar.yml"
      - "scripts/fetch_economic_calendar.py"
      - "config/economic_calendar.json"
      - "data/events/event_dictionary.json"
  schedule:
    # UTC. Japan time: 00:30, 06:00, 12:00, 18:00, 22:30.
    - cron: "30 15 * * *"
    - cron: "0 21 * * *"
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: update-economic-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, normalize, and retain event results
        run: python scripts/fetch_economic_calendar.py --print-summary

      - name: Run calendar tests
        run: python -m unittest scripts.test_fetch_economic_calendar -v

      - name: Validate public JSON
        run: |
          python -m json.tool data/events/latest.json > /dev/null
          python -m json.tool data/events/upcoming.json > /dev/null
          python -m json.tool data/events/completed.json > /dev/null
          python -m json.tool data/events.json > /dev/null
          python -m json.tool economic-calendar.json > /dev/null

      - name: Commit normalized calendar only
        shell: bash
        run: |
          if git diff --quiet -- data/events data/events.json economic-calendar.json; then
            echo "Economic calendar is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events data/events.json economic-calendar.json
          git commit -m "Update economic calendar"
          git pull --rebase
          git push
