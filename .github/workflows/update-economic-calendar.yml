name: Update economic calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-economic-calendar.yml"
      - "scripts/fetch_economic_calendar.py"
      - "scripts/postprocess_economic_calendar.py"
      - "scripts/repair_missing_event_results.py"
      - "scripts/validate_weekly_claims_result.py"
      - "scripts/clean_legacy_event_records.py"
      - "scripts/test_fetch_economic_calendar.py"
      - "scripts/test_postprocess_economic_calendar.py"
      - "scripts/test_repair_missing_event_results.py"
      - "scripts/test_validate_weekly_claims_result.py"
      - "scripts/test_clean_legacy_event_records.py"
      - "config/economic_calendar.json"
      - "data/events/event_dictionary.json"
  schedule:
    # UTC/JSTとも毎時07分・37分。重要指標の発表後を長時間空けない。
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-economic-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Fetch, normalize, and retain event results
        run: python scripts/fetch_economic_calendar.py --print-summary

      - name: Remove legacy market-report event rows
        run: python -m scripts.clean_legacy_event_records --print-summary

      - name: Normalize qualitative events
        run: python scripts/postprocess_economic_calendar.py --no-official-fetch --print-summary

      - name: Repair missing numeric results
        run: python -m scripts.repair_missing_event_results --print-summary

      - name: Validate weekly unemployment claims
        run: python -m scripts.validate_weekly_claims_result --print-summary

      - name: Run calendar tests
        run: |
          python -m unittest scripts.test_fetch_economic_calendar -v
          python -m unittest scripts.test_clean_legacy_event_records -v
          python -m unittest scripts.test_postprocess_economic_calendar -v
          python -m unittest scripts.test_repair_missing_event_results -v
          python -m unittest scripts.test_validate_weekly_claims_result -v

      - name: Validate public JSON
        run: |
          python -m json.tool data/events/latest.json > /dev/null
          python -m json.tool data/events/upcoming.json > /dev/null
          python -m json.tool data/events/completed.json > /dev/null
          python -m json.tool data/events.json > /dev/null
          python -m json.tool economic-calendar.json > /dev/null

      - name: Commit normalized calendar only
        shell: bash
        run: |
          if git diff --quiet -- data/events data/events.json economic-calendar.json; then
            echo "Economic calendar is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events data/events.json economic-calendar.json
          git commit -m "Update economic calendar"
          git pull --rebase
          git push
