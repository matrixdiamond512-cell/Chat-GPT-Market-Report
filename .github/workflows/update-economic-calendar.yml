name: Update economic calendar

on:
  schedule:
    - cron: "30 3,7,12,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-economic-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update calendar JSON
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: python scripts/update_economic_calendar.py

      - name: Commit changed calendar
        run: |
          if git diff --quiet -- economic-calendar.json; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economic-calendar.json
          git commit -m "Update economic calendar"
          git push
