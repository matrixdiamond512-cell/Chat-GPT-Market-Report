name: Build report index

on:
  push:
    branches:
      - main
    paths:
      - "reports/*.json"
      - "reports.json"
      - "scripts/build_reports.py"
      - "scripts/structure_reports.py"
      - "scripts/complete_report_schema.py"
      - "scripts/persist_report_index_to_canonical.py"
      - "scripts/validate_market_reports.py"
      - ".github/workflows/build-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve history and build reports.json
        run: python scripts/build_reports.py

      - name: Fill dashboard fields from full report text
        run: python scripts/structure_reports.py reports.json

      - name: Complete required schema transparently
        run: python scripts/complete_report_schema.py reports.json

      - name: Validate structured report index
        run: |
          python -m json.tool reports.json > /dev/null
          python scripts/validate_market_reports.py --file reports.json

      - name: Persist validated structured reports to canonical files
        run: python scripts/persist_report_index_to_canonical.py

      - name: Rebuild and verify canonical index
        run: |
          python scripts/build_reports.py
          python -m json.tool reports.json > /dev/null
          python scripts/validate_market_reports.py --file reports.json

      - name: Commit canonical reports and generated index
        run: |
          if git diff --quiet -- reports reports.json; then
            echo "Report history, canonical files, and reports.json are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports reports.json
          git commit -m "Auto-build canonical report history and index"
          git pull --rebase origin main
          git push
