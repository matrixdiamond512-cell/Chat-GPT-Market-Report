name: Validate report publication

on:
  push:
    branches:
      - main
    paths:
      - "publication-receipts/*.json"
      - "reports/*.json"
      - "reports.json"
      - "data/dashboard.json"
      - "scripts/build_reports.py"
      - "scripts/verify_publication_consistency.py"
      - "scripts/validate_drive_publication_receipt.py"
      - "config/report_schedule.json"
      - ".github/workflows/build-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-report-publication
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          python -m json.tool data/latest-report.json > /dev/null
          python -m json.tool reports.json > /dev/null
          python -m json.tool data/dashboard.json > /dev/null

      - name: Verify canonical/index/latest/dashboard consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest_payload = json.loads(Path('data/latest-report.json').read_text(encoding='utf-8'))
          latest = latest_payload.get('latestReport', latest_payload)
          index = json.loads(Path('reports.json').read_text(encoding='utf-8'))
          dashboard = json.loads(Path('data/dashboard.json').read_text(encoding='utf-8'))

          key = (latest.get('date'), latest.get('time'))
          if not all(key):
              raise SystemExit('latest report missing date/time')

          canonical_path = Path('reports') / f"{key[0]}_{key[1].replace(':', '-')}.json"
          if not canonical_path.exists():
              raise SystemExit(f'canonical history file missing: {canonical_path}')

          canonical = json.loads(canonical_path.read_text(encoding='utf-8'))
          if canonical != latest:
              raise SystemExit(f'canonical history does not match latest report: {canonical_path}')

          matches = [r for r in index if (r.get('date'), r.get('time')) == key]
          if len(matches) != 1 or matches[0] != latest:
              raise SystemExit('reports.json does not contain exactly one matching latest report')

          dashboard_latest = dashboard.get('latestReport')
          if dashboard_latest != latest:
              raise SystemExit('dashboard.latestReport does not match latest report')

          expected_key = f"{key[0]} {key[1]}"
          if dashboard.get('currentReportKey') != expected_key:
              raise SystemExit(
                  f"dashboard currentReportKey mismatch: "
                  f"{dashboard.get('currentReportKey')!r} != {expected_key!r}"
              )

          print(f'Publication consistency PASS: {expected_key}')
          PY

      - name: Verify builder would not rewrite publication history
        run: |
          cp reports.json /tmp/reports.before.json
          cp data/latest-report.json /tmp/latest.before.json
          python scripts/build_reports.py
          if ! cmp -s reports.json /tmp/reports.before.json; then
            echo "ERROR: build_reports.py would rewrite reports.json; publication is not stable."
            git diff -- reports.json || true
            exit 1
          fi
          if ! cmp -s data/latest-report.json /tmp/latest.before.json; then
            echo "ERROR: build_reports.py rewrote data/latest-report.json."
            git diff -- data/latest-report.json || true
            exit 1
          fi
          if ! git diff --quiet -- reports; then
            echo "ERROR: build_reports.py would rewrite canonical report files."
            git status --short -- reports
            exit 1
          fi

      - name: Verify publication consistency script
        run: python scripts/verify_publication_consistency.py

      - name: Confirm validator made no publication changes
        run: |
          if ! git diff --quiet -- reports reports.json data/latest-report.json data/dashboard.json; then
            echo "ERROR: validation changed publication files."
            git status --short -- reports reports.json data/latest-report.json data/dashboard.json
            exit 1
          fi
          echo "Read-only publication validation PASS."
