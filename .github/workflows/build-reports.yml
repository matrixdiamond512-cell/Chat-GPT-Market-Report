name: Build report index

# Rebuild marker: 2026-08-18 report index refresh
on:
  push:
    branches:
      - main
    paths:
      - "reports/*.json"
      - "reports.json"
      - "scripts/build_reports.py"
      - ".github/workflows/build-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve history and build reports.json
        run: python scripts/build_reports.py

      - name: Validate generated JSON
        run: python -m json.tool reports.json > /dev/null

      - name: Commit canonical backfills and generated index
        run: |
          if git diff --quiet -- reports reports.json; then
            echo "Canonical report history and reports.json are already consistent."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports reports.json
          git commit -m "Auto-build canonical report history and index"
          git pull --rebase origin main
          git push
