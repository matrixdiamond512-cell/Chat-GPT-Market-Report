name: Build report index

on:
  push:
    branches:
      - main
    paths:
      - "reports/*.json"
      - "scripts/build_reports.py"
      - ".github/workflows/build-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build reports.json
        run: python scripts/build_reports.py

      - name: Commit generated index
        run: |
          if git diff --quiet -- reports.json; then
            echo "reports.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json
          git commit -m "Auto-build reports index"
          git push
