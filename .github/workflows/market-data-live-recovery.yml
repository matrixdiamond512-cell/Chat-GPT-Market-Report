name: Recover current market snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-data-live-recovery.yml'
  schedule:
    # Backup starts in JST: weekdays 06:12, 11:12, 15:12, 20:12.
    # Choose the actual JST slot at runner start: GitHub schedules can be hours late.
    - cron: '12 21 * * 0-4'
    - cron: '12 2 * * 1-5'
    - cron: '12 6 * * 1-5'
    - cron: '12 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-live-recovery
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data fetch dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt
      - name: Acquire and publish actual-time data (never relabel an old snapshot)
        shell: bash
        env:
          ACQUISITION_TRIGGER_SOURCE: live_recovery
        run: |
          set -euo pipefail
          NOW="$(TZ=Asia/Tokyo date +%H:%M)"
          HOUR="$(TZ=Asia/Tokyo date +%H)"
          WEEKDAY="$(TZ=Asia/Tokyo date +%u)"
          if (( 10#$WEEKDAY > 5 )); then echo 'Weekend: no weekday report snapshot'; exit 0; fi
          if (( 10#$HOUR >= 6 && 10#$HOUR < 11 )); then SLOT='08:00';
          elif (( 10#$HOUR >= 11 && 10#$HOUR < 15 )); then SLOT='12:00';
          elif (( 10#$HOUR >= 15 && 10#$HOUR < 20 )); then SLOT='16:00';
          elif (( 10#$HOUR >= 20 && 10#$HOUR <= 23 )); then SLOT='21:00';
          else echo 'Outside acquisition hours: do not mislabel overnight data'; exit 0; fi
          echo "Recovery acquisition: actual JST ${NOW}; report slot ${SLOT}"
          python scripts/run_market_data_window.py \
            --slot "${SLOT}" \
            --times "${NOW}" \
            --trigger-source live_recovery \
            --max-catchup-minutes 5 \
            --mode full \
            --recover-expired
          python - <<'PY'
          import datetime as dt,json,pathlib
          p=json.loads(pathlib.Path('data/market/latest.json').read_text(encoding='utf-8'))
          current=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          assert str(p.get('generatedAt','')).startswith(current), 'Snapshot timestamp is not today'
          assert p.get('overallStatus') in ('verified','degraded'), 'Current snapshot has required-data gaps'
          print('PASS: current-date snapshot with verified/degraded status and real acquisition')
          PY
