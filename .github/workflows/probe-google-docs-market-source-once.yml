name: Probe existing service account access to actual market Docs
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-google-docs-market-source-once.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Verify authenticated read-only Docs API access to saved source
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json,os,hashlib
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          raw=os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON","")
          if not raw:
              raise SystemExit("BLOCKED: GOOGLE_SERVICE_ACCOUNT_JSON_NOT_CONFIGURED")
          info=json.loads(raw)
          if info.get("type")!="service_account":
              raise SystemExit("BLOCKED: NOT_SERVICE_ACCOUNT")
          expected_sha="0a462906ac74c2847a4f74e4b3a04e906b34b9eed2b7c8eab408ef9cb5b17c2e"
          if hashlib.sha256(info.get("client_email","").encode()).hexdigest()!=expected_sha:
              raise SystemExit("BLOCKED: SERVICE_ACCOUNT_IDENTITY_DIFFERENT_FROM_EXISTING_SHEET_READER")
          print("SERVICE_ACCOUNT_IDENTITY_MATCHES_EXISTING_SHEET_READER")
          creds=service_account.Credentials.from_service_account_info(info,scopes=[
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/documents.readonly"])
          session=AuthorizedSession(creds)
          document_id="1lWs4U-tg4T-8ZEN86JU6OxcUqx9uAJkJRZv_b952ojs"
          try:
              meta=session.get("https://www.googleapis.com/drive/v3/files/"+document_id,
                  params={"fields":"id,name,mimeType,trashed"},timeout=20)
              if meta.status_code!=200:
                  raise SystemExit("BLOCKED: SOURCE_DOC_NOT_ACCESSIBLE_HTTP_"+str(meta.status_code))
              result=meta.json()
              if result.get("mimeType")!="application/vnd.google-apps.document":
                  raise SystemExit("BLOCKED: NOT_NATIVE_GOOGLE_DOC")
              doc=session.get("https://docs.googleapis.com/v1/documents/"+document_id,
                  params={"fields":"documentId,title,body(content)"},timeout=30)
              if doc.status_code!=200:
                  raise SystemExit("BLOCKED: GOOGLE_DOCS_API_HTTP_"+str(doc.status_code))
              data=doc.json()
              elements=data.get("body",{}).get("content",[])
              chars=sum(len(e.get("textRun",{}).get("content","")) for p in elements
                        for e in p.get("paragraph",{}).get("elements",[]))
              if chars<1200:
                  raise SystemExit("BLOCKED: SOURCE_DOC_READ_TOO_SHORT")
              print(json.dumps({"sourceDocRead":"SUCCESS","characters":chars,
                               "serviceAccountPresent":True,"readOnly":True}))
          finally:
              session.close()
          PY
