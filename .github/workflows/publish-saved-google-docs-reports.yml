name: Publish saved Google Docs market reports
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_reports_from_drive.py"
      - "scripts/sync_latest_report_publication.py"
      - "scripts/report_source_contract.py"
      - ".github/workflows/publish-saved-google-docs-reports.yml"
  workflow_dispatch:
  schedule:
    # 08:15/08:30 quick ingestion, then 08:55/09:25 enforced recovery (JST weekdays)
    - cron: "15,30,55 23 * * 0-4"
    - cron: "25 0 * * 1-5"
    # 12:15/12:30/12:55/13:25, 16:15/16:30/16:55/17:25, 21:15/21:30/21:55/22:25 JST
    - cron: "15,30,55 3 * * 1-5"
    - cron: "25 4 * * 1-5"
    - cron: "15,30,55 7 * * 1-5"
    - cron: "25 8 * * 1-5"
    - cron: "15,30,55 12 * * 1-5"
    - cron: "25 13 * * 1-5"
permissions:
  contents: write
concurrency:
  group: google-docs-real-report-ingestion
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Google authorization client
        run: python -m pip install --disable-pip-version-check -q google-auth requests
      - name: Read actual Google Docs and assess append-only canonical import
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_reports_from_drive.py
      - name: Ingest complete source docs into canonical reports and rebuild history
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scripts/sync_reports_from_drive.py --apply --enforce-slot
          else
            python scripts/sync_reports_from_drive.py --apply
          fi
      - name: Read-back check canonical, latest and public index projections
        run: |
          python scripts/verify_publication_consistency.py
          cp reports.json /tmp/market-report-index-before-idempotency.json
          python scripts/build_reports.py --canonical-only
          cmp /tmp/market-report-index-before-idempotency.json reports.json
          echo "CANONICAL_INDEX_IDEMPOTENT: indexed changes are expected and preserved for commit."
      - name: Persist actual Docs-derived changes to main and request Pages deploy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ reports.json data/latest-report.json data/dashboard.json
          if git diff --cached --quiet; then
            echo "NO_NEW_REPORTS: all reachable Docs already published; no fake publication."
            exit 0
          fi
          git commit -m "Publish verified saved Google Docs report to canonical history"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUSHED_REAL_DOCS_ARCHIVE: GitHub Pages deployment must be verified separately."
