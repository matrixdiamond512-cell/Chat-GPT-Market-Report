name: Read-only production Drive identity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official read-only authorization client
        run: python -m pip install --disable-pip-version-check -q google-auth requests
      - name: Compare identity and read exact November folders without writes
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          expected = 'market-report-sheets-writer@gen-lang-client-0301807832.iam.gserviceaccount.com'
          result = {'mode': 'READ_ONLY', 'secretConfigured': False, 'identityMatch': False, 'folders': {}}
          try:
              raw = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '')
              result['secretConfigured'] = bool(raw)
              config = json.loads(raw)
              result['identityMatch'] = hmac.compare_digest(config.get('client_email', ''), expected)
              if not result['identityMatch']:
                  print(json.dumps(result, sort_keys=True))
                  sys.exit(2)
              creds = service_account.Credentials.from_service_account_info(config, scopes=[
                  'https://www.googleapis.com/auth/drive.readonly',
                  'https://www.googleapis.com/auth/documents.readonly',
              ])
              with AuthorizedSession(creds) as session:
                  for label, folder in [('body', '1vnZ7JgQTbqVSvoTIaY-1GlEroSzNLXkP'), ('png', '1h7ft4COBO2jcWVBMFeAKLr1Fq9sdBj58')]:
                      response = session.get('https://www.googleapis.com/drive/v3/files/' + folder, params={'fields': 'id,mimeType,capabilities(canListChildren,canAddChildren)'}, timeout=30)
                      item = {'httpStatus': response.status_code, 'accessible': False}
                      if response.ok:
                          data = response.json()
                          item['accessible'] = data.get('id') == folder and data.get('mimeType') == 'application/vnd.google-apps.folder'
                          item['capabilities'] = data.get('capabilities', {})
                          listing = session.get('https://www.googleapis.com/drive/v3/files', params={'q': "'" + folder + "' in parents and trashed = false", 'fields': 'nextPageToken,files(id,mimeType,parents)', 'pageSize': 100}, timeout=30)
                          item['listHttpStatus'] = listing.status_code
                          if listing.ok:
                              children = listing.json().get('files', [])
                              item['listedCount'] = len(children)
                              item['hasMore'] = bool(listing.json().get('nextPageToken'))
                              docs = [d for d in children if d.get('mimeType') == 'application/vnd.google-apps.document']
                              item['docsReadback'] = []
                              for doc in docs[:3]:
                                  read = session.get('https://docs.googleapis.com/v1/documents/' + doc['id'], params={'fields': 'documentId,revisionId,body'}, timeout=30)
                                  check = {'httpStatus': read.status_code}
                                  if read.ok:
                                      body = read.json()
                                      check['identityMatch'] = body.get('documentId') == doc['id']
                                      check['revisionPresent'] = bool(body.get('revisionId'))
                                      check['bodyPresent'] = bool(body.get('body', {}).get('content'))
                                  item['docsReadback'].append(check)
                      result['folders'][label] = item
              print(json.dumps(result, sort_keys=True))
              sys.exit(0 if all(f.get('accessible') and f.get('listHttpStatus') == 200 for f in result['folders'].values()) else 3)
          except Exception as exc:
              result['errorType'] = type(exc).__name__
              print(json.dumps(result, sort_keys=True))
              sys.exit(4)
          PY
