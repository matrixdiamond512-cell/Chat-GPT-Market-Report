name: Publish saved Google Docs market reports
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_reports_from_drive.py"
      - "scripts/sync_latest_report_publication.py"
      - "scripts/report_source_contract.py"
      - "scripts/reporting/publication_evidence.py"
      - "scripts/reporting/context.py"
      - "scripts/reporting/snapshot.py"
      - "scripts/verify_publication_consistency.py"
      - "tests/test_publication_evidence.py"
      - ".github/workflows/publish-saved-google-docs-reports.yml"
  workflow_dispatch:
  schedule:
    # 08:15/08:30 quick ingestion, then 08:55/09:25 enforced recovery (JST weekdays)
    - cron: "15,30,55 23 * * 0-4"
    - cron: "25 0 * * 1-5"
    # 12:15/12:30/12:55/13:25, 16:15/16:30/16:55/17:25, 21:15/21:30/21:55/22:25 JST
    - cron: "15,30,55 3 * * 1-5"
    - cron: "25 4 * * 1-5"
    - cron: "15,30,55 7 * * 1-5"
    - cron: "25 8 * * 1-5"
    - cron: "15,30,55 12 * * 1-5"
    - cron: "25 13 * * 1-5"
permissions:
  contents: write
  actions: write
concurrency:
  group: google-docs-real-report-ingestion
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Google authorization client
        run: python -m pip install --disable-pip-version-check -q google-auth requests
      - name: Test fail-closed pre-draft evidence and readback receipt contract
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.test_publication_evidence tests.test_report_slot_evidence -v
      - name: Read actual Google Docs and assess append-only canonical import
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_reports_from_drive.py
      - name: Ingest complete source docs into canonical reports and rebuild history
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python scripts/sync_reports_from_drive.py --apply --enforce-slot
          else
            python scripts/sync_reports_from_drive.py --apply
          fi
      - name: Read-back check canonical, latest and public index projections
        run: |
          python scripts/verify_publication_consistency.py
          cp reports.json /tmp/market-report-index-before-idempotency.json
          python scripts/build_reports.py --canonical-only
          cmp /tmp/market-report-index-before-idempotency.json reports.json
          python -m py_compile scripts/reporting/publication_evidence.py scripts/sync_reports_from_drive.py
          echo "CANONICAL_INDEX_IDEMPOTENT: indexed changes are expected and preserved for commit."
      - name: Persist actual Docs-derived changes to main and request Pages deploy
        id: persist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ reports.json data/latest-report.json data/dashboard.json publication-receipts/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NO_CANONICAL_CHANGES: no new report source or evidence-backed promotion was verified; no publication change."
            exit 0
          fi
          git commit -m "Publish verified saved Google Docs report to canonical history"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "PUSHED_VERIFIED_DOCS_REPORTS: eligible Docs with frozen evidence/readback receipts are public; held sources remain archived. Pages dispatch follows."

      - name: Dispatch Pages deployment for the committed archive
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}'
          echo "PAGES_WORKFLOW_DISPATCHED: deployment and public read-back are tracked separately."
