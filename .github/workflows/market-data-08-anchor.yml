name: 08:00 supporting market-data attempts

on:
  workflow_dispatch:
    inputs:
      scheduled_time:
        description: "08:00 supporting acquisition label"
        required: false
        default: "07:50"
        type: choice
        options:
          - "06:30"
          - "07:00"
          - "07:20"
          - "07:30"
          - "07:40"
          - "07:45"
          - "07:50"
  push:
    branches: [main]
    paths:
      - "scripts/run_market_data_acquisition.py"
      - "scripts/run_market_data_window.py"
      - ".github/workflows/market-data-08-anchor.yml"
  schedule:
    - cron: "28 21 * * 0-5" # 06:28 JST -> 06:30 acquisition
    - cron: "58 21 * * 0-5" # 06:58 JST -> 07:00 acquisition
    - cron: "18 22 * * 0-5" # 07:18 JST -> 07:20 acquisition
    - cron: "28 22 * * 0-5" # 07:28 JST -> 07:30 acquisition
    - cron: "38 22 * * 0-5" # 07:38 JST -> 07:40 acquisition
    - cron: "43 22 * * 0-5" # 07:43 JST -> 07:45 acquisition
    - cron: "48 22 * * 0-5" # 07:48 JST -> 07:50 acquisition

permissions:
  contents: write

concurrency:
  group: market-data-08-support-${{ github.event.schedule || inputs.scheduled_time || github.run_id }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py
          python -m py_compile scripts/verify_market_report_readiness.py

      - name: Resolve intended Japan-time attempt
        id: intended
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "28 21 * * 0-5") TIME="06:30" ;;
            "58 21 * * 0-5") TIME="07:00" ;;
            "18 22 * * 0-5") TIME="07:20" ;;
            "28 22 * * 0-5") TIME="07:30" ;;
            "38 22 * * 0-5") TIME="07:40" ;;
            "43 22 * * 0-5") TIME="07:45" ;;
            "48 22 * * 0-5") TIME="07:50" ;;
            *) TIME="${{ inputs.scheduled_time }}" ;;
          esac
          if [ -z "$TIME" ]; then TIME="07:50"; fi
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

      - name: Run one supporting acquisition attempt
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: independent_schedule
        run: |
          python scripts/run_market_data_window.py \
            --slot "08:00" \
            --times "${{ steps.intended.outputs.time }}" \
            --trigger-source "independent_schedule" \
            --max-catchup-minutes 180 \
            --mode auto

      - name: Explain 08:00 data semantics
        run: |
          echo "These supporting acquisitions must not become the 08:00 major-market table."
          echo "The 08:00 report uses date-matched prior-session closes from 終値一覧 and previous-close repair sources."
          echo "Retrieval time and market-data date are separate concepts."
