name: Update Stock Session Analysis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Session to update
        required: true
        default: auto
        type: choice
        options:
          - auto
          - tokyo
          - us
          - both
  schedule:
    # Retry the Tokyo snapshot after the cash open. GitHub cron delivery is
    # not exact, so each retry must be safe and independently publishable.
    - cron: '5,10,15 0 * * 1-5'   # 09:05 / 09:10 / 09:15 JST
    # Capture the U.S. pre-market after the New York pre-market opens.
    - cron: '30,45,55 11 * * 1-5' # 20:30 / 20:45 / 20:55 JST
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stock-sessions.yml'
      - 'scripts/update_stock_sessions.py'
      - 'scripts/update_stock_sessions_topix.py'

permissions:
  contents: write

# Keep only the newest session refresh when GitHub starts several delayed cron
# events together. A newer Tokyo retry is more useful than an old queued one.
concurrency:
  group: update-stock-sessions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve session mode
        id: session
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "5,10,15 0 * * 1-5") MODE="tokyo" ;;
            "30,45,55 11 * * 1-5") MODE="us" ;;
            *) MODE="${{ github.event.inputs.mode || 'auto' }}" ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved stock-session mode: $MODE"

      - name: Update session data with corrected TOPIX source
        shell: bash
        run: |
          MODE="${{ steps.session.outputs.mode }}"
          SUCCESS=0
          for ATTEMPT in 1 2 3; do
            echo "Stock session update attempt $ATTEMPT/3 mode=$MODE"
            if python scripts/update_stock_sessions_topix.py --mode "$MODE"; then
              SUCCESS=1
              break
            fi
            sleep $((ATTEMPT * 30))
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Stock session update failed after 3 attempts"
            exit 1
          fi

      - name: Validate JSON and Python
        run: |
          python -m py_compile scripts/update_stock_sessions.py
          python -m py_compile scripts/update_stock_sessions_topix.py
          python -m json.tool data/stock-sessions.json >/dev/null
          python -m json.tool data/stocks.json >/dev/null
          # A stale independent component must not prevent this session's
          # current/unavailable boundary from being committed. Keep the
          # cross-component check diagnostic-only here.
          python scripts/validate_stock_data_freshness.py --report-only

      - name: Commit updated data
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update stock session analysis" data/stock-sessions.json data/stocks.json


