name: Morning infographic preflight tests
on:
  push:
    branches:
      - codex/0800-infographic-design
  pull_request:
    paths:
      - scripts/preflight_morning_infographic.py
      - tests/test_morning_preflight.py
      - scripts/bind_morning_report_evidence.py
      - scripts/capture_morning_creation_evidence.py
      - scripts/prepare_morning_report_issue.py
      - tests/test_morning_issue_adapter.py
      - scripts/validate_morning_issue_projection.py
      - tests/test_morning_issue_projection.py
      - tests/test_morning_creation_evidence.py
      - scripts/render_morning_infographic.py
      - tests/test_morning_evidence_handoff.py
      - .github/workflows/morning-preflight-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile preflight files
        run: python -m py_compile scripts/preflight_morning_infographic.py tests/test_morning_preflight.py scripts/bind_morning_report_evidence.py tests/test_morning_evidence_handoff.py scripts/capture_morning_creation_evidence.py tests/test_morning_creation_evidence.py scripts/prepare_morning_report_issue.py tests/test_morning_issue_adapter.py scripts/validate_morning_issue_projection.py tests/test_morning_issue_projection.py
      - name: Run evidence and preflight regressions
        env:
          PYTHONPATH: scripts:tests
        run: |
          python -m unittest discover -s tests -p test_morning_preflight.py -v
          python -m unittest discover -s tests -p test_morning_evidence_handoff.py -v
          python -m unittest discover -s tests -p test_morning_creation_evidence.py -v
          python -m unittest discover -s tests -p test_morning_issue_adapter.py -v
          python -m unittest discover -s tests -p test_morning_issue_projection.py -v
