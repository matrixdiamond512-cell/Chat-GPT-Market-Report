name: Morning infographic preflight tests
on:
  pull_request:
    paths:
      - scripts/preflight_morning_infographic.py
      - tests/test_morning_preflight.py
      - .github/workflows/morning-preflight-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile preflight files
        run: python -m py_compile scripts/preflight_morning_infographic.py tests/test_morning_preflight.py
      - name: Run seven regression tests
        run: python -m unittest discover -s tests -p test_morning_preflight.py -v
