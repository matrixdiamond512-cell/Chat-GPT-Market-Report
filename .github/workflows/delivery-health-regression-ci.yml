name: Delivery health regression CI
on:
  push:
    branches: [fix/production-report-slot-health-20261013]
  pull_request:
    paths:
      - scripts/verify_scheduled_report_delivery.py
      - tests/test_scheduled_report_delivery.py
      - .github/workflows/check-scheduled-report-delivery.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_scheduled_report_delivery.py' -v
