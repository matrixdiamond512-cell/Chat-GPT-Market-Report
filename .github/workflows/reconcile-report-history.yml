name: Reconcile market report history (read-only)

on:
  push:
    branches: [main]
    paths:
      - "reports/*.json"
      - "reports.json"
      - "scripts/reconcile_report_history.py"
      - ".github/workflows/reconcile-report-history.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-market-report-history
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical history is already consistent
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from reporting.publication_eligibility import is_publication_eligible

          index_path = Path('reports.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          if not isinstance(index, list):
              raise SystemExit('reports.json must be a list')

          index_keys = []
          by_key = {}
          for item in index:
              if not isinstance(item, dict):
                  raise SystemExit('reports.json contains a non-object item')
              key = (item.get('date'), item.get('time'))
              if not all(key):
                  raise SystemExit(f'invalid index item identity: {item!r}')
              if key in by_key:
                  raise SystemExit(f'duplicate report slot in index: {key}')
              if not is_publication_eligible(item):
                  raise SystemExit(f'non-public report in reports.json: {key}')
              index_keys.append(key)
              by_key[key] = item

          file_keys = set()
          public_file_keys = set()
          archived_file_count = 0
          for path in Path('reports').glob('*.json'):
              if path.name.startswith('_'):
                  continue
              report = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(report, dict):
                  raise SystemExit(f'{path}: canonical report must be an object')
              if not all(report.get(k) for k in ('date', 'time', 'title')):
                  report = report.get('latestReport', report)
              key = (report.get('date'), report.get('time'))
              if not all(key):
                  raise SystemExit(f'{path}: missing date/time')
              if key in file_keys:
                  raise SystemExit(f'duplicate canonical slot: {key}')
              file_keys.add(key)
              if not is_publication_eligible(report):
                  archived_file_count += 1
                  continue
              public_file_keys.add(key)
              indexed = by_key.get(key)
              if indexed is None:
                  raise SystemExit(f'eligible canonical report missing from index: {path}')
              if indexed != report:
                  raise SystemExit(f'index/canonical mismatch: {path}')

          if set(index_keys) != public_file_keys:
              raise SystemExit(
                  f'public history mismatch: index_only={sorted(set(index_keys)-public_file_keys)}, '
                  f'canonical_only={sorted(public_file_keys-set(index_keys))}'
              )

          print(
              f'Read-only history verification PASS: {len(public_file_keys)} public slots, '
              f'{archived_file_count} retained non-public canonical slots'
          )
          PY

      - name: Confirm workflow produced no report mutations
        run: |
          if ! git diff --quiet -- reports reports.json; then
            echo "ERROR: read-only history verification changed publication files"
            git status --short -- reports reports.json
            exit 1
          fi
          echo "No report files changed."
