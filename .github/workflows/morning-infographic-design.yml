name: 08:00 infographic design review
on:
  pull_request:
    paths:
      - 'templates/infographic/0800/**'
      - 'scripts/render_morning_*'
      - 'scripts/reporting/morning_layout.py'
      - 'tests/*morning*'
      - 'tools/morning-renderer/**'
      - '.github/workflows/morning-infographic-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated renderer dependencies
        run: |
          python -m pip install pillow
          npm install --prefix tools/morning-renderer --ignore-scripts
          tools/morning-renderer/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Existing gates and new projection tests
        run: |
          python -m unittest discover -s tests -p test_morning_layout.py -v
          python -m unittest discover -s tests -p test_infographic_validation.py -v
          python -m unittest discover -s tests -p test_independent_publication_status.py -v
          node scripts/test_independent_publication.js
      - name: Actual DRAFT PNG and producer-consumer integration
        env:
          NODE_PATH: ${{ github.workspace }}/tools/morning-renderer/node_modules
        run: |
          python tests/morning_fixture.py validation/0800-ci/input
          python scripts/render_morning_infographic.py render --report validation/0800-ci/input/report.json --view validation/0800-ci/input/view.json --fixture --output validation/0800-ci/render
          python scripts/render_morning_infographic.py manifest --report validation/0800-ci/input/report.json --view validation/0800-ci/input/view.json --fixture --png validation/0800-ci/render/png/morning-0800.png --receipt validation/0800-ci/render/png/render-receipt.json --drive-file-id mock-drive-file --drive-readback validation/0800-ci/render/png/morning-0800.png --png-filename fixture.png --output validation/0800-ci/manifest.json --report-output validation/0800-ci/bound-report.json
          python -c "import json;from pathlib import Path;r=json.loads(Path('validation/0800-ci/bound-report.json').read_text());Path('validation/0800-ci/debug-contract.json').write_text(json.dumps({'report':r,'manifest':r['infographicManifest']}))"
          node tests/test_morning_manifest.js validation/0800-ci/debug-contract.json NOT_READY
          python tests/export_morning_manifest_contract.py validation/0800-ci/mock-formal.json
          node tests/test_morning_manifest.js validation/0800-ci/mock-formal.json READY
      - uses: actions/upload-artifact@v4
        with:
          name: 0800-DRAFT-fixture-review
          path: validation/0800-ci/
