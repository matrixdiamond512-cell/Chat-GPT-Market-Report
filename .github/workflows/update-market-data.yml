name: Update independent market data

on:
  workflow_dispatch:
    inputs:
      report_slot:
        description: "Report slot label, or auto"
        required: false
        default: "auto"
      acquisition_mode:
        description: "auto keeps verified values and retries gaps; full refreshes all symbols"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full
  push:
    branches:
      - main
    paths:
      - "reports.json"
      - ".github/workflows/update-market-data.yml"
      - "scripts/fetch_market_data.py"
      - "scripts/run_market_data_acquisition.py"
      - "scripts/resolve_market_report_slot.py"
      - "scripts/build_market_json.py"
      - "scripts/build_market_sheet_exports.py"
      - "scripts/write_market_data_to_sheets.py"
      - "config/market_data_sources.json"
      - "config/market_data_validation.json"
  schedule:
    # UTC cron / Japan time schedule.
    # 07:00 report: Monday-Saturday. 05:55 preload, then 06:30-06:55 every 5 minutes.
    - cron: "55 20 * * 0-5"
    - cron: "30,35,40,45,50,55 21 * * 0-5"
    # Weekday 12:00 / 16:00 / 21:00 reports: start 30 minutes before, every 5 minutes.
    - cron: "30,35,40,45,50,55 2 * * 1-5"
    - cron: "30,35,40,45,50,55 6 * * 1-5"
    - cron: "30,35,40,45,50,55 11 * * 1-5"
    # Saturday 09:00 summary report is intentionally not scheduled.

permissions:
  contents: write

concurrency:
  group: update-independent-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Japan-time slot
        id: slot
        shell: bash
        run: |
          SLOT="$(python scripts/resolve_market_report_slot.py \
            --event-name "${{ github.event_name }}" \
            --event-schedule "${{ github.event.schedule }}" \
            --requested-slot "${{ inputs.report_slot }}" \
            --reports-file reports.json)"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Resolve acquisition mode
        id: acquisition
        shell: bash
        run: |
          MODE="auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.acquisition_mode }}" = "full" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Check acquisition scripts
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/resolve_market_report_slot.py

      - name: Fetch, retry, and preserve best verified market data
        run: |
          python scripts/run_market_data_acquisition.py \
            --slot "${{ steps.slot.outputs.slot }}" \
            --mode "${{ steps.acquisition.outputs.mode }}" \
            --print-summary

      - name: Validate generated acquisition JSON
        run: |
          python -m json.tool data/market/latest.json > /dev/null
          python -m json.tool data/market/last_verified.json > /dev/null
          python -m json.tool data/market/acquisition_status.json > /dev/null

      - name: Build ChatGPT and Google Sheets CSV exports
        run: python scripts/build_market_sheet_exports.py

      - name: Install Google Sheets sync dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Persist each staged attempt to Google Sheets when configured
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/write_market_data_to_sheets.py

      - name: Merge market data into dashboard JSON
        run: python scripts/build_market_json.py --market-data data/market/latest.json --dashboard data/dashboard.json

      - name: Validate output files
        run: |
          python -m json.tool data/market/latest.json > /dev/null
          python -m json.tool data/market/last_verified.json > /dev/null
          python -m json.tool data/market/acquisition_status.json > /dev/null
          python -m json.tool data/dashboard.json > /dev/null
          test -s data/market/chatgpt_input.csv
          test -s data/market/verified_history.csv

      - name: Commit staged market data
        shell: bash
        run: |
          if git diff --quiet -- data/market data/dashboard.json; then
            echo "Market data files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market data/dashboard.json
          git commit -m "Update staged market data"
          git pull --rebase
          git push
