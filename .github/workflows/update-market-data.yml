name: Update independent market data

on:
  workflow_dispatch:
    inputs:
      report_slot:
        description: "Report slot label, or auto"
        required: false
        default: "auto"
      acquisition_mode:
        description: "auto keeps verified values and retries gaps; full refreshes all symbols"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full
  push:
    branches:
      - main
    paths:
      - "reports.json"
      - ".github/workflows/update-market-data.yml"
      - ".github/workflows/market-data-07-anchor.yml"
      - ".github/workflows/market-data-07-fallback.yml"
      - ".github/workflows/market-data-07-health.yml"
      - ".github/workflows/market-data-intraday-anchor.yml"
      - ".github/workflows/market-data-intraday-fallback.yml"
      - ".github/workflows/market-data-intraday-health.yml"
      - "scripts/fetch_market_data.py"
      - "scripts/run_market_data_acquisition.py"
      - "scripts/run_market_data_window.py"
      - "scripts/resolve_market_report_slot.py"
      - "scripts/build_market_json.py"
      - "scripts/build_market_sheet_exports.py"
      - "scripts/write_market_data_to_sheets.py"
      - "config/market_data_sources.json"
      - "config/market_data_validation.json"

permissions:
  contents: write

concurrency:
  group: update-independent-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Japan-time slot
        id: slot
        shell: bash
        run: |
          SLOT="$(python scripts/resolve_market_report_slot.py \
            --event-name "${{ github.event_name }}" \
            --event-schedule "${{ github.event.schedule }}" \
            --requested-slot "${{ inputs.report_slot }}" \
            --reports-file reports.json)"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Resolve acquisition mode
        id: acquisition
        shell: bash
        run: |
          MODE="auto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.acquisition_mode }}" = "full" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Check acquisition scripts
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py
          python -m py_compile scripts/resolve_market_report_slot.py

      - name: Fetch, retry, and preserve best verified market data
        run: |
          python scripts/run_market_data_acquisition.py \
            --slot "${{ steps.slot.outputs.slot }}" \
            --mode "${{ steps.acquisition.outputs.mode }}" \
            --print-summary

      - name: Validate generated acquisition JSON
        run: |
          python -m json.tool data/market/latest.json > /dev/null
          python -m json.tool data/market/last_verified.json > /dev/null
          python -m json.tool data/market/acquisition_status.json > /dev/null

      - name: Build ChatGPT and Google Sheets CSV exports
        run: python scripts/build_market_sheet_exports.py

      - name: Merge market data into dashboard JSON
        run: python scripts/build_market_json.py --market-data data/market/latest.json --dashboard data/dashboard.json

      - name: Validate output files
        run: |
          python -m json.tool data/market/latest.json > /dev/null
          python -m json.tool data/market/last_verified.json > /dev/null
          python -m json.tool data/market/acquisition_status.json > /dev/null
          python -m json.tool data/dashboard.json > /dev/null
          test -s data/market/chatgpt_input.csv
          test -s data/market/verified_history.csv

      - name: Read acquisition status
        id: market_status
        shell: bash
        run: |
          STATUS="$(python -c 'import json; print(json.load(open("data/market/latest.json", encoding="utf-8")).get("overallStatus", "blocked"))')"
          echo "overall_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Commit staged market data
        shell: bash
        run: |
          if git diff --quiet -- data/market data/dashboard.json; then
            echo "Market data files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market data/dashboard.json
          git commit -m "Update staged market data"
          git pull --rebase
          git push

      - name: Sync staged data to Google Sheets and record result
        id: sheets_sync
        if: always()
        continue-on-error: true
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_STATUS: ${{ steps.market_status.outputs.overall_status }}
        shell: bash
        run: |
          STATUS="${ACQUISITION_STATUS:-blocked}"
          if [ "$STATUS" = "blocked" ]; then
            CODE=0
            OUTPUT="Google Sheets persistence skipped: staged market data is blocked."
          else
            set +e
            OUTPUT="$(python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt 2>&1 && python scripts/write_market_data_to_sheets.py 2>&1)"
            CODE=$?
            set -e
          fi

          export SYNC_CODE="$CODE"
          export SYNC_OUTPUT="$OUTPUT"
          python - <<'PYCODE'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          code = int(os.environ.get("SYNC_CODE", "1"))
          output = os.environ.get("SYNC_OUTPUT", "")
          if "staged market data is blocked" in output:
              outcome = "skipped_blocked"
          elif "persistence skipped" in output:
              outcome = "skipped_unconfigured"
          elif code == 0:
              outcome = "success"
          else:
              outcome = "failed"
          payload = {
              "recordedAt": dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).replace(microsecond=0).isoformat(),
              "outcome": outcome,
              "exitCode": code,
              "message": output[-2000:],
          }
          path = Path("data/market/sheets_sync_status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PYCODE
          printf '%s\n' "$OUTPUT"
          exit "$CODE"

      - name: Commit Google Sheets sync status
        if: always()
        shell: bash
        run: |
          if [ ! -f data/market/sheets_sync_status.json ]; then
            echo "Sheets sync status file was not created."
            exit 1
          fi
          if git diff --quiet -- data/market/sheets_sync_status.json; then
            echo "Sheets sync status is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/sheets_sync_status.json
          git commit -m "Record market data Sheets sync status"
          git pull --rebase
          git push

      - name: Fail when configured Google Sheets sync failed
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/market/sheets_sync_status.json").read_text(encoding="utf-8"))
          if payload.get("outcome") == "failed":
              raise SystemExit("Google Sheets sync failed: " + str(payload.get("message") or ""))
          print("Google Sheets sync outcome:", payload.get("outcome"))
          PYCODE
