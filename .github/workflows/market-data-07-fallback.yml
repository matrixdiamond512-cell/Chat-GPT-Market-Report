name: 07:00 market data fallback windows

on:
  workflow_dispatch:
  schedule:
    # Independent backup registration. If the 05:58 primary schedule is missed,
    # 06:25 covers the remaining window. 06:47 is the emergency final fallback.
    - cron: "25 21 * * 0-5"
    - cron: "47 21 * * 0-5"

permissions:
  contents: write

concurrency:
  group: market-data-07-window
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py

      - name: Recover missing 07:00 acquisition attempts
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: fallback_window
        run: |
          python scripts/run_market_data_window.py \
            --slot "07:00" \
            --times "06:00,06:30,06:35,06:40,06:45,06:50,06:55" \
            --trigger-source "fallback_window" \
            --max-catchup-minutes 90
