name: Update US stock breadth

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "US market date YYYY-MM-DD; blank uses previous JST date"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-us-stock-breadth.yml"
      - "scripts/fetch_us_stock_breadth.py"
      - "scripts/fix_us_stock_breadth_52w.py"
      - "scripts/recalculate_us_stock_breadth_history.py"
      - "scripts/build_us_stock_breadth_csv.py"
  schedule:
    - cron: "30 21 * * 1-5" # 06:30 JST Tue-Sat during U.S. DST

permissions:
  contents: write

concurrency:
  group: update-us-stock-breadth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt
      - name: Fetch US breadth
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          US_BREADTH_MARKET_DATE: ${{ inputs.market_date }}
        run: python scripts/fetch_us_stock_breadth.py
      - name: Check current breadth state
        id: breadth_state
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('data/market/us-stock-breadth.json').read_text(encoding='utf-8'))
          current = payload.get('current') or payload
          available = current.get('status') != 'unavailable' and bool(current.get('exchanges'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'available={str(available).lower()}\n')
          print('breadth available:', available)
          PY
      - name: Correct 52-week high and low counts
        if: steps.breadth_state.outputs.available == 'true'
        run: python scripts/fix_us_stock_breadth_52w.py
      - name: Recalculate prior-day and 20-day comparisons
        if: steps.breadth_state.outputs.available == 'true'
        run: python scripts/recalculate_us_stock_breadth_history.py
      - name: Build public CSV history for Google Sheets
        run: python scripts/build_us_stock_breadth_csv.py
      - name: Validate generated files
        run: |
          python -m json.tool data/market/us-stock-breadth.json > /dev/null
          python -m json.tool data/market/us-stock-breadth-history.json > /dev/null
          python -m json.tool data/stocks.json > /dev/null
          test -s data/market/us-stock-breadth-history.csv
          python scripts/validate_stock_data_freshness.py
      - name: Commit generated breadth data
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update US stock breadth" data/market/us-stock-breadth.json data/market/us-stock-breadth-history.json data/market/us-stock-breadth-history.csv data/stocks.json

