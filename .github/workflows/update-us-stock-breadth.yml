name: Update US stock breadth

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "US market date YYYY-MM-DD; blank uses previous JST date"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-us-stock-breadth.yml"
      - "scripts/fetch_us_stock_breadth.py"
  schedule:
    # 21:30 UTC Monday-Friday = 06:30 JST Tuesday-Saturday.
    # Runs after the regular US cash-market close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-us-stock-breadth
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Fetch, validate, and persist US breadth
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          US_BREADTH_MARKET_DATE: ${{ inputs.market_date }}
        run: python scripts/fetch_us_stock_breadth.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/market/us-stock-breadth.json > /dev/null
          python -m json.tool data/market/us-stock-breadth-history.json > /dev/null
          python -m json.tool data/stocks.json > /dev/null

      - name: Commit generated breadth data
        shell: bash
        run: |
          if git diff --quiet -- data/market/us-stock-breadth.json data/market/us-stock-breadth-history.json data/stocks.json; then
            echo "US stock breadth files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/us-stock-breadth.json data/market/us-stock-breadth-history.json data/stocks.json
          git commit -m "Update US stock breadth"
          git pull --rebase
          git push
