name: 07:00 market data primary window

on:
  workflow_dispatch:
  schedule:
    # 05:50 JST, Monday-Saturday. The runner stays alive and executes
    # 05:55, 06:30, 06:35, 06:40, 06:45, 06:50, and 06:55 itself.
    - cron: "50 20 * * 0-5"

permissions:
  contents: write

concurrency:
  group: market-data-07-window
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate acquisition programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py

      - name: Run the full 07:00 acquisition window
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACQUISITION_TRIGGER_SOURCE: primary_window
        run: |
          python scripts/run_market_data_window.py \
            --slot "07:00" \
            --times "05:55,06:30,06:35,06:40,06:45,06:50,06:55" \
            --trigger-source "primary_window" \
            --max-catchup-minutes 90
