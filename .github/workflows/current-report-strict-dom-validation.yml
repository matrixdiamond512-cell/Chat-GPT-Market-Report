name: Current Report Strict DOM Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'report.html'
      - 'assets/js/**'
      - 'reports.json'
      - 'reports/**'
      - 'scripts/validate_market_report_dom.js'
      - 'tests/fixtures/report_title_boundary_malformed.json'
      - '.github/workflows/current-report-strict-dom-validation.yml'

permissions:
  contents: read

jobs:
  renderer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium for fixture regression
        run: |
          npm install --prefix "$RUNNER_TEMP/renderer-regression" --no-save playwright
          "$RUNNER_TEMP/renderer-regression/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start local server for renderer regression fixture
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /tmp/renderer-regression-http.log 2>&1 &
          echo $! > /tmp/renderer-regression-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/reports.json -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/renderer-regression-http.log
          exit 1

      - name: Browser renderer regression: malformed title fixture
        env:
          PORTAL_URL: http://127.0.0.1:8766
          PORTAL_REPORT_FIXTURE: tests/fixtures/report_title_boundary_malformed.json
          NODE_PATH: ${{ runner.temp }}/renderer-regression/node_modules
        run: node scripts/validate_market_report_dom.js

  strict-current-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium validator
        run: |
          npm install --prefix "$RUNNER_TEMP/current-report-validation" --no-save playwright
          "$RUNNER_TEMP/current-report-validation/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start local server for current report artifact
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/current-report-strict-http.log 2>&1 &
          echo $! > /tmp/current-report-strict-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/reports.json -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/current-report-strict-http.log
          exit 1

      - name: Validate every latest-date current report slot (strict)
        env:
          PORTAL_URL: http://127.0.0.1:8765
          NODE_PATH: ${{ runner.temp }}/current-report-validation/node_modules
        run: node scripts/validate_market_report_dom.js
