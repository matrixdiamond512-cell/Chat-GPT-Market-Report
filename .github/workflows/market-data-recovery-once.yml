name: One-time 07:00 market data recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-data-recovery-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-one-time-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-market-data.txt

      - name: Validate programs
        run: |
          python -m py_compile scripts/fetch_market_data.py
          python -m py_compile scripts/run_market_data_acquisition.py
          python -m py_compile scripts/run_market_data_window.py

      - name: Recover current 07:00 data
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          python scripts/run_market_data_acquisition.py --slot "07:00" --mode "full" --print-summary
          python scripts/build_market_sheet_exports.py
          python scripts/build_market_json.py --market-data data/market/latest.json --dashboard data/dashboard.json
          STATUS="$(python -c 'import json; print(json.load(open("data/market/latest.json", encoding="utf-8")).get("overallStatus", "blocked"))')"
          if [ "$STATUS" != "blocked" ]; then
            python scripts/write_market_data_to_sheets.py
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market data/dashboard.json
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "Recover 07:00 market data"
          git pull --rebase
          git push
