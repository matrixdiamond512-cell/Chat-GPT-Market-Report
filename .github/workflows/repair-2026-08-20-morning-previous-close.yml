name: Repair 2026-08-20 08:00 previous-close portal data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-2026-08-20-morning-previous-close.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: repair-2026-08-20-morning-previous-close
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replace 08:00 table with 8/19 previous-close data
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path

          path = Path('reports/2026-08-20_08-00.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('date') != '2026-08-20' or report.get('time') != '08:00':
              raise SystemExit('target report identity mismatch')

          U = lambda reason: f'取得不能（{reason}）'
          rows = [
              {'label':'NYダウ','value':'53,463.05','change':'+119.65','rate':'+0.22%','direction':'上昇'},
              {'label':'NASDAQ総合','value':'26,331.09','change':'+41.38','rate':'+0.16%','direction':'上昇'},
              {'label':'S&P500','value':'7,707.98','change':'+16.22','rate':'+0.21%','direction':'上昇'},
              {'label':'Russell 2000','value':'3,032.94','change':'+15.05','rate':'+0.50%','direction':'上昇'},
              {'label':'日経225現物','value':'65,326.42円','change':'-2,134.31円','rate':'-3.16%','direction':'下落'},
              {'label':'CME日経225先物・円建て','value':U('8/19前営業日終値を固定系列で安全に照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'CME日経225先物・ドル建て','value':U('8/19前営業日終値を固定系列で安全に照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'日経225先物（大阪取引所）','value':'65,480円','change':'-2,060円','rate':'-3.05%','direction':'下落'},
              {'label':'USD/JPY','value':U('8/19 USDJPY日足終値は固定日足系列に同日確定行がなく最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'EUR/USD','value':U('8/19 EURUSD日足終値は固定日足系列で同日確定値を最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'COMEX金先物','value':'4,545.30ドル/oz','change':'+124.70','rate':'+2.80%','direction':'上昇'},
              {'label':'WTI原油','value':'85.83ドル/bbl','change':'+0.89','rate':'+1.05%','direction':'上昇'},
              {'label':'BTCUSD','value':U('8/19 BTCUSD基準値は24時間市場の固定基準系列で最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'VIX','value':'14.89','change':'-0.95','rate':'-6.00%','direction':'低下'},
              {'label':'日経VI','value':U('8/19公式終値を安全に最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'Fear & Greed Index','value':U('8/19同日最終値を安全に検証できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'米10年債利回り','value':'4.65%','change':'-0.060pt','rate':'—','direction':'低下'},
              {'label':'日本10年国債利回り','value':U('8/19終値を固定取得先で最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'日経225予想PER','value':U('8/19予想PERを安全に最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'日経225 PBR','value':U('8/19 PBRを安全に最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'日経225予想EPS','value':U('8/19予想EPSを安全に最終照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'日経225 25日移動平均乖離率','value':'-0.70%','change':'—','rate':'—','direction':'下方乖離'},
              {'label':'日経225 200日移動平均乖離率','value':'+12.48%','change':'—','rate':'—','direction':'上方乖離'},
              {'label':'東証プライム売買代金','value':'10兆1,151億円','change':'—','rate':'—','direction':'確定値'},
              {'label':'東証プライム売買高','value':'25億1,136万株','change':'—','rate':'—','direction':'確定値'},
              {'label':'東証プライム値上がり銘柄数','value':U('8/19確定値を安全に照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'東証プライム値下がり銘柄数','value':U('8/19確定値を安全に照合できず'),'change':'—','rate':'—','direction':'取得不能'},
              {'label':'東証プライム25日騰落レシオ','value':'118.44%','change':'—','rate':'—','direction':'確定値'},
          ]

          report['marketDataTable'] = {
              'columns':['項目','終値・値','前日比','騰落率','方向感'],
              'rows':rows,
              'semantics':'previous_close',
              'dataDate':'2026-08-19',
              'title':'前営業日終値（2026/08/19）',
          }

          provenance = report.setdefault('dataProvenance', {})
          provenance.pop('publishedValueRecovery', None)
          provenance['closeSheet'] = {
              'sheet':'終値一覧',
              'dataDate':'2026-08-19',
              'semantics':'previous_close',
              'updatedLabels':[r['label'] for r in rows],
              'unavailableLabels':[r['label'] for r in rows if str(r['value']).startswith('取得不能（')],
              'rule':'8/20 08:00 historical correction: previous-close table contains only 8/19 closes or reasoned unavailable markers; same-day 08:00 snapshots are excluded.',
          }
          provenance['historicalPreviousCloseCorrection'] = {
              'correctedAt':dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).replace(microsecond=0).isoformat(),
              'reportDate':'2026-08-20',
              'previousCloseDate':'2026-08-19',
              'semantics':'previous_close',
              'rule':'Current 08:00 quotes remain only in the intraday analysis fields; they are never used as previous-close values.',
          }

          table_lines = []
          for r in rows:
              table_lines.append(f"{r['label']}｜{r['value']}｜{r['change']}｜{r['rate']}｜{r['direction']}")
          replacement = (
              '【主要市場データ（前営業日終値：2026/08/19）】\n'
              + '\n'.join(table_lines)
              + '\n※本文の「前回からの変化」「個別市場見通し」にある8/20朝の価格は08:00現在値であり、この前営業日終値表とは別データ。'
          )
          text = str(report.get('fullText') or '').replace('\r','')
          pattern = re.compile(r'【主要市場データ[^】]*】.*?(?=\n【[^\n]+】)', re.S)
          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          elif text:
              text += '\n\n' + replacement
          else:
              text = replacement
          report['fullText'] = text.strip()

          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('repaired', path)
          PY

      - name: Rebuild reports index
        run: python scripts/build_reports.py

      - name: Validate corrected historical morning table
        run: |
          python scripts/verify_morning_report_qa.py \
            --date 2026-08-20 \
            --slot 08:00 \
            --allow-historical \
            --latest-report /dev/null
          python -m json.tool reports/2026-08-20_08-00.json > /dev/null
          python -m json.tool reports.json > /dev/null

      - name: Commit corrected portal data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/2026-08-20_08-00.json reports.json data/market/morning_report_qa.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Historical report already corrected."
            exit 0
          fi
          git commit -m "Correct Aug 20 morning previous-close portal data"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
