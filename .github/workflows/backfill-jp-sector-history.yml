name: Backfill verified JP 33-sector historical rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * 1" # Monday 18:40 JST; after Tokyo close
  push:
    branches: [main]
    paths:
      - "scripts/backfill_jp_sector_history.py"
      - "scripts/test_backfill_jp_sector_history.py"
      - ".github/workflows/backfill-jp-sector-history.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/backfill_jp_sector_history.py"
      - "scripts/test_backfill_jp_sector_history.py"
      - ".github/workflows/backfill-jp-sector-history.yml"

permissions:
  contents: write

concurrency:
  group: verified-jp-sector-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify 33-sector dated parser and no-overwrite policy
        run: python -m unittest discover -s scripts -p 'test_backfill_jp_sector_history.py' -v

  live-backfill:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Sheets API and HTML parser
        run: python -m pip install --disable-pip-version-check requests google-auth beautifulsoup4
      - name: Fetch 33 sector-index time series and write missing dates
        id: backfill
        continue-on-error: true
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/backfill_jp_sector_history.py --apply
      - name: Commit completion or blocker receipt
        shell: bash
        run: bash scripts/publish_stock_update.sh "Archive JP 33-sector history backfill receipt" data/market/jp-sector-history-backfill.json
      - name: Require complete coverage and Sheets readback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/market/jp-sector-history-backfill.json").read_text(encoding="utf-8"))
          if p.get("status") not in {"APPLIED", "NO_NEW_DATA"}:
              raise SystemExit("JP_SECTOR_BACKFILL_BLOCKED: " + str(p.get("reason") or p.get("status")))
          if p.get("indexCount") != 33:
              raise SystemExit("JP_SECTOR_SOURCE_INCOMPLETE")
          if p.get("written") != p.get("readBack"):
              raise SystemExit("JP_SECTOR_READBACK_MISMATCH")
          print("JP_BACKFILL_VERIFIED", p.get("candidateDates"), p.get("written"), p.get("readBack"))
          PY
