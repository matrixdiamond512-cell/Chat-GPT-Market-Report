name: Update completed Tokyo stock session

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_tokyo_stock_table_from_sheet.py"
      - "scripts/capture_japan_close_reference.py"
      - "scripts/export_tokyo_stock_table.py"
      - ".github/workflows/update-tokyo-stock-table.yml"
  schedule:
    # Retry after the Tokyo close because public sources do not all publish at
    # exactly the same time. Each run is exact-date only; stale values are never
    # carried forward under the new date.
    - cron: "10 7 * * 1-5"   # 16:10 JST
    - cron: "40 7 * * 1-5"   # 16:40 JST
    - cron: "10 8 * * 1-5"   # 17:10 JST

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Validate Tokyo updater
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/capture_japan_close_reference.py
          python -m py_compile scripts/update_tokyo_stock_table_from_sheet.py
          python -m py_compile scripts/export_tokyo_stock_table.py

      - name: Update completed Tokyo session with exact-date fallback
        run: python scripts/update_tokyo_stock_table_from_sheet.py

      - name: Export independently dated Tokyo table
        run: python scripts/export_tokyo_stock_table.py

      - name: Validate retained U.S. date, Tokyo date and Prime breadth
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          overlay = json.loads(Path('data/market/tokyo-stock-table.json').read_text(encoding='utf-8'))
          dates = data.get('marketDates') or {}
          date_re = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          if not date_re.fullmatch(str(dates.get('us') or '')):
              raise SystemExit('U.S. market date is missing')
          if not date_re.fullmatch(str(dates.get('japan') or '')):
              raise SystemExit('Tokyo market date is missing')
          if overlay.get('dataDate') != dates.get('japan'):
              raise SystemExit('Tokyo overlay date does not match the Tokyo market date')

          rows = (((data.get('marketInternals') or {}).get('japan') or {}).get('rows') or [])
          breadth = next((row for row in rows if isinstance(row, list) and row and row[0] == '値上がり銘柄 / 値下がり銘柄'), None)
          if not breadth or len(breadth) < 2 or str(breadth[1]).startswith('取得不能'):
              raise SystemExit('Tokyo Prime advance/decline breadth is unavailable for the Tokyo market date')

          print('U.S. market date retained:', dates['us'])
          print('Tokyo market date updated:', dates['japan'])
          print('Tokyo Prime breadth:', breadth[1])
          PY

      - name: Commit Tokyo table, public reference and archive
        run: |
          if git diff --quiet -- data/stocks.json data/nikkei-metrics.json data/market/japan-close-reference.json data/market/tokyo-stock-table.json data/history/stocks; then
            echo "Tokyo table is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/nikkei-metrics.json data/market/japan-close-reference.json data/market/tokyo-stock-table.json data/history/stocks
          git commit -m "Update completed Tokyo session and stock archive"
          git pull --rebase
          git push

# public-source fallback enabled: 2026-08-14 JST
