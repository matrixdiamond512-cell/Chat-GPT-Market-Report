name: Update completed Tokyo stock session

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_tokyo_stock_table_from_sheet.py"
      - "scripts/export_tokyo_stock_table.py"
      - ".github/workflows/update-tokyo-stock-table.yml"
  schedule:
    # 16:10 JST Monday-Friday, after the Tokyo cash close data is available.
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Validate Tokyo updater
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/update_tokyo_stock_table_from_sheet.py
          python -m py_compile scripts/export_tokyo_stock_table.py

      - name: Update completed Tokyo session only
        run: python scripts/update_tokyo_stock_table_from_sheet.py

      - name: Export independently dated Tokyo table
        run: python scripts/export_tokyo_stock_table.py

      - name: Validate retained U.S. date and Tokyo date
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          data = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          overlay = json.loads(Path('data/market/tokyo-stock-table.json').read_text(encoding='utf-8'))
          dates = data.get('marketDates') or {}
          date_re = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          if not date_re.fullmatch(str(dates.get('us') or '')):
              raise SystemExit('U.S. market date is missing')
          if not date_re.fullmatch(str(dates.get('japan') or '')):
              raise SystemExit('Tokyo market date is missing')
          if overlay.get('dataDate') != dates.get('japan'):
              raise SystemExit('Tokyo overlay date does not match the Tokyo market date')
          print('U.S. market date retained:', dates['us'])
          print('Tokyo market date updated:', dates['japan'])
          PY

      - name: Commit Tokyo table and archive
        run: |
          if git diff --quiet -- data/stocks.json data/nikkei-metrics.json data/market/tokyo-stock-table.json data/history/stocks; then
            echo "Tokyo table is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/nikkei-metrics.json data/market/tokyo-stock-table.json data/history/stocks
          git commit -m "Update completed Tokyo session and stock archive"
          git pull --rebase
          git push
