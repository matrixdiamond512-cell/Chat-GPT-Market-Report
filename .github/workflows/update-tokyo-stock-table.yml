name: Update completed Tokyo stock session

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_tokyo_stock_table_from_sheet.py"
      - "scripts/capture_japan_close_reference.py"
      - "scripts/repair_tokyo_market_internals.py"
      - "scripts/repair_tokyo_current_indexes.py"
      - "scripts/repair_tokyo_turnover.py"
      - "scripts/export_tokyo_stock_table.py"
      - "data/market/japan-close-reference.json"
      - ".github/workflows/update-tokyo-stock-table.yml"
  schedule:
    # Retry after the Tokyo close because public sources do not all publish at
    # exactly the same time. Each run is exact-date only; stale values are never
    # carried forward under the new date.
    - cron: "10 7 * * 1-5"   # 16:10 JST
    - cron: "40 7 * * 1-5"   # 16:40 JST
    - cron: "10 8 * * 1-5"   # 17:10 JST
    - cron: "10 9 * * 1-5"   # 18:10 JST
    - cron: "10 11 * * 1-5"  # 20:10 JST
    - cron: "10 14 * * 1-5"  # 23:10 JST

permissions:
  contents: write

concurrency:
  group: stocks-page-daily-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Validate Tokyo updater
        run: |
          python -m py_compile scripts/archive_stocks_snapshot.py
          python -m py_compile scripts/capture_japan_close_reference.py
          python -m py_compile scripts/update_tokyo_stock_table_from_sheet.py
          python -m py_compile scripts/repair_tokyo_market_internals.py
          python -m py_compile scripts/repair_tokyo_current_indexes.py
          python -m py_compile scripts/repair_tokyo_turnover.py
          python -m py_compile scripts/export_tokyo_stock_table.py

      - name: Update completed Tokyo session with exact-date fallback
        run: python scripts/update_tokyo_stock_table_from_sheet.py

      - name: Repair missing Tokyo internals from independent verified sources
        run: python scripts/repair_tokyo_market_internals.py

      - name: Repair current-session TOPIX and Growth 250 quotes
        run: python scripts/repair_tokyo_current_indexes.py

      - name: Repair Tokyo Prime turnover from post-close commentary
        run: python scripts/repair_tokyo_turnover.py

      - name: Export independently dated Tokyo table
        run: python scripts/export_tokyo_stock_table.py

      - name: Validate retained U.S. date, Tokyo date and Prime breadth
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('data/stocks.json').read_text(encoding='utf-8'))
          overlay = json.loads(Path('data/market/tokyo-stock-table.json').read_text(encoding='utf-8'))
          reference = json.loads(Path('data/market/japan-close-reference.json').read_text(encoding='utf-8'))
          dates = data.get('marketDates') or {}
          date_re = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          if not date_re.fullmatch(str(dates.get('us') or '')):
              raise SystemExit('U.S. market date is missing')
          if not date_re.fullmatch(str(dates.get('japan') or '')):
              raise SystemExit('Tokyo market date is missing')
          if overlay.get('dataDate') != dates.get('japan'):
              raise SystemExit('Tokyo overlay date does not match the Tokyo market date')

          rows = (((data.get('marketInternals') or {}).get('japan') or {}).get('rows') or [])
          breadth = next((row for row in rows if isinstance(row, list) and row and row[0] == '値上がり銘柄 / 値下がり銘柄'), None)
          if not breadth or len(breadth) < 2 or str(breadth[1]).startswith('取得不能'):
              raise SystemExit('Tokyo Prime advance/decline breadth is unavailable for the Tokyo market date')

          ref_ratio = ((reference.get('items') or {}).get('東証プライム25日騰落レシオ') or {})
          ratio_row = next((row for row in rows if isinstance(row, list) and row and row[0] == '騰落レシオ（25日）'), None)
          if reference.get('dataDate') == dates.get('japan') and ref_ratio.get('value'):
              if not ratio_row or len(ratio_row) < 2 or str(ratio_row[1]).startswith('取得不能'):
                  raise SystemExit('Exact-date Prime 25-day ratio exists in reference but was not propagated to stocks.json')
              if str(ratio_row[1]) != str(ref_ratio['value']):
                  raise SystemExit(f"Prime 25-day ratio mismatch: {ratio_row[1]} != {ref_ratio['value']}")

          repaired = {}
          for label in ('TOPIX', 'グロース250', '日経VI', '東証プライム売買代金', '海外投資家動向（現物）'):
              row = next((r for r in rows if isinstance(r, list) and r and r[0] == label), None)
              repaired[label] = row[1] if row and len(row) > 1 else 'missing'

          print('U.S. market date retained:', dates['us'])
          print('Tokyo market date updated:', dates['japan'])
          print('Tokyo Prime breadth:', breadth[1])
          print('Tokyo Prime 25-day ratio:', ratio_row[1] if ratio_row else 'not available')
          print('Independent-source repairs:', repaired)
          PY

      - name: Commit Tokyo table, public reference and archive
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update completed Tokyo session and stock archive" data/stocks.json data/nikkei-metrics.json data/market/japan-close-reference.json data/market/tokyo-stock-table.json data/history/stocks

# public-source fallback enabled: 2026-08-14 JST
