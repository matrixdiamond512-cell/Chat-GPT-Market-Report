name: Close-sheet acquisition and missing-data integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * 1-5" # 18:25 JST on Tokyo market weekdays
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_close_sheet_missing.py"
      - "scripts/backfill_verified_close_archives.py"
      - "scripts/sheet_date_utils.py"
      - "scripts/fetch_sector_performance.py"
      - "scripts/fetch_nikkei_contributions.py"
      - "scripts/test_close_sheet_sync_integrity.py"
      - "tests/test_close_sheet_missing_audit.py"
      - ".github/workflows/close-sheet-integrity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit_close_sheet_missing.py"
      - "scripts/backfill_verified_close_archives.py"
      - "scripts/sheet_date_utils.py"
      - "scripts/fetch_sector_performance.py"
      - "scripts/fetch_nikkei_contributions.py"
      - "scripts/test_close_sheet_sync_integrity.py"
      - "tests/test_close_sheet_missing_audit.py"
      - ".github/workflows/close-sheet-integrity.yml"

permissions:
  contents: write

concurrency:
  group: close-sheet-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify independent market dates and persistence-failure boundary
        run: python -m unittest discover -s scripts -p 'test_close_sheet_sync_integrity.py' -v
      - name: Verify missing-data audit states
        run: python -m unittest discover -s tests -p 'test_close_sheet_missing_audit.py' -v
      - name: Existing stock parsers remain compatible
        run: python -m unittest discover -s scripts -p 'test_stock_source_parsers.py' -v
      - name: Existing stock automation contract remains compatible
        run: python -m unittest discover -s scripts -p 'test_stock_automation_contract.py' -v

  live-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google Sheets read client
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Refill only empty historical cells from verified archives
        id: backfill
        continue-on-error: true
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/backfill_verified_close_archives.py --apply
      - name: Read-only audit of the owner-authoritative sheet
        id: audit
        continue-on-error: true
        env:
          MARKET_DATA_SPREADSHEET_ID: ${{ secrets.MARKET_DATA_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/audit_close_sheet_missing.py
      - name: Save audit receipt even if Sheets was blocked
        shell: bash
        run: bash scripts/publish_stock_update.sh "Update closing-sheet backfill and missing-data receipts" data/market/close-missing-audit.json data/market/close-missing-backfill.json
      - name: Fail clearly when live Sheets access was blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/market/close-missing-audit.json").read_text(encoding="utf-8"))
          if payload.get("status") != "AUDITED":
              raise SystemExit("CLOSING_SHEET_AUDIT_BLOCKED: " + str(payload.get("reason", "unknown")))
          receipt = json.loads(Path("data/market/close-missing-backfill.json").read_text(encoding="utf-8"))
          if receipt.get("status") == "BLOCKED":
              raise SystemExit("CLOSING_SHEET_BACKFILL_BLOCKED: " + str(receipt.get("reason", "unknown")))
          print("AUDITED; core blanks:", payload["coreBlank"], "extra blanks:", payload["extraBlank"], "backfilled:", receipt.get("verifiedReadback", 0))
          PY
