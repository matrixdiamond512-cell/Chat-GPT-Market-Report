name: 08:00 report publication QA

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "YYYY-MM-DD; blank = current/latest 08:00 report"
        required: false
        default: ""
  push:
    paths:
      - "reports.json"
      - "data/latest-report.json"
      - "data/market/morning-reference.json"
      - "scripts/verify_morning_report_qa.py"
      - "assets/js/morning-report-qa-gate.js"
      - ".github/workflows/qa-morning-report.yml"

permissions:
  contents: write

concurrency:
  group: morning-report-publication-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before QA
        shell: bash
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate QA program
        run: python -m py_compile scripts/verify_morning_report_qa.py

      - name: Resolve 08:00 report date
        id: report
        shell: bash
        run: |
          REQUESTED="${{ inputs.report_date }}"
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          if [ -n "$REQUESTED" ]; then
            DATE="$REQUESTED"
            EXPLICIT="true"
          else
            DATE="$(python - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path('data/latest-report.json')
          date = ''
          if latest_path.is_file():
              try:
                  payload = json.loads(latest_path.read_text(encoding='utf-8'))
                  report = payload.get('latestReport') or {}
                  if report.get('time') == '08:00' and report.get('date'):
                      date = str(report.get('date'))
              except Exception:
                  pass

          if not date:
              reports = json.loads(Path('reports.json').read_text(encoding='utf-8'))
              dates = sorted([
                  str(r.get('date'))
                  for r in reports
                  if isinstance(r, dict) and r.get('time') == '08:00' and r.get('date')
              ])
              date = dates[-1] if dates else ''
          print(date)
          PY
          )"
            EXPLICIT="false"
          fi
          if [ -z "$DATE" ]; then
            echo "No 08:00 report found"
            exit 1
          fi
          if [ "$EXPLICIT" != "true" ] && [ "$DATE" != "$TODAY" ]; then
            echo "Latest 08:00 report is stale: resolved=$DATE today=$TODAY"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "QA target: $DATE 08:00"

      - name: Run 28-item publication QA
        id: qa
        shell: bash
        run: |
          set +e
          python scripts/verify_morning_report_qa.py \
            --date "${{ steps.report.outputs.date }}" \
            --slot "08:00"
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Commit machine-readable QA result
        if: always()
        shell: bash
        run: |
          if [ ! -f data/market/morning_report_qa.json ]; then
            echo "QA result file was not created"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/morning_report_qa.json
          if git diff --cached --quiet; then
            echo "QA result unchanged"
          else
            git commit -m "Record 08:00 report publication QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Block invalid 08:00 publication
        if: always()
        shell: bash
        run: |
          CODE="${{ steps.qa.outputs.code }}"
          if [ "${CODE:-1}" -ne 0 ]; then
            echo "08:00 report failed publication QA. WEB latest-selection gate must reject this report."
            cat data/market/morning_report_qa.json || true
            exit 1
          fi
          echo "08:00 report passed current-date 28-item / 5-column publication QA."
