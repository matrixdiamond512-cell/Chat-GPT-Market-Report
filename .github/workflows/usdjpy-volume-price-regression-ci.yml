name: USDJPY volume price preservation regression
on:
  pull_request:
    paths:
      - "apps-script/UsdJpyVolumeJsonFlexibleSync.gs"
      - "scripts/test_usdjpy_volume_json_preservation.js"
      - "scripts/run_usdjpy_volume_price_backfill.py"
      - "scripts/update_usdjpy_volume_prices.py"
      - "scripts/yahoo_jp_usdjpy_ohlc.py"
      - "scripts/stooq_usdjpy_ohlc.py"
      - "scripts/apply_dukascopy_usdjpy_csv.py"
      - "tests/test_usdjpy_volume_historical_backfill.py"
      - ".github/workflows/usdjpy-volume-price-regression-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_usdjpy_volume_json_preservation.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/run_usdjpy_volume_price_backfill.py scripts/update_usdjpy_volume_prices.py scripts/yahoo_jp_usdjpy_ohlc.py scripts/stooq_usdjpy_ohlc.py scripts/apply_dukascopy_usdjpy_csv.py
      - run: python -m unittest discover -s tests -p "test_usdjpy_volume_historical_backfill.py" -v
