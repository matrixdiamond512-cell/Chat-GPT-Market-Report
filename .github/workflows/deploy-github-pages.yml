name: Deploy WEB Market Report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate public entry files
        shell: bash
        run: |
          test -f index.html
          test -f nikkei225-supply-demand.html
          test -f data/nikkei225-supply-demand.json
          python -m json.tool data/nikkei225-supply-demand.json > /dev/null
          grep -q '先物・裁定・オプション・投資主体' nikkei225-supply-demand.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
