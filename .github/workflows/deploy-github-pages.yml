name: Rebuild WEB Market Report GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate current main publication files
        shell: bash
        run: |
          test -f index.html
          test -f nikkei225-supply-demand.html
          test -f data/nikkei225-supply-demand.json
          python -m json.tool data/nikkei225-supply-demand.json > /dev/null
          grep -q '先物・裁定・オプション・投資主体' nikkei225-supply-demand.html
          grep -q 'nikkei225-basis-options-display.js' nikkei225-supply-demand.html

      - name: Request GitHub Pages rebuild using configured source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
