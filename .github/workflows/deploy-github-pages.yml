name: Check GitHub Pages source consistency (legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check report publication integrity without rebuilding Pages
        shell: bash
        run: |
          cp reports.json /tmp/reports.before.json
          python scripts/build_reports.py

          if ! cmp -s reports.json /tmp/reports.before.json; then
            echo "ERROR: publication history is not stable; legacy Pages rebuild remains fenced."
            git diff -- reports.json || true
            exit 1
          fi

          if ! git diff --quiet -- reports; then
            echo "ERROR: canonical report history would be rewritten; legacy Pages rebuild remains fenced."
            git status --short -- reports
            exit 1
          fi

          test -f index.html
          test -f nikkei225-supply-demand.html
          test -f data/nikkei225-supply-demand.json
          python -m json.tool data/nikkei225-supply-demand.json > /dev/null
          grep -q '先物・裁定・オプション・投資主体' nikkei225-supply-demand.html
          grep -q 'nikkei225-basis-options-display.js' nikkei225-supply-demand.html

          echo "Legacy Pages rebuild path is fenced. Use deploy-pages.yml for production deployment."
