name: Update all stock analysis components

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/stocks-update-trigger/**"
      - ".github/workflows/update-stocks.yml"
  # Each component owns its market-session schedule.  Do not fan out all
  # writers from a scheduled dispatcher: GitHub keeps only one pending run
  # per concurrency group, which would silently drop most component updates.

permissions:
  actions: write
  contents: read

concurrency:
  group: update-all-stock-analysis-components
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start independent stock component updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          workflows=(
            update-stock-sessions.yml
            update-tokyo-stock-table.yml
            update-japan-stock-movers.yml
            update-sector-performance.yml
            update-nikkei-contributions.yml
            update-us-stock-breadth.yml
            update-us-stock-movers-contributions.yml
            update-tokyo-preopen.yml
            update-us-premarket.yml
          )
          for workflow in "${workflows[@]}"; do
            echo "Dispatching ${workflow}"
            gh workflow run "${workflow}" --ref main
          done

      - name: Explain asynchronous completion
        run: |
          echo "Each component validates and commits independently."
          echo "A failed sector parser must not block the other stock components."

