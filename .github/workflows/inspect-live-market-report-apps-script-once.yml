name: Inspect live market report Apps Script deployment once
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-live-market-report-apps-script-once.yml"]
permissions:
  contents: read
jobs:
  verify-remote:
    runs-on: ubuntu-latest
    environment: apps-script-production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authenticated read-only API client
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Compare live Apps Script source with repository (NO UPDATE)
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_OAUTH_JSON: ${{ secrets.APPS_SCRIPT_OAUTH_JSON }}
        run: |
          python - <<'PY'
          import json,os
          print(json.dumps({
            "APPS_SCRIPT_ID_configured": bool(os.getenv("APPS_SCRIPT_ID","").strip()),
            "APPS_SCRIPT_OAUTH_JSON_configured": bool(os.getenv("APPS_SCRIPT_OAUTH_JSON","").strip())
          }))
          PY
          python scripts/deploy_market_report_apps_script.py
