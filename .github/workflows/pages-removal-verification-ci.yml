name: GitHub Pages publication removal verification
on:
  pull_request:
    paths:
      - scripts/verify_public_report_deployment.py
      - tests/test_verify_public_report_deployment.py
      - .github/workflows/pages-removal-verification-ci.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Pages archive removal waits for edge propagation and fails closed
        run: python -m unittest discover -s tests -p "test_verify_public_report_deployment.py" -v
