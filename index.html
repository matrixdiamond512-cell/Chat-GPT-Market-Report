<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マーケットレポート</title>
  <meta name="description" content="マーケットレポートをHTMLで閲覧できるダッシュボード">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="site-header">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow">MARKET REPORT DASHBOARD</p>
        <h1>マーケットレポート</h1>
        <p class="lead">相場テーマ、重要ニュース、需給、個別見通しを1ページで確認できます。</p>
      </div>
      <div class="hero-note">画像不要・スマホ対応・検索可能</div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="レポート絞り込み">
      <label>時間帯
        <select id="timeFilter">
          <option value="all">すべて</option>
          <option value="07:00">07:00</option>
          <option value="09:00">土曜09:00</option>
          <option value="12:00">12:00</option>
          <option value="16:00">16:00</option>
          <option value="21:00">21:00</option>
        </select>
      </label>
      <label>月
        <select id="monthFilter"><option value="all">すべて</option></select>
      </label>
      <label>市場
        <select id="marketFilter">
          <option value="all">すべて</option>
          <option value="USD/JPY">USD/JPY</option>
          <option value="EUR/USD">EUR/USD</option>
          <option value="日経225先物">日経225先物</option>
          <option value="金">金</option>
          <option value="原油">原油</option>
          <option value="BTCUSD">BTCUSD</option>
        </select>
      </label>
      <label class="search-field">キーワード
        <input id="searchInput" type="search" placeholder="例：ドル円、原油、金、米金利">
      </label>
    </section>

    <section>
      <div class="section-heading">
        <h2>最新レポート</h2>
        <p id="latestTimestamp"></p>
      </div>
      <div id="latestReport"><p class="empty">読み込み中です…</p></div>
    </section>

    <section>
      <div class="section-heading">
        <h2>過去のレポート</h2>
        <p id="resultCount"></p>
      </div>
      <div id="reportList" class="report-list"></div>
      <p id="emptyMessage" class="empty" hidden>該当するレポートがありません。</p>
    </section>
  </main>

  <footer><div class="wrap">© Market Report</div></footer>
  <script src="script.js?v=4"></script>
</body>
</html>
