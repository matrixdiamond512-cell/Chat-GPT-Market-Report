<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マーケットレポート</title>
  <meta name="description" content="マーケットレポートをHTMLで閲覧できるアーカイブ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">MARKET REPORT ARCHIVE</p>
      <h1>マーケットレポート</h1>
      <p class="lead">本文と図解要素をWebページとして表示します。</p>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <label>時間帯
        <select id="timeFilter">
          <option value="all">すべて</option>
          <option value="07:00">07:00</option>
          <option value="09:00">土曜09:00</option>
          <option value="12:00">12:00</option>
          <option value="16:00">16:00</option>
          <option value="21:00">21:00</option>
        </select>
      </label>
      <label>キーワード
        <input id="searchInput" type="search" placeholder="例：ドル円、原油、金">
      </label>
    </section>

    <section>
      <h2>最新レポート</h2>
      <div id="latestReport"></div>
    </section>

    <section>
      <div class="section-heading">
        <h2>過去のレポート</h2>
        <p id="resultCount"></p>
      </div>
      <div id="reportList" class="report-list"></div>
      <p id="emptyMessage" class="empty" hidden>該当するレポートがありません。</p>
    </section>
  </main>

  <footer><div class="wrap">© Market Report</div></footer>
  <script src="script.js"></script>
</body>
</html>
