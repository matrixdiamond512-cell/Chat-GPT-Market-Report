<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マーケットレポート</title>
  <meta name="description" content="相場テーマ、ニュース、資金フロー、需給、個別見通しを確認できるマーケットダッシュボード">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="site-header">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow">MARKET INTELLIGENCE DASHBOARD</p>
        <h1>マーケットレポート</h1>
        <p class="lead">ニュースの羅列ではなく、「何が市場を動かし、次に何を見るべきか」を整理します。</p>
      </div>
      <div class="hero-note" id="heroStatus">最新データを読み込み中</div>
    </div>
  </header>

  <main class="wrap">
    <section class="dashboard-section" aria-label="最新マーケットダッシュボード">
      <div class="section-heading dashboard-heading">
        <div>
          <p class="section-kicker">LATEST MARKET SNAPSHOT</p>
          <h2>今日の市場全体像</h2>
        </div>
        <p id="dashboardTimestamp"></p>
      </div>

      <div class="dashboard-grid">
        <article class="dashboard-card dashboard-card--theme">
          <span class="dashboard-label">今日の相場テーマ</span>
          <strong id="dashboardTheme">読み込み中です…</strong>
        </article>
        <article class="dashboard-card">
          <span class="dashboard-label">今日の主導市場</span>
          <strong id="dashboardLeader">—</strong>
        </article>
        <article class="dashboard-card">
          <span class="dashboard-label">材料と値動き</span>
          <div id="dashboardConsistency" class="dashboard-list">—</div>
        </article>
        <article class="dashboard-card">
          <span class="dashboard-label">ポジションの偏り</span>
          <div id="dashboardPositioning" class="dashboard-list">—</div>
        </article>
      </div>

      <div class="dashboard-wide-grid">
        <article class="dashboard-card">
          <span class="dashboard-label">重要ニュース</span>
          <div id="dashboardNews" class="dashboard-list">—</div>
        </article>
        <article class="dashboard-card">
          <span class="dashboard-label">クロスアセット資金フロー</span>
          <div id="dashboardFlow" class="dashboard-list">—</div>
        </article>
        <article class="dashboard-card">
          <span class="dashboard-label">次の時間帯への引き継ぎ</span>
          <div id="dashboardHandover" class="dashboard-list">—</div>
        </article>
      </div>

      <div id="dashboardMarkets" class="ticker-grid" aria-label="主要市場の方向感"></div>
    </section>

    <section class="toolbar" aria-label="レポート絞り込み">
      <label>時間帯
        <select id="timeFilter">
          <option value="all">すべて</option>
          <option value="07:00">07:00</option>
          <option value="09:00">土曜09:00</option>
          <option value="12:00">12:00</option>
          <option value="16:00">16:00</option>
          <option value="21:00">21:00</option>
        </select>
      </label>
      <label>月
        <select id="monthFilter"><option value="all">すべて</option></select>
      </label>
      <label>市場
        <select id="marketFilter">
          <option value="all">すべて</option>
          <option value="USD/JPY">USD/JPY</option>
          <option value="EUR/USD">EUR/USD</option>
          <option value="日経225先物">日経225先物</option>
          <option value="金">金</option>
          <option value="原油">原油</option>
          <option value="BTCUSD">BTCUSD</option>
        </select>
      </label>
      <label class="search-field">キーワード
        <input id="searchInput" type="search" placeholder="例：ドル円、原油、米金利、半導体">
      </label>
    </section>

    <section>
      <div class="section-heading">
        <h2>最新レポート</h2>
        <p id="latestTimestamp"></p>
      </div>
      <div id="latestReport"><p class="empty">読み込み中です…</p></div>
    </section>

    <section>
      <div class="section-heading">
        <h2>過去のレポート</h2>
        <p id="resultCount"></p>
      </div>
      <div id="reportList" class="report-list"></div>
      <p id="emptyMessage" class="empty" hidden>該当するレポートがありません。</p>
    </section>
  </main>

  <footer><div class="wrap">© Market Report</div></footer>
  <script src="script.js?v=5"></script>
</body>
</html>
