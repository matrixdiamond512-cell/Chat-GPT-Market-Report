# P1 one-shot Scheduler safety supervisor.
# Deploy only after separate approval; this file is configuration, not an apply.
main:
  params: [args]
  steps:
    - initialize:
        assign:
          - expectedJobId: ${args.expected_job_id}
          - targetJob: ${args.target_job}
          - watchdogJob: ${args.watchdog_job}
          - projectId: ${args.project_id}
          - serviceName: ${args.cloud_run_service}
          - localNow: ${time.format(sys.now(), "Asia/Tokyo")}
          - runDateJst: ${text.substring(localNow, 0, 10)}
          - expectedTimeJst: "07:47"
          - expectedDateTimeJst: ${runDateJst + "T07:47:00+09:00"}
          - expectedEpoch: ${time.parse(expectedDateTimeJst)}
          - logsStart: ${time.format(expectedEpoch - 120)}
          - logsEnd: ${time.format(expectedEpoch + 300)}
          - targetPauseCall: "NOT_RUN"
          - targetReadback: "UNKNOWN"
          - watchdogPauseCall: "NOT_RUN"
          - watchdogReadback: "UNKNOWN"
          - logsRead: false
          - logEntries: []
          - httpStatus: null
          - oidcResult: "INCOMPLETE"
          - jobNameResult: "INCOMPLETE"
          - scheduleTimeResult: "INCOMPLETE"
          - schedulerStatusCode: null
          - schedulerLastAttempt: null
          - lastAttemptLocal: ""
    - pause_target:
        try:
          steps:
            - send_target_pause:
                call: http.post
                args:
                  url: ${"https://cloudscheduler.googleapis.com/v1/" + targetJob + ":pause"}
                  auth:
                    type: OAuth2
                result: targetPauseResponse
            - mark_target_pause_ok:
                assign:
                  - targetPauseCall: "OK"
        except:
          as: pauseError
          steps:
            - mark_target_pause_failed:
                assign:
                  - targetPauseCall: "FAILED"
    - read_target:
        try:
          steps:
            - get_target:
                call: http.get
                args:
                  url: ${"https://cloudscheduler.googleapis.com/v1/" + targetJob}
                  auth:
                    type: OAuth2
                result: targetResponse
            - save_target:
                assign:
                  - targetReadback: ${map.get(targetResponse.body, "state", "UNKNOWN")}
                  - schedulerStatusCode: ${map.get(map.get(targetResponse.body, "status", {}), "code", null)}
                  - schedulerLastAttempt: ${map.get(map.get(targetResponse.body, "status", {}), "lastAttemptTime", null)}
        except:
          as: readTargetError
          steps:
            - mark_target_unreadable:
                assign:
                  - targetReadback: "UNREADABLE"
    - pause_watchdog:
        try:
          steps:
            - send_watchdog_pause:
                call: http.post
                args:
                  url: ${"https://cloudscheduler.googleapis.com/v1/" + watchdogJob + ":pause"}
                  auth:
                    type: OAuth2
                result: watchdogPauseResponse
            - mark_watchdog_pause_ok:
                assign:
                  - watchdogPauseCall: "OK"
        except:
          as: pauseWatchdogError
          steps:
            - mark_watchdog_pause_failed:
                assign:
                  - watchdogPauseCall: "FAILED"
    - read_watchdog:
        try:
          steps:
            - get_watchdog:
                call: http.get
                args:
                  url: ${"https://cloudscheduler.googleapis.com/v1/" + watchdogJob}
                  auth:
                    type: OAuth2
                result: watchdogResponse
            - save_watchdog:
                assign:
                  - watchdogReadback: ${map.get(watchdogResponse.body, "state", "UNKNOWN")}
        except:
          as: readWatchdogError
          steps:
            - mark_watchdog_unreadable:
                assign:
                  - watchdogReadback: "UNREADABLE"
    - format_last_attempt:
        switch:
          - condition: ${schedulerLastAttempt != null}
            next: parse_last_attempt
          - condition: ${true}
            next: query_logs
    - parse_last_attempt:
        try:
          steps:
            - format_attempt:
                assign:
                  - lastAttemptLocal: ${time.format(time.parse(schedulerLastAttempt), "Asia/Tokyo")}
        except:
          as: attemptError
          steps:
            - mark_attempt_unreadable:
                assign:
                  - lastAttemptLocal: "INVALID"
    - query_logs:
        try:
          steps:
            - list_run_logs:
                call: http.post
                args:
                  url: https://logging.googleapis.com/v2/entries:list
                  auth:
                    type: OAuth2
                  body:
                    resourceNames:
                      - ${"projects/" + projectId}
                    orderBy: timestamp asc
                    pageSize: 100
                    filter: ${"resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"" + serviceName + "\" AND timestamp >= \"" + logsStart + "\" AND timestamp <= \"" + logsEnd + "\""}
                result: logResponse
            - save_log_entries:
                assign:
                  - logEntries: ${map.get(logResponse.body, "entries", [])}
                  - logsRead: true
        except:
          as: logError
          steps:
            - mark_logs_unreadable:
                assign:
                  - logEntries: []
                  - logsRead: false
    - scan_logs:
        for:
          value: entry
          in: ${logEntries}
          steps:
            - extract_log_fields:
                assign:
                  - payload: ${map.get(entry, "jsonPayload", {})}
                  - httpRequest: ${map.get(entry, "httpRequest", {})}
                  - eventName: ${map.get(payload, "event", "")}
                  - stageName: ${map.get(payload, "stage", "")}
                  - stageJobId: ${map.get(payload, "jobId", "")}
                  - stageResult: ${map.get(payload, "result", "")}
                  - candidateHttpStatus: ${map.get(payload, "httpStatus", map.get(httpRequest, "status", null))}
            - collect_http_status:
                assign:
                  - httpStatus: ${if(eventName == "P1_INGRESS_RESULT" and stageJobId == expectedJobId, candidateHttpStatus, if(httpStatus == null and candidateHttpStatus != null, candidateHttpStatus, httpStatus))}
            - collect_oidc:
                assign:
                  - oidcResult: ${if(eventName == "P1_AUTO_VERIFY_STAGE" and stageName == "OIDC" and (stageJobId == expectedJobId or stageJobId == "UNLISTED"), stageResult, oidcResult)}
            - collect_job_name:
                assign:
                  - jobNameResult: ${if(eventName == "P1_AUTO_VERIFY_STAGE" and stageName == "JOB_NAME" and (stageJobId == expectedJobId or stageJobId == "UNLISTED"), stageResult, jobNameResult)}
            - collect_schedule_time:
                assign:
                  - scheduleTimeResult: ${if(eventName == "P1_AUTO_VERIFY_STAGE" and stageName == "SCHEDULE_TIME" and stageJobId == expectedJobId, if(stageResult == "FAIL", "FAIL", if(map.get(payload, "schedulerDateJst", "") == runDateJst and map.get(payload, "schedulerTimeJst", "") == expectedTimeJst, "PASS", "FAIL")), scheduleTimeResult)}
    - classify:
        assign:
          - oidcResult: ${if(oidcResult == "INCOMPLETE" and (httpStatus == 401 or httpStatus == 403), "FAIL", oidcResult)}
          - httpResult: ${if(httpStatus == 200, "PASS", if(httpStatus == null, "INCOMPLETE", "FAIL"))}
          - schedulerTimeLocal: ${if(lastAttemptLocal == "", "", text.substring(lastAttemptLocal, 0, 16))}
          - attemptInWindow: ${schedulerTimeLocal >= runDateJst + "T07:46" and schedulerTimeLocal <= runDateJst + "T07:50"}
          - schedulerAttemptResult: ${if(schedulerStatusCode == null or schedulerLastAttempt == null, "INCOMPLETE", if(schedulerStatusCode != 0 or not attemptInWindow, "FAIL", "PASS"))}
          - targetStopResult: ${if(targetReadback == "PAUSED", "PASS", "BLOCKED")}
          - watchdogStopResult: ${if(watchdogReadback == "PAUSED", "PASS", "BLOCKED")}
          - logResult: ${if(logsRead and len(logEntries) > 0, "PASS", "INCOMPLETE")}
          - overall: ${if(targetReadback != "PAUSED" or watchdogReadback != "PAUSED", "BLOCKED", if(httpResult == "FAIL" or oidcResult == "FAIL" or jobNameResult == "FAIL" or scheduleTimeResult == "FAIL" or schedulerAttemptResult == "FAIL", "FAIL", if(httpResult == "PASS" and oidcResult == "PASS" and jobNameResult == "PASS" and scheduleTimeResult == "PASS" and schedulerAttemptResult == "PASS" and logResult == "PASS", "PASS", "INCOMPLETE")))}
          - record:
              schemaVersion: 1
              result: ${overall}
              runDateJst: ${runDateJst}
              expectedJobId: ${expectedJobId}
              expectedSchedulerTimeJst: ${expectedTimeJst}
              httpStatus: ${httpStatus}
              checks:
                http: ${httpResult}
                oidc: ${oidcResult}
                jobName: ${jobNameResult}
                scheduleTime: ${scheduleTimeResult}
                schedulerAttempt: ${schedulerAttemptResult}
                targetPauseReadback: ${targetStopResult}
                watchdogPauseReadback: ${watchdogStopResult}
                logs: ${logResult}
              targetSchedulerState: ${targetReadback}
              watchdogSchedulerState: ${watchdogReadback}
              targetLastAttemptTime: ${schedulerLastAttempt}
              targetSchedulerStatusCode: ${schedulerStatusCode}
              targetPauseCall: ${targetPauseCall}
              watchdogPauseCall: ${watchdogPauseCall}
              logsRead: ${logsRead}
    - write_result_log:
        call: sys.log
        args:
          json: ${record}
          severity: ${if(overall == "PASS", "INFO", if(overall == "FAIL", "ERROR", "WARNING"))}
    - return_result:
        return: ${record}
